# electron-builder config for DUDE's desktop build (Phase 8 Stage 8,
# Milestone 28). Invoked via `npm run electron:package` locally, and by
# `.github/workflows/release.yml` on every `v*.*.*` tag push.
#
# The appx/MSIX target was dropped (PD-025): the Device Agent runs outside the desktop's
# package identity, so the desktop ships as NSIS only.

appId: io.github.arahman200165.dude
productName: DUDE
copyright: Copyright © arahman200165

directories:
  # electron-builder's own default output dir is `dist/`, which would
  # collide with Angular's `dist/dude/browser` and esbuild's `dist/electron`.
  output: release

files:
  - dist/electron/**
  - dist/dude/browser/**
  - package.json

extraResources:
  - from: build/network-icmp.exe
    to: network-icmp.exe
  - from: build/fs-attrs.exe
    to: fs-attrs.exe
  - from: build/windows-sys.exe
    to: windows-sys.exe
  # The resident per-user Device Agent (PD-026), built by `npm run agent:sea`.
  - from: dist/agent/dude-agent.exe
    to: dude-agent.exe
  # The optional Hub (PD-025): its own elevated installer, launched only on an explicit interactive choice,
  # also elevated by the in-app "Update Hub" flow as `<resources>\DUDE-Hub-Setup.exe /S /UPDATE` (the ~96 MB Hub
  # ships once, inside the installer). Built by `npm run hub:stage && npm run hub:installer`.
  - from: dist/hub-installer/DUDE-Hub-Setup.exe
    to: DUDE-Hub-Setup.exe

icon: build/icon.ico

win:
  target:
    - target: nsis

nsis:
  # No code signing in scope for Phase 8 (see the "Explicitly deferred"
  # note in DUDE_PRD.md §21) — oneClick: false lets the user see and accept
  # the standard unsigned-installer SmartScreen "Run anyway" flow.
  oneClick: false
  selectPerMachineByDefault: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  artifactName: 'DUDE-Setup-${version}.${ext}'

publish:
  - provider: github

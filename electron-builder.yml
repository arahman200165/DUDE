# electron-builder config for DUDE's desktop build (Phase 8 Stage 8,
# Milestone 28). Invoked via `npm run electron:package` locally, and by
# `.github/workflows/release.yml` on every `v*.*.*` tag push.
#
# IMPORTANT — the `appx` block below ships PLACEHOLDER Microsoft Store
# package-identity values. The resulting .appx/.msix is real and installs
# fine via sideloading (`Add-AppxPackage`, Developer Mode), but it is NOT
# submittable to the Microsoft Store until `identityName`/`publisher`/
# `publisherDisplayName` are replaced with values reserved through a real
# Microsoft Partner Center account. Store submission itself stays a manual
# process (Partner Center), never automated in CI — see DUDE_PRD.md §21.

appId: io.github.arahman200165.dude
productName: DUDE
copyright: Copyright © arahman200165

directories:
  # electron-builder's own default output dir is `dist/`, which would
  # collide with Angular's `dist/dude/browser` and esbuild's `dist/electron`.
  output: release

files:
  - dist/electron/**
  - dist/dude/browser/**
  - package.json

extraResources:
  - from: build/network-icmp.exe
    to: network-icmp.exe
  - from: build/fs-attrs.exe
    to: fs-attrs.exe

icon: build/icon.ico

win:
  target:
    - target: nsis
    - target: appx

nsis:
  # No code signing in scope for Phase 8 (see the "Explicitly deferred"
  # note in DUDE_PRD.md §21) — oneClick: false lets the user see and accept
  # the standard unsigned-installer SmartScreen "Run anyway" flow.
  oneClick: false
  selectPerMachineByDefault: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  artifactName: 'DUDE-Setup-${version}.${ext}'

appx:
  # --- PLACEHOLDER: replace before any real Store submission ---
  identityName: '12345Placeholder.DUDE' # PLACEHOLDER — Partner Center-reserved package identity name
  publisher: 'CN=00000000-0000-0000-0000-000000000000' # PLACEHOLDER — Partner Center-issued publisher ID
  publisherDisplayName: 'DUDE (placeholder publisher — not yet Partner Center-verified)'
  applicationId: DUDE
  displayName: DUDE
  artifactName: 'DUDE-${version}.${ext}'

publish:
  - provider: github

    <script id="dude-appearance-prepaint" type="text/javascript">
      // Phase 30K: apply the saved appearance to <html> before the first paint (no flash of the
      // default theme). Mirrors sanitize/resolveEffective in core/appearance/appearance.model.ts;
      // appearance-prepaint.spec.ts keeps the key and attribute list in sync. Unknown values are
      // harmless: the generated CSS falls back to the default block. Fonts are set by the service.
      (function () {
        try {
          var raw = localStorage.getItem('dude:v1:settings:appearance');
          var prefs = raw && JSON.parse(raw);
          if (!prefs || typeof prefs !== 'object') return;
          var media = function (query) {
            return !!(window.matchMedia && window.matchMedia(query).matches);
          };
          var axes = [
            ['mode', 'data-theme'],
            ['contrast', 'data-contrast'],
            ['accent', 'data-accent'],
            ['catset', 'data-catset'],
            ['semantic', 'data-semantic'],
            ['density', 'data-density'],
          ];
          for (var i = 0; i < axes.length; i++) {
            var value = prefs[axes[i][0]];
            if (typeof value !== 'string' || !/^[a-z0-9-]{1,32}$/.test(value)) continue;
            if (value === 'system') {
              // Absent attribute = default, so only the non-default outcome needs setting.
              if (axes[i][0] === 'mode' && media('(prefers-color-scheme: light)')) value = 'light';
              else if (axes[i][0] === 'contrast' && media('(prefers-contrast: more)')) value = 'high';
              else continue;
            }
            document.documentElement.setAttribute(axes[i][1], value);
          }
        } catch (e) {
          /* storage unavailable or malformed: the defaults apply */
        }
      })();
    </script>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              // Reverses 404.html's escape: "~and~" -> "&" first, then "~0" -> "~".
              return s.replace(/~and~/g, '&').replace(/~0/g, '~');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      // Phase 26 Item 9: Chromium can fire beforeinstallprompt before Angular boots. Keep it for
      // PwaInstallService so DUDE's own "Install app" button still works.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__dudeInstallPrompt = event;
      });
    </script>

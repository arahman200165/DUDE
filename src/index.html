<!doctype html>

    <title>DUDE — Developer Utility Dashboard Engine</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              // Reverses 404.html's escape: "~and~" -> "&" first, then "~0" -> "~".
              return s.replace(/~and~/g, '&').replace(/~0/g, '~');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      // Phase 26 Item 9: Chromium can fire beforeinstallprompt before Angular boots. Keep it for
      // PwaInstallService so DUDE's own "Install app" button still works.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__dudeInstallPrompt = event;
      });
    </script>

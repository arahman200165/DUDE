<div class="flex h-full flex-col" role="table" aria-label="Tools">
  <div
    role="row"
    class="grid shrink-0 grid-cols-[28px_1fr_110px_150px_90px_1fr] items-center gap-2 border-b border-border bg-panel px-1.5 py-1 text-ui-xs uppercase tracking-wider text-text-muted"
  >
    <span role="columnheader"></span>
    <span role="columnheader">Tool</span>
    <span role="columnheader">Category</span>
    <span role="columnheader">Platform</span>
    <span role="columnheader">Status</span>
    <span role="columnheader">Capabilities</span>
  </div>

  <cdk-virtual-scroll-viewport [itemSize]="rowHeight" class="min-h-0 flex-1">
    <div
      *cdkVirtualFor="let tool of rows(); trackBy: trackById"
      role="row"
      [style.height.px]="rowHeight"
      class="grid grid-cols-[28px_1fr_110px_150px_90px_1fr] items-center gap-2 border-b border-border/60 px-1.5 text-xs hover:bg-panel-elevated"
    >
      <button
        type="button"
        role="cell"
        class="h-full text-text-muted hover:text-accent"
        [class.text-accent]="isFavorite(tool.id)"
        [attr.aria-pressed]="isFavorite(tool.id)"
        [attr.aria-label]="(isFavorite(tool.id) ? 'Unfavorite ' : 'Favorite ') + tool.title"
        (click)="toggleFavorite(tool.id, $event)"
      >
        {{ isFavorite(tool.id) ? '★' : '☆' }}
      </button>

      <a
        role="cell"
        [routerLink]="tool.route"
        [appOfflineAvailability]="tool.id"
        (click)="toolOpened.emit(tool.id)"
        class="flex min-w-0 items-center gap-1.5 truncate"
        [class]="'text-' + meta[tool.category].colorToken + '-tint hover:underline'"
      >
        <app-category-icon [category]="tool.category" class="h-3.5 w-3.5 shrink-0" [class]="'text-' + meta[tool.category].colorToken" />
        <span class="truncate">{{ tool.title }}</span>
      </a>

      <span role="cell" class="truncate" [class]="'text-' + meta[tool.category].colorToken">{{ meta[tool.category].label }}</span>

      <span role="cell">
        <app-desktop-capability-badge [definition]="tool" />
      </span>

      <span role="cell">
        <span class="inline-flex items-center rounded-sm border px-1 py-0.5 text-ui-xs" [class]="statusClass(tool.status)">
          {{ statusLabel(tool.status) }}
        </span>
      </span>

      <span role="cell" class="truncate text-text-muted" [title]="capabilitySummary(tool)">{{ capabilitySummary(tool) }}</span>
    </div>
  </cdk-virtual-scroll-viewport>
</div>

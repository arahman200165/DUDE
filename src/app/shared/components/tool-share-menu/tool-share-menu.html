<div class="relative">
  <button
    type="button"
    class="rounded border border-border px-1.5 py-0.5 text-ui-xs text-text-muted hover:border-accent hover:text-accent"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    title="Share a link to this tool"
    (click)="toggle()"
  >
    Share
  </button>
  @if (open()) {
    <div role="menu" class="absolute right-0 top-full z-20 mt-1 flex w-72 flex-col gap-1 rounded-sm border border-border bg-panel-elevated p-2 shadow-lg">
      <button type="button" role="menuitem" class="rounded-sm px-2 py-1 text-left text-ui text-text hover:bg-panel" (click)="copyLink()">
        Copy link
      </button>
      @if (canShareInput()) {
        <button type="button" role="menuitem" class="rounded-sm px-2 py-1 text-left text-ui text-text hover:bg-panel" (click)="copyLinkWithInput()">
          Copy link with input
        </button>
        <p class="px-2 text-ui-xs text-text-muted">
          Embeds this tool's current input in the link. Anyone with the link can read it, and it may stay in browser history or
          chat previews. It never reaches a server.
        </p>
      }
      <ng-content />
      @if (status()) {
        <p class="px-2 text-ui-xs text-info" role="status">{{ status() }}</p>
      }
    </div>
  }
</div>

@if (related().length) {
  <section class="mt-4 border-t border-border pt-3">
    <h2 class="mb-1.5 text-ui-sm font-semibold uppercase tracking-wider text-text-muted">Related tools</h2>
    <div class="flex flex-wrap gap-2">
      @for (tool of related(); track tool.id) {
        <a
          [routerLink]="tool.route"
          class="flex items-center gap-1.5 rounded-sm border px-2 py-1 text-xs hover:bg-panel-elevated"
          [class]="'border-' + meta[tool.category].colorToken + '/40 bg-' + meta[tool.category].colorToken + '-wash text-' + meta[tool.category].colorToken + '-tint'"
        >
          <app-category-icon [category]="tool.category" class="h-3.5 w-3.5" [class]="'text-' + meta[tool.category].colorToken" />
          {{ tool.shortTitle ?? tool.title }}
        </a>
      }
    </div>
  </section>
}

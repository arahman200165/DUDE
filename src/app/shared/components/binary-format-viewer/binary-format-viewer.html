<div class="flex h-full min-h-0 flex-col gap-3">
  <app-file-drop [accept]="accept()" [label]="dropLabel()" (fileSelected)="onFileSelected($event)" (rejected)="onRejected($event)" />

  <div class="flex items-center gap-3 text-ui text-text-muted">
    @if (fileName(); as name) {
      <span class="font-mono text-text">{{ name }}</span>
    }
    <app-busy-indicator [status]="status()" />
  </div>

  <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border bg-panel p-2">
    @if (errorMessage(); as message) {
      <app-error-panel [message]="message" />
    } @else if (tableColumns(); as columns) {
      <app-workbench-table [columns]="columns | simpleColumns" [rows]="tableRows() ?? []" />
    } @else if (treeNodes(); as nodes) {
      <app-tree-view [nodes]="nodes" />
    }
  </div>
</div>

<section class="flex h-full flex-col">
  <header
    class="flex items-center justify-between border-b-2 border-border px-3 py-2"
    [class]="categoryMeta() ? 'border-b-' + categoryMeta()!.colorToken : ''"
  >
    <div class="flex items-center gap-2">
      @if (categoryMeta(); as meta) {
        <app-category-icon [category]="category()!" class="h-4 w-4" [class]="'text-' + meta.colorToken" />
      }
      <h1 class="text-sm font-semibold tracking-wide text-text">{{ definition()?.title }}</h1>
    </div>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded border border-border px-1.5 py-0.5 text-ui-xs text-text-muted hover:border-accent hover:text-accent"
        title="Send to scratchpad"
        (click)="sendToScratchpad()"
      >
        + Scratchpad
      </button>
      @if (definition(); as def) {
        <a
          [routerLink]="['/history']"
          [queryParams]="{ tool: def.id }"
          class="rounded border border-border px-1.5 py-0.5 text-ui-xs text-text-muted hover:border-accent hover:text-accent"
          title="View history for this tool"
        >
          History
        </a>
      }
      <app-security-badge [definition]="definition()" />
      <app-offline-badge [show]="showOfflineBadge()" />
      <span
        class="rounded border px-1.5 py-0.5 font-mono text-ui-xs uppercase tracking-wide"
        [class]="statusBadge().classes"
        >{{ statusBadge().label }}</span
      >
    </div>
  </header>
  <div class="flex-1 overflow-auto p-3">
    <ng-content />
  </div>
</section>

<div
  cdkTrapFocus
  cdkTrapFocusAutoCapture
  class="flex max-h-[70vh] w-[43.08rem] max-w-[90vw] flex-col overflow-hidden rounded-sm border border-border bg-panel shadow-lg"
  (keydown.arrowdown)="onArrowDown($event)"
  (keydown.arrowup)="onArrowUp($event)"
  (keydown.enter)="onEnter()"
  (keydown.escape)="onEscape()"
>
  <input
    #searchInput
    type="text"
    placeholder="Search tools…"
    class="w-full border-b border-border bg-panel px-3 py-2 text-sm text-text placeholder:text-text-muted/60 focus:outline-none"
    [value]="query()"
    (input)="onQueryInput($event)"
  />

  <div class="overflow-y-auto p-2">
    @if (groupedResults().length) {
      @for (group of groupedResults(); track group.category) {
        <div class="mb-1.5 last:mb-0">
          <div class="flex items-center gap-1.5 px-1.5 py-1">
            <span
              class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full"
              [class]="'bg-' + meta[group.category].colorToken + '/15'"
            >
              <app-category-icon
                [category]="group.category"
                class="h-3.5 w-3.5"
                [class]="'text-' + meta[group.category].colorToken"
              />
            </span>
            <span class="text-ui-sm font-semibold uppercase tracking-wider" [class]="'text-' + meta[group.category].colorToken">
              {{ meta[group.category].label }}
            </span>
          </div>

          @for (tool of group.tools; track tool.id) {
            <button
              type="button"
              class="flex w-full items-center gap-1.5 rounded-sm border-l-2 px-1.5 py-1 text-left text-xs hover:bg-panel-elevated"
              [class]="
                isSelected(tool)
                  ? 'border-l-accent bg-' + meta[group.category].colorToken + '/20 text-text'
                  : 'border-l-transparent text-' + meta[group.category].colorToken + '-tint'
              "
              (click)="open(tool)"
            >
              <span class="h-1 w-1 shrink-0 rounded-full" [class]="'bg-' + meta[group.category].colorToken"></span>
              <span class="flex-1">{{ tool.title }}</span>
              @if (canQuickRun(tool)) {
                <span
                  class="shrink-0 rounded-sm border border-accent/40 px-1 text-ui-xs text-accent hover:bg-accent/10"
                  title="Quick Run"
                  (click)="openQuickRun(tool, $event)"
                >
                  ⚡
                </span>
              }
            </button>
          }
        </div>
      }
    } @else {
      <p class="px-1.5 py-1 text-ui text-text-muted/60">No tools match "{{ query() }}".</p>
    }
  </div>
</div>

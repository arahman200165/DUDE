<div
  cdkTrapFocus
  cdkTrapFocusAutoCapture
  class="flex max-h-[70vh] w-[43.08rem] max-w-[90vw] flex-col overflow-hidden rounded-sm border border-border bg-panel shadow-lg"
  (keydown.arrowdown)="onArrowDown($event)"
  (keydown.arrowup)="onArrowUp($event)"
  (keydown.enter)="onEnter()"
  (keydown.escape)="onEscape()"
>
  <input
    #searchInput
    type="text"
    placeholder="Search tools and commands…"
    class="w-full border-b border-border bg-panel px-3 py-2 text-sm text-text placeholder:text-text-muted/60 focus:outline-none"
    [value]="query()"
    (input)="onQueryInput($event)"
  />

  <div class="overflow-y-auto p-2">
    @if (groupedResults().length) {
      @for (group of groupedResults(); track group.key) {
        <div class="mb-1.5 last:mb-0">
          <div class="flex items-center gap-1.5 px-1.5 py-1">
            @if (group.category; as category) {
              <span
                class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full"
                [class]="'bg-' + meta[category].colorToken + '/15'"
              >
                <app-category-icon
                  [category]="category"
                  class="h-3.5 w-3.5"
                  [class]="'text-' + meta[category].colorToken"
                />
              </span>
            }
            <span class="text-ui-sm font-semibold uppercase tracking-wider"
              [class]="group.category ? 'text-' + meta[group.category].colorToken : 'text-text-muted'">
              {{ group.label }}
            </span>
          </div>

          @for (command of group.commands; track command.id) {
            <button
              type="button"
              class="flex w-full items-center gap-1.5 rounded-sm border-l-2 px-1.5 py-1 text-left text-xs hover:bg-panel-elevated"
              [class]="
                isSelected(command)
                  ? 'border-l-accent bg-' + (group.category ? meta[group.category].colorToken : 'accent') + '/20 text-text'
                  : 'border-l-transparent ' + (group.category ? 'text-' + meta[group.category].colorToken + '-tint' : 'text-text-muted')
              "
              (click)="open(command)"
            >
              @if (group.category; as category) {
                <span class="h-1 w-1 shrink-0 rounded-full" [class]="'bg-' + meta[category].colorToken"></span>
              }
              <span class="flex-1">{{ command.title }}</span>
              @if (canQuickRun(command)) {
                <span
                  class="shrink-0 rounded-sm border border-accent/40 px-1 text-ui-xs text-accent hover:bg-accent/10"
                  title="Quick Run"
                  (click)="openQuickRun(command, $event)"
                >
                  &#9889;
                </span>
              }
            </button>
          }
        </div>
      }
    } @else {
      <p class="px-1.5 py-1 text-ui text-text-muted/60">No results for "{{ query() }}".</p>
    }
  </div>
</div>

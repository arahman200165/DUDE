<section class="flex h-full flex-col">
  <header class="flex items-center justify-between border-b-2 border-border px-3 py-2">
    <h1 class="text-sm font-semibold tracking-wide text-text">Smart Paste</h1>
    <button
      type="button"
      class="rounded-sm border border-border px-2 py-0.5 text-ui-sm text-text-muted hover:bg-panel-elevated"
      (click)="panel.clear()"
    >
      Clear
    </button>
  </header>

  <div class="flex flex-1 flex-col gap-3 overflow-auto p-3">
    <p class="text-ui text-text-muted">
      Paste something you don't recognize — a JSON blob, a JWT, a UUID, a URL, and more — to jump
      straight to the tool that understands it. Nothing pasted here is ever saved.
    </p>

    <app-paste-detect-panel #panel />
  </div>
</section>

<div class="flex h-full flex-col">
  <app-template-gallery />
  @if (layout.changedInAnotherTab()) {
    <div class="flex flex-wrap items-center gap-2 border-b border-info/40 bg-info/10 px-3 py-1 text-ui text-info" role="status">
      <span class="flex-1">Your workspace layout changed in another DUDE tab.</span>
      <button type="button" class="rounded-sm border border-info/40 px-1.5 py-0.5 text-ui-xs" (click)="layout.adoptOtherTabLayout()">Use that layout</button>
      <button type="button" class="rounded-sm border border-info/40 px-1.5 py-0.5 text-ui-xs" (click)="layout.keepThisTabLayout()">Keep mine</button>
    </div>
  }
  <app-tab-strip />

  <div class="min-h-0 flex-1">
    @if (layout.panelTree(); as tree) {
      <app-panel-host [node]="tree" />
    } @else {
      <div class="flex h-full flex-col items-center justify-center gap-2 text-text-muted">
        <p class="text-ui">No tools open yet.</p>
        <button
          type="button"
          class="rounded-sm border border-accent px-2 py-0.5 text-ui text-accent hover:bg-accent/10"
          (click)="openPicker()"
        >
          Open a tool <app-shortcut-hint />
        </button>
      </div>
    }
  </div>

  <app-scratchpad-drawer />
</div>

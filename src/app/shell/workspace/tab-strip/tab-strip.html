<div class="flex items-center gap-1 overflow-x-auto border-b border-border bg-panel px-2 py-1">
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      class="group flex shrink-0 items-center gap-1.5 rounded-sm border px-2 py-1 text-ui-sm"
      [class]="
        isFocused(tab.id)
          ? 'border-accent bg-panel-elevated text-text'
          : 'border-transparent text-text-muted hover:bg-panel-elevated hover:text-text'
      "
      [class.opacity-60]="!isVisible(tab.id)"
      (click)="focus(tab.id)"
    >
      <app-category-icon [category]="tab.category" class="h-3.5 w-3.5" [class]="'text-' + meta[tab.category].colorToken" />
      <span>{{ tab.shortTitle ?? tab.title }}</span>
      <span
        class="ml-1 hidden rounded-sm px-1 text-ui-xs text-text-muted hover:bg-panel hover:text-text group-hover:inline"
        title="Split right"
        (click)="splitRight(tab.id, $event)"
        >⊞</span
      >
      <span
        class="rounded-sm px-1 text-ui-xs text-text-muted hover:bg-panel hover:text-text"
        title="Close"
        (click)="close(tab.id, $event)"
        >×</span
      >
    </button>
  }

  <button
    type="button"
    class="shrink-0 rounded-sm border border-border px-2 py-1 text-ui-sm text-text-muted hover:bg-panel-elevated hover:text-text"
    title="Open a tool (Ctrl+K)"
    (click)="openPicker()"
  >
    +
  </button>

  <div class="flex-1"></div>
  <app-workspace-overrides />
</div>

<div class="h-full w-full overflow-auto">
  @if (chunkFailed()) {
    <app-tool-load-failure [toolId]="toolId()" />
  } @else if (loadError(); as error) {
    <app-error-panel [message]="error" />
  } @else if (componentType(); as type) {
    <ng-container *ngComponentOutlet="type; injector: childInjector()!" />
  } @else {
    <div class="flex h-full items-center justify-center">
      <app-busy-indicator status="running" />
    </div>
  }
</div>

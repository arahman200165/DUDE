@if (projects().length) {
  <section class="mb-3">
    <h2 class="mb-1.5 text-ui-sm font-semibold uppercase tracking-wider text-text-muted">Recent Projects</h2>
    <div class="flex gap-2 overflow-x-auto pb-1">
      @for (project of projects(); track project.id) {
        <button
          type="button"
          (click)="activate(project)"
          class="flex shrink-0 flex-col gap-0.5 rounded-sm border border-accent/40 bg-accent/10 px-2 py-1.5 text-left text-xs text-accent hover:bg-accent/20"
        >
          <span>{{ project.name }}</span>
          <span class="text-ui-xs text-accent/70">{{ project.openTabs.length }} tool{{ project.openTabs.length === 1 ? '' : 's' }}</span>
        </button>
      }
    </div>
  </section>
}

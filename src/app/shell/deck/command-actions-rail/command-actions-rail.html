@if (commands().length) {
  <section class="mb-3">
    <h2 class="mb-1.5 text-ui-sm font-semibold uppercase tracking-wider text-text-muted">{{ title() }}</h2>
    <div class="flex gap-2 overflow-x-auto pb-1">
      @for (command of commands(); track command.id) {
        <button
          type="button"
          (click)="run(command)"
          class="flex shrink-0 items-center gap-1.5 rounded-sm border border-border bg-panel px-2 py-1.5 text-left text-xs text-text hover:bg-panel-elevated"
        >
          {{ command.title }}
        </button>
      }
    </div>
  </section>
}

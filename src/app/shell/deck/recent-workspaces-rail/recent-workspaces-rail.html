@if (templates().length) {
  <section class="mb-3">
    <h2 class="mb-1.5 text-ui-sm font-semibold uppercase tracking-wider text-text-muted">Recent Workspaces</h2>
    <div class="flex gap-2 overflow-x-auto pb-1">
      @for (template of templates(); track template.id) {
        <button
          type="button"
          (click)="apply(template)"
          class="flex shrink-0 flex-col gap-0.5 rounded-sm border border-border bg-panel px-2 py-1.5 text-left text-xs hover:bg-panel-elevated"
        >
          <span class="text-text">{{ template.name }}</span>
          <span class="text-ui-xs text-text-muted">{{ template.openTabs.length }} tool{{ template.openTabs.length === 1 ? '' : 's' }}</span>
        </button>
      }
    </div>
  </section>
}

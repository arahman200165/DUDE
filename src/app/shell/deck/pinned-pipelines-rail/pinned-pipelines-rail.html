@if (pipelines().length) {
  <section class="mb-3">
    <h2 class="mb-1.5 text-ui-sm font-semibold uppercase tracking-wider text-text-muted">Pinned Pipelines</h2>
    <div class="flex gap-2 overflow-x-auto pb-1">
      @for (pipeline of pipelines(); track pipeline.id) {
        <a
          [routerLink]="['/pipelines', pipeline.id]"
          class="flex shrink-0 flex-col gap-0.5 rounded-sm border border-accent/40 bg-accent/10 px-2 py-1.5 text-xs text-accent hover:bg-accent/20"
        >
          <span>{{ pipeline.name }}</span>
          <span class="text-ui-xs text-accent/70">{{ pipeline.steps.length }} step{{ pipeline.steps.length === 1 ? '' : 's' }}</span>
        </a>
      }
    </div>
  </section>
}

<div class="flex items-center gap-2">
  <input
    type="text"
    placeholder="Search tools…"
    aria-label="Search tools"
    class="w-full flex-1 rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text placeholder:text-text-muted/60 focus:outline-none focus:ring-1 focus:ring-accent"
    [value]="query()"
    (input)="onQueryInput($event)"
    (keydown.enter)="search()"
  />
  <button
    type="button"
    class="flex shrink-0 items-center gap-1 rounded-sm border border-border px-1.5 py-1 text-ui-xs text-text-muted hover:bg-panel-elevated hover:text-text"
    title="Open the Command Palette"
    (click)="paletteService.open()"
  >
    <span>Jump to…</span>
    <app-shortcut-hint />
  </button>
</div>

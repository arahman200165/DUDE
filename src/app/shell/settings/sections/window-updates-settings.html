<div class="flex flex-col gap-3 text-ui text-text">
  <p class="text-ui text-text-muted">
    You can choose whether DUDE minimizes to the tray on close; use the tray menu or "Quit DUDE" to fully exit.
  </p>

  <label data-setting class="flex items-center gap-2">
    <input type="checkbox" class="accent-accent" [checked]="launchOnLogin()" (change)="toggleLaunchOnLogin($event)" />
    Launch DUDE on login
  </label>
  @if (launchOnLoginError()) {
    <app-error-panel [message]="launchOnLoginError()" />
  }

  <label data-setting class="flex items-center gap-2">
    <input type="checkbox" class="accent-accent" [checked]="desktopPrefs.current().closeToTray" (change)="setPreference('closeToTray', checkbox($event))" />
    Close to tray instead of quitting
  </label>
  <label data-setting class="flex items-center gap-2">
    <input type="checkbox" class="accent-accent" [checked]="desktopPrefs.current().launchMinimized" (change)="setPreference('launchMinimized', checkbox($event))" />
    Start minimized to tray
  </label>
  <label data-setting class="flex items-center gap-2">
    <input type="checkbox" class="accent-accent" [checked]="desktopPrefs.current().rememberWindowBounds" (change)="setPreference('rememberWindowBounds', checkbox($event))" />
    Remember window size and position
  </label>

  <label data-setting class="flex flex-col gap-1">
    Preferred display
    <select class="w-fit rounded-sm border border-border bg-panel px-2 py-1" [value]="desktopPrefs.current().preferredDisplayId ?? ''" (change)="displayChanged($event)">
      <option value="">Primary display</option>
      @for (display of desktopPrefs.displays(); track display.id) {
        <option [value]="display.id">{{ display.label }}{{ display.primary ? ' (primary)' : '' }}</option>
      }
    </select>
  </label>

  <div class="flex flex-col gap-3 border-t border-border pt-4">
    <label data-setting class="flex flex-col gap-1">
      Updates
      <select class="w-fit rounded-sm border border-border bg-panel px-2 py-1" [value]="desktopPrefs.current().updateMode" (change)="setPreference('updateMode', selectValue($event))">
        <option value="auto-download">Automatically check and download</option>
        <option value="notify">Check and notify before download</option>
        <option value="manual">Manual checks only</option>
      </select>
    </label>
    <button type="button" class="w-fit rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="checkForUpdates()">Check for updates now</button>
    <label data-setting class="flex items-center gap-2">
      <input type="checkbox" class="accent-accent" [checked]="desktopPrefs.current().notifyUpdates" (change)="setPreference('notifyUpdates', checkbox($event))" />
      Notify me about updates
    </label>
    <label data-setting class="flex items-center gap-2">
      <input type="checkbox" class="accent-accent" [checked]="desktopPrefs.current().notifyCollaboration" (change)="setPreference('notifyCollaboration', checkbox($event))" />
      Notify me when collaborators join or leave
    </label>
  </div>

  <div class="flex items-center gap-3 border-t border-border pt-4">
    <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-text-muted hover:bg-panel-elevated" (click)="resetToDefaults()">
      Reset to defaults
    </button>
    @if (message()) {
      <span class="text-info" role="status">{{ message() }}</span>
    }
  </div>
</div>

<div class="flex h-screen w-screen overflow-hidden bg-bg text-text">
  @if (!quickLauncher.compact()) {
  <app-sidebar />
  <main class="min-w-0 flex-1 overflow-auto">
    <div class="pointer-events-none fixed right-3 top-3 z-50 flex flex-col items-end gap-1.5">
      <div class="pointer-events-auto">
        <app-offline-badge [show]="offline()" />
      </div>
      <div class="pointer-events-auto">
        <app-update-badge />
      </div>
    </div>
    <div class="pointer-events-none fixed bottom-4 left-1/2 z-50 -translate-x-1/2">
      <app-ambient-paste-chip />
    </div>
    @if (desktopOpen.error()) {
      <div class="fixed bottom-4 right-4 z-50 max-w-lg rounded border border-error/50 bg-panel p-3 text-ui text-error" role="alert">
        {{ desktopOpen.error() }}
        <button type="button" class="ml-3 underline" (click)="desktopOpen.error.set('')">Dismiss</button>
      </div>
    }
    @if (deepLink.error()) {
      <div class="fixed bottom-20 right-4 z-50 max-w-lg rounded border border-error/50 bg-panel p-3 text-ui text-error" role="alert">
        {{ deepLink.error() }}
        <button type="button" class="ml-3 underline" (click)="deepLink.error.set('')">Dismiss</button>
      </div>
    }
    <app-crash-recovery-notice />
    <router-outlet />
  </main>
  <app-onboarding />
  }
  <app-global-drop-router />
</div>

<div class="flex h-full flex-col p-3">
  <div class="mb-2 flex items-center justify-between">
    <h1 class="font-mono text-sm font-semibold text-text">Browse Tools</h1>
    <span class="text-ui-xs text-text-muted">All tools — {{ total() }}</span>
  </div>

  <div class="mb-2 flex flex-wrap items-center gap-2">
    <input
      type="text"
      placeholder="Search tools… (try category:security jwt)"
      class="w-64 rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text placeholder:text-text-muted/60 focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="query()"
      (input)="onQueryInput($event)"
    />

    <app-browse-query-help />

    <select
      class="rounded-sm border border-border bg-panel px-1.5 py-1 text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="categoryFacet()"
      (change)="onCategoryChange($event)"
    >
      <option value="all">All categories</option>
      @for (category of categories; track category) {
        <option [value]="category">{{ meta[category].label }}</option>
      }
    </select>

    <select
      class="rounded-sm border border-border bg-panel px-1.5 py-1 text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="statusFacet()"
      (change)="onStatusChange($event)"
    >
      <option value="all">All statuses</option>
      @for (status of statusFacets; track status) {
        @if (status !== 'all') {
          <option [value]="status">{{ status }}</option>
        }
      }
    </select>

    <div class="flex items-center gap-1" role="radiogroup" aria-label="Filter by platform">
      @for (facet of platformFacets; track facet.id) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="platformFacet() === facet.id"
          class="rounded-sm border px-1.5 py-0.5 text-ui-xs"
          [class]="platformFacet() === facet.id ? 'border-accent/60 bg-accent/10 text-accent' : 'border-border text-text-muted hover:text-text'"
          (click)="platformFacet.set(facet.id)"
        >
          {{ facet.label }}
        </button>
      }
    </div>

    <button
      type="button"
      [attr.aria-pressed]="favoritesOnly()"
      class="rounded-sm border px-1.5 py-0.5 text-ui-xs"
      [class]="favoritesOnly() ? 'border-accent/60 bg-accent/10 text-accent' : 'border-border text-text-muted hover:text-text'"
      (click)="favoritesOnly.set(!favoritesOnly())"
    >
      ★ Favorites
    </button>

    <button
      type="button"
      [attr.aria-pressed]="recentOnly()"
      class="rounded-sm border px-1.5 py-0.5 text-ui-xs"
      [class]="recentOnly() ? 'border-accent/60 bg-accent/10 text-accent' : 'border-border text-text-muted hover:text-text'"
      (click)="recentOnly.set(!recentOnly())"
    >
      Recent
    </button>

    <select
      class="rounded-sm border border-border bg-panel px-1.5 py-1 text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      aria-label="Sort by"
      [value]="sortMode()"
      (change)="onSortChange($event)"
    >
      @for (mode of sortModes; track mode.id) {
        <option [value]="mode.id">{{ mode.label }}</option>
      }
    </select>

    <div class="ml-auto flex items-center gap-1" role="radiogroup" aria-label="View mode">
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="viewMode() === 'table'"
        class="rounded-sm border px-1.5 py-0.5 text-ui-xs"
        [class]="viewMode() === 'table' ? 'border-accent/60 bg-accent/10 text-accent' : 'border-border text-text-muted hover:text-text'"
        (click)="viewMode.set('table')"
      >
        Table
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="viewMode() === 'grid'"
        class="rounded-sm border px-1.5 py-0.5 text-ui-xs"
        [class]="viewMode() === 'grid' ? 'border-accent/60 bg-accent/10 text-accent' : 'border-border text-text-muted hover:text-text'"
        (click)="viewMode.set('grid')"
      >
        Grid
      </button>
    </div>
  </div>

  <div class="min-h-0 flex-1">
    @if (sorted().length) {
      @if (viewMode() === 'grid') {
        <app-tool-grid [rows]="sorted()" />
      } @else {
        <app-tool-table [rows]="sorted()" />
      }
    } @else {
      <p class="text-xs text-text-muted">No tools match "{{ query() }}".</p>
    }
  </div>
</div>

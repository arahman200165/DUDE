<div class="flex flex-col gap-2">

  <div class="grid gap-2 md:grid-cols-2">
    <app-activity-trend-panel />
    <app-category-usage-panel [limit]="compact() ? 5 : 8" />
  </div>

  <div class="grid gap-2" [class.lg:grid-cols-2]="compact()">
    <app-top-tools-table [limit]="compact() ? 5 : 15" [compact]="compact()" />

  </div>

  <app-home-notes-panel />
</div>

<div class="flex h-full flex-col gap-3 bg-bg p-3 text-text">
  <h1 class="font-mono text-sm font-semibold">Phase 30C primitives preview (dev only)</h1>

  <div class="flex gap-2">
    <button type="button" class="rounded-sm border border-border px-2 py-1 text-xs hover:bg-panel-elevated" (click)="toggleLoading()">
      Toggle loading
    </button>
    <button type="button" class="rounded-sm border border-border px-2 py-1 text-xs hover:bg-panel-elevated" (click)="toggleEmpty()">
      Toggle empty
    </button>
  </div>

  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <app-dashboard-panel title="Favorites" category="security" [itemCount]="rows().length" [loading]="loading()" [empty]="empty()" viewAllLabel="View all">
      <ul class="flex flex-col gap-1 text-xs">
        @for (row of rows(); track row.tool) {
          <li class="truncate">{{ row.tool }} — {{ row.uses }} uses</li>
        }
      </ul>
      <span panelEmpty>No favorites yet.</span>
    </app-dashboard-panel>

    <app-dashboard-panel title="Activity trend" category="developer" [loading]="loading()" [empty]="empty()">
      <app-sparkline-chart [points]="sparklinePoints" label="Opens per day" />
      <span panelEmpty>Not enough activity yet.</span>
    </app-dashboard-panel>
  </div>

  <app-dashboard-panel title="Category usage" category="data" [loading]="loading()" [empty]="empty()">
    <app-ranked-bars-chart [items]="rankedItems" label="Uses by category" />
    <span panelEmpty>No usage recorded yet.</span>
  </app-dashboard-panel>

  <div class="min-h-0 flex-1 rounded-sm border border-border">
    <app-data-table [columns]="columns" [rows]="rows()" [dense]="true" ariaLabel="Demo tools">
      <ng-template appDataTableCell="category" let-row>
        <span class="inline-flex items-center rounded-sm border border-border px-1 py-0.5 text-ui-xs">{{ row.category }}</span>
      </ng-template>
    </app-data-table>
  </div>
</div>

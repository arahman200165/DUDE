<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">JWKS document</span>
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="clear()"
        >
          Clear
        </button>
      </div>
      <textarea
        rows="8"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder='{"keys": [{"kty": "RSA", "kid": "...", "n": "...", "e": "AQAB"}]}'
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="h-64">
          <app-data-table [columns]="columns" [rows]="rows()" />
        </div>

        <div class="flex flex-col gap-3">
          @for (key of current.keys; track $index) {
            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-between">
                <span class="text-ui text-text-muted">{{ key.kid ?? 'Key ' + ($index + 1) }}</span>
                <app-copy-button [text]="raw(key)" label="Copy raw JWK" />
              </div>
              <pre class="w-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text">{{ raw(key) }}</pre>
            </div>
          }
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

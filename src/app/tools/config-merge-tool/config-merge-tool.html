<app-tool-shell>
  <div class="flex flex-col gap-4">
    <p class="text-ui text-text-muted">Sources are merged in order — later sources override earlier ones.</p>

    <div class="flex flex-col gap-3">
      @for (source of sources(); track $index) {
        <div class="flex flex-col gap-1 rounded-sm border border-border p-2">
          <div class="flex items-center justify-between">
            <select
              class="rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
              [value]="source.format"
              (change)="onFormatChange($index, $event)"
            >
              <option value="env">.env</option>
              <option value="ini">INI</option>
              <option value="properties">.properties</option>
              <option value="yaml">YAML</option>
              <option value="json">JSON</option>
            </select>
            <button
              type="button"
              class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
              (click)="removeSource($index)"
            >
              Remove
            </button>
          </div>
          <textarea
            rows="4"
            class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="source.text"
            (input)="onTextInput($index, $event)"
          ></textarea>
        </div>
      }
    </div>

    <button
      type="button"
      class="w-fit rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
      (click)="addSource()"
    >
      Add source
    </button>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
          <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ current.output }}</pre>
          <app-copy-button [text]="current.output" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

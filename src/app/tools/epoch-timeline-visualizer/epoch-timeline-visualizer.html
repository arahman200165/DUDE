<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex overflow-hidden rounded-sm border border-border text-ui">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'multi'"
          [class.text-bg]="mode() === 'multi'"
          [class.text-text-muted]="mode() !== 'multi'"
          (click)="setMode('multi')"
        >
          Multiple timestamps
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'range'"
          [class.text-bg]="mode() === 'range'"
          [class.text-text-muted]="mode() !== 'range'"
          (click)="setMode('range')"
        >
          Range
        </button>
      </div>

      <label class="flex items-center gap-1.5 text-ui text-text-muted">
        <input type="checkbox" [checked]="includeNow()" (change)="onIncludeNowChange($event)" />
        Show "now" marker
      </label>
    </div>

    @if (mode() === 'multi') {
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        One timestamp per line — epoch seconds, epoch milliseconds, or ISO 8601 — optionally followed by <span class="font-mono">| label</span>
        <textarea
          rows="5"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="multiText()"
          (input)="onMultiTextChange($event)"
        ></textarea>
      </label>
    } @else {
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Start
          <input
            type="datetime-local"
            class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="rangeStart()"
            (input)="onRangeStartChange($event)"
          />
        </label>
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          End
          <input
            type="datetime-local"
            class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="rangeEnd()"
            (input)="onRangeEndChange($event)"
          />
        </label>
      </div>
    }

    @if (result(); as current) {
      @if (current.ok) {
        <div class="rounded-sm border border-border p-4">
          <app-timeline [markers]="current.markers" [rangeStartMs]="current.rangeStartMs" [rangeEndMs]="current.rangeEndMs" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-3">
      <div class="flex flex-col gap-2 rounded-sm border border-border bg-panel p-2">
        <span class="text-ui text-text-muted">Container</span>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            grid-template-columns
            <input type="text" class="rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text" [value]="container().columns" (input)="onTextInput('columns', $event)" />
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            grid-template-rows
            <input type="text" class="rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text" [value]="container().rows" (input)="onTextInput('rows', $event)" />
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            column-gap (px)
            <input type="number" min="0" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().columnGap" (input)="onGapInput('columnGap', $event)" />
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            row-gap (px)
            <input type="number" min="0" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().rowGap" (input)="onGapInput('rowGap', $event)" />
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            justify-items
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().justifyItems" (change)="onSelect('justifyItems', $event)">
              @for (opt of justifyAlignOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            align-items
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().alignItems" (change)="onSelect('alignItems', $event)">
              @for (opt of justifyAlignOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </label>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        @for (item of items(); track $index; let i = $index) {
          <div class="flex flex-wrap items-end gap-2 rounded-sm border border-border bg-panel p-2">
            <span class="w-6 text-ui text-text-muted">#{{ i + 1 }}</span>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              grid-column
              <input type="text" class="w-24 rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text" placeholder="auto, 1 / 3, span 2" [value]="item.gridColumn" (input)="onItemInput(i, 'gridColumn', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              grid-row
              <input type="text" class="w-24 rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text" placeholder="auto, 1 / 3, span 2" [value]="item.gridRow" (input)="onItemInput(i, 'gridRow', $event)" />
            </label>
            @if (items().length > 1) {
              <button type="button" class="text-ui text-text-muted hover:text-error" (click)="removeItem(i)">Remove</button>
            }
          </div>
        }
        <button type="button" class="self-start rounded-sm border border-border px-2 py-1 text-ui text-text-muted hover:bg-panel-elevated" (click)="addItem()">+ Add item</button>
      </div>

      <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
        <pre class="flex-1 overflow-auto whitespace-pre-wrap font-mono text-xs text-text">{{ css() }}</pre>
        <app-copy-button [text]="css()" />
      </div>
    </div>

    <div class="h-96 overflow-hidden rounded-sm border border-border md:h-full">
      <app-css-preview-sandbox [css]="previewCss()" [html]="html()" />
    </div>
  </div>
</app-tool-shell>

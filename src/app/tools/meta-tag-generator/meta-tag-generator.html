<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-2">
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Title
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().title" (input)="onInput('title', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Description
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().description" (input)="onInput('description', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Charset
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().charset" (input)="onInput('charset', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Viewport
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().viewport" (input)="onInput('viewport', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Robots
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" placeholder="index, follow" [value]="settings().robots" (input)="onInput('robots', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Canonical URL
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().canonical" (input)="onInput('canonical', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Author
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().author" (input)="onInput('author', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        Theme color
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" placeholder="#3b82f6" [value]="settings().themeColor" (input)="onInput('themeColor', $event)" />
      </label>
    </div>

    <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
      <pre class="flex-1 overflow-auto whitespace-pre-wrap font-mono text-xs text-text">{{ output() }}</pre>
      <app-copy-button [text]="output()" />
    </div>
  </div>
</app-tool-shell>

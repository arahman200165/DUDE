<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between text-ui text-text-muted">
        <span>Input</span>
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
          (click)="clear()"
        >
          Clear
        </button>
      </div>
      <textarea
        rows="4"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste text to inspect it character by character…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (analysis().entries.length > 0) {
      <div class="flex items-center justify-between text-ui text-text-muted">
        <span>{{ analysis().totalCount }} character{{ analysis().totalCount === 1 ? '' : 's' }}</span>
        @if (analysis().truncated) {
          <span>Showing first 2000 characters</span>
        }
      </div>
      <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
        <app-data-table [columns]="columns" [rows]="rows()" />
      </div>
    } @else {
      <p class="text-ui text-text-muted">No text to inspect yet.</p>
    }
  </div>
</app-tool-shell>

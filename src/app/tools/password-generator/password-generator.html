<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex overflow-hidden rounded-sm border border-border text-ui w-fit">
      <button
        type="button"
        class="px-3 py-1"
        [class.bg-accent]="mode() === 'password'"
        [class.text-bg]="mode() === 'password'"
        [class.text-text-muted]="mode() !== 'password'"
        (click)="setMode('password')"
      >
        Password
      </button>
      <button
        type="button"
        class="px-3 py-1"
        [class.bg-accent]="mode() === 'passphrase'"
        [class.text-bg]="mode() === 'passphrase'"
        [class.text-text-muted]="mode() !== 'passphrase'"
        (click)="setMode('passphrase')"
      >
        Passphrase
      </button>
    </div>

    @if (mode() === 'password') {
      <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
        <label class="flex items-center gap-1.5">
          Length
          <input
            type="number"
            min="1"
            max="256"
            class="w-20 rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="length()"
            (input)="onLengthInput($event)"
          />
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="useUppercase()" (change)="useUppercase.set($any($event.target).checked)" />
          Uppercase
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="useLowercase()" (change)="useLowercase.set($any($event.target).checked)" />
          Lowercase
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="useDigits()" (change)="useDigits.set($any($event.target).checked)" />
          Digits
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="useSymbols()" (change)="useSymbols.set($any($event.target).checked)" />
          Symbols
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="excludeAmbiguous()" (change)="excludeAmbiguous.set($any($event.target).checked)" />
          Exclude ambiguous (0/O, l/1/I)
        </label>
      </div>
    } @else {
      <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
        <label class="flex items-center gap-1.5">
          Words
          <input
            type="number"
            min="1"
            max="20"
            class="w-16 rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="wordCount()"
            (input)="onWordCountInput($event)"
          />
        </label>
        <label class="flex items-center gap-1.5">
          Separator
          <input
            type="text"
            maxlength="3"
            class="w-14 rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="separator()"
            (input)="onSeparatorInput($event)"
          />
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="capitalize()" (change)="capitalize.set($any($event.target).checked)" />
          Capitalize
        </label>
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="includeDigit()" (change)="includeDigit.set($any($event.target).checked)" />
          Append digit
        </label>
        <span>~{{ passphraseEntropy() | number: '1.0-1' }} bits of entropy</span>
      </div>
    }

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded-sm border border-accent px-2 py-0.5 text-ui text-accent hover:bg-accent/10"
        (click)="generate()"
      >
        Generate
      </button>
    </div>

    @if (error()) {
      <app-error-panel [message]="error()" />
    }

    @if (result()) {
      <div class="flex items-center justify-between rounded-sm border border-border bg-panel px-2 py-2">
        <span class="break-all font-mono text-sm text-text">{{ result() }}</span>
        <app-copy-button [text]="result()" />
      </div>
    }
  </div>
</app-tool-shell>

<div class="flex h-full flex-col gap-2">
  <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
    <span class="text-success">+{{ result().summary.added }} added</span>
    <span class="text-error">-{{ result().summary.removed }} removed</span>
    <span>{{ result().summary.changed }} changed</span>
  </div>

  @if (result().entries.length > 0) {
    <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
      <app-workbench-table [columns]="columns | simpleColumns" [rows]="rows()" />
    </div>
  } @else {
    <p class="text-ui text-text-muted">No structural differences.</p>
  }
</div>

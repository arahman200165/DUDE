<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        Timezone
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="zone()"
          (change)="onZoneChange($event)"
        >
          @for (z of zones; track z) {
            <option [value]="z">{{ z }}</option>
          }
        </select>
      </label>

      <label class="flex items-center gap-1.5">
        Year
        <input
          type="number"
          class="w-24 rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="year()"
          (input)="onYearChange($event)"
        />
      </label>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        @if (current.rows.length > 0) {
          <div class="h-64 rounded-sm border border-border">
            <app-workbench-table [columns]="columns | simpleColumns" [rows]="rows()" />
          </div>
        } @else {
          <div class="rounded-sm border border-border bg-panel p-2 text-ui text-text-muted">
            {{ zone() }} observes no DST transitions in {{ year() }}.
          </div>
        }
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex h-full flex-col gap-3 overflow-auto">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">CORS response headers</span>
        <app-copy-button [text]="raw()" />
      </div>
      <textarea
        rows="6"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="raw()"
        (input)="onRawChange($event)"
      ></textarea>
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Allow-Origin
        <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="* or https://app.example.com" [value]="cors().allowOrigin" (input)="onFieldInput('allowOrigin', $event)" />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Allow-Methods
        <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="GET, POST" [value]="cors().allowMethods" (input)="onFieldInput('allowMethods', $event)" />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Allow-Headers
        <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="Content-Type, Authorization" [value]="cors().allowHeaders" (input)="onFieldInput('allowHeaders', $event)" />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Expose-Headers
        <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="X-Request-Id" [value]="cors().exposeHeaders" (input)="onFieldInput('exposeHeaders', $event)" />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Max-Age (seconds)
        <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="600" [value]="cors().maxAge" (input)="onFieldInput('maxAge', $event)" />
      </label>
      <label class="flex items-end gap-1.5 text-ui text-text-muted">
        <input type="checkbox" [checked]="cors().allowCredentials" (change)="onAllowCredentialsChange($event)" />
        Allow-Credentials
      </label>
    </div>

    <div class="flex flex-col gap-2 rounded-sm border border-border bg-panel p-2">
      <span class="text-ui text-text-muted">Preflight check (construct-and-display only — no request is sent)</span>
      <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Request Origin
          <input class="rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" [value]="requestOrigin()" (input)="onRequestOriginInput($event)" />
        </label>
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Request Method
          <input class="rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" [value]="requestMethod()" (input)="onRequestMethodInput($event)" />
        </label>
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Request Headers
          <input class="rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent" placeholder="Content-Type, X-Custom" [value]="requestHeaders()" (input)="onRequestHeadersInput($event)" />
        </label>
      </div>

      @if (preflight().allowed) {
        <div class="rounded-sm border border-success/40 bg-success/10 px-2 py-1 text-ui text-success">Preflight would succeed.</div>
      } @else {
        <div class="flex flex-col gap-1 rounded-sm border border-error/40 bg-error/10 px-2 py-1 text-ui text-error">
          @for (reason of preflight().reasons; track reason) {
            <div>{{ reason }}</div>
          }
        </div>
      }
    </div>
  </div>
</app-tool-shell>

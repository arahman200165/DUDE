<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        Find
        <input
          type="text"
          class="w-40 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="find()"
          (input)="onFindChange($event)"
        />
      </label>
      <label class="flex items-center gap-1.5">
        Replace
        <input
          type="text"
          class="w-40 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="replace()"
          (input)="onReplaceChange($event)"
        />
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="caseSensitive()" (change)="toggleCaseSensitive()" />
        Case-sensitive
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="wholeWord()" (change)="toggleWholeWord()" />
        Whole word
      </label>
      <span>{{ result().matchCount }} match{{ result().matchCount === 1 ? '' : 'es' }}</span>
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="apply()"
      >
        Apply to input
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Type or paste text here…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Output</span>
        <app-copy-button [text]="result().output" />
      </div>
      <textarea
        rows="6"
        readonly
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
        [value]="result().output"
      ></textarea>
    </div>
  </div>
</app-tool-shell>

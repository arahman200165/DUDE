<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        Text
        <input
          type="text"
          class="w-48 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="input()"
          (input)="onInputChange($event)"
        />
      </label>
      <label class="flex items-center gap-1.5">
        Font
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="font()"
          (change)="onFontChange($event)"
        >
          @for (f of fonts; track f) {
            <option [value]="f">{{ f }}</option>
          }
        </select>
      </label>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Output</span>
        <app-copy-button [text]="output()" />
      </div>
      <pre class="w-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs leading-tight text-text">{{ output() }}</pre>
    </div>
  </div>
</app-tool-shell>

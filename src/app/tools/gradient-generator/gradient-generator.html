<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <select
        class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="type()"
        (change)="onTypeChange($event)"
      >
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
        <option value="conic">Conic</option>
      </select>

      @if (type() === 'linear' || type() === 'conic') {
        <label class="flex items-center gap-2 text-ui text-text-muted">
          Angle
          <input
            type="number"
            class="w-20 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="angle()"
            (input)="onAngleChange($event)"
          />
          deg
        </label>
      }

      @if (type() === 'radial') {
        <select
          class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="shape()"
          (change)="onShapeChange($event)"
        >
          <option value="circle">Circle</option>
          <option value="ellipse">Ellipse</option>
        </select>
      }
    </div>

    <div class="h-24 w-full rounded-sm border border-border" [style.background]="previewCss()"></div>

    <div class="flex flex-col gap-1">
      @for (stop of stops(); track $index) {
        <div class="flex items-center gap-2 rounded-sm border border-border bg-panel px-2 py-1">
          <input
            type="color"
            class="h-6 w-8 shrink-0 border border-border bg-transparent"
            [value]="stop.color"
            (input)="onStopColorChange($index, $event)"
          />
          <input
            type="text"
            class="w-28 rounded-sm border border-border bg-panel-elevated px-2 py-1 font-mono text-xs text-text"
            [value]="stop.color"
            (input)="onStopColorChange($index, $event)"
          />
          <input
            type="range"
            min="0"
            max="100"
            class="flex-1"
            [value]="stop.position"
            (input)="onStopPositionChange($index, $event)"
          />
          <span class="w-12 shrink-0 text-right font-mono text-ui text-text-muted">{{ stop.position }}%</span>
          <button
            type="button"
            class="shrink-0 rounded-sm border border-border px-1.5 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
            (click)="removeStop($index)"
          >
            Remove
          </button>
        </div>
      }

      <button
        type="button"
        class="self-start rounded-sm border border-border px-2 py-1 text-ui text-text-muted hover:bg-panel-elevated"
        (click)="addStop()"
      >
        + Add stop
      </button>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
          <span class="flex-1 truncate font-mono text-xs text-text">background: {{ current.css }};</span>
          <app-copy-button [text]="'background: ' + current.css + ';'" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

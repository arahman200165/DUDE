<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">JWKS document</span>
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="clear()"
        >
          Clear
        </button>
      </div>
      <textarea
        rows="8"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder='{"keys": [{"kty": "RSA", "kid": "...", "n": "...", "e": "AQAB"}]}'
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (parseError(); as error) {
      <app-error-panel [message]="error" />
    }

    @if (result(); as keys) {
      <div class="flex flex-col gap-3">
        @for (key of keys; track $index) {
          <div class="flex flex-col gap-1 rounded-sm border border-border p-2">
            <div class="flex items-center justify-between">
              <span class="text-ui text-text-muted">
                {{ key.kid ?? 'Key ' + ($index + 1) }} · {{ key.kty ?? '—' }} · {{ key.alg ?? '—' }}
              </span>
              <div class="flex gap-2">
                <app-copy-button [text]="key.ok ? key.pem : ''" label="Copy as PEM" />
                <app-copy-button [text]="raw(key)" label="Copy as JWK" />
              </div>
            </div>
            @if (key.ok) {
              <pre class="w-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text">{{ key.pem }}</pre>
            } @else {
              <app-error-panel [message]="key.error" />
            }
          </div>
        }
      </div>
    }
  </div>
</app-tool-shell>

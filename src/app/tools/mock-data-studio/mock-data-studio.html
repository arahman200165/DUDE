<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Schema — field name to faker path (e.g. <code>"person.fullName"</code>)</span>
      <textarea
        rows="6"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="schemaText()"
        (input)="onSchemaInput($event)"
      ></textarea>
    </div>

    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Rows
        <input
          type="number"
          min="1"
          max="1000"
          class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="rowCount()"
          (input)="onRowCountInput($event)"
        />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Seed (optional)
        <input
          type="text"
          class="w-28 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="seedText()"
          (input)="onSeedInput($event)"
        />
      </label>
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
        (click)="generate()"
      >
        Generate
      </button>
    </div>

    @if (error()) {
      <app-error-panel [message]="error()" />
    }

    @if (rows().length > 0) {
      <div class="flex flex-wrap items-end gap-3">
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Table name (SQL export)
          <input
            type="text"
            class="w-40 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="tableName()"
            (input)="onTableNameInput($event)"
          />
        </label>
        <label class="flex flex-col gap-1 text-ui text-text-muted">
          Export as
          <select
            class="rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="exportFormat()"
            (change)="onExportFormatChange($event)"
          >
            <option value="json">JSON</option>
            <option value="ndjson">NDJSON</option>
            <option value="csv">CSV</option>
            <option value="sql">SQL</option>
            <option value="xml">XML</option>
            <option value="yaml">YAML</option>
          </select>
        </label>
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="exportRows()"
        >
          Download
        </button>
      </div>

      <app-workbench-table [columns]="columns() | simpleColumns" [rows]="tableRows()" />
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-3 py-1"
          [class.bg-accent]="operation() === 'sort'"
          [class.text-on-accent]="operation() === 'sort'"
          (click)="setOperation('sort')"
        >
          Sort
        </button>
        <button
          type="button"
          class="border-l border-border px-3 py-1"
          [class.bg-accent]="operation() === 'shuffle'"
          [class.text-on-accent]="operation() === 'shuffle'"
          (click)="setOperation('shuffle')"
        >
          Shuffle
        </button>
        <button
          type="button"
          class="border-l border-border px-3 py-1"
          [class.bg-accent]="operation() === 'reverse'"
          [class.text-on-accent]="operation() === 'reverse'"
          (click)="setOperation('reverse')"
        >
          Reverse
        </button>
      </div>

      @if (operation() === 'sort') {
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="sortVariant()"
          (change)="onSortVariantChange($event)"
        >
          @for (variant of sortVariants; track variant.value) {
            <option [value]="variant.value">{{ variant.label }}</option>
          }
        </select>
      }

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="apply()"
      >
        Apply to input
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="One item per line…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Output</span>
        <app-copy-button [text]="result()" />
      </div>
      <textarea
        rows="6"
        readonly
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
        [value]="result()"
      ></textarea>
    </div>
  </div>
</app-tool-shell>

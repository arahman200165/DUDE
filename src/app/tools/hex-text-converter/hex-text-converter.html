<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'toHex'"
          [class.text-bg]="direction() === 'toHex'"
          [class.text-text-muted]="direction() !== 'toHex'"
          (click)="setDirection('toHex')"
        >
          Text → Hex
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'toText'"
          [class.text-bg]="direction() === 'toText'"
          [class.text-text-muted]="direction() !== 'toText'"
          (click)="setDirection('toText')"
        >
          Hex → Text
        </button>
      </div>

      <label class="flex items-center gap-1.5">
        Encoding
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="encoding()"
          (change)="setEncoding($any($event.target).value)"
        >
          @for (option of encodings; track option.id) {
            <option [value]="option.id">{{ option.label }}</option>
          }
        </select>
      </label>

      <button type="button" class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="swap()">
        Swap
      </button>

      <button type="button" class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="clear()">
        Clear
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">{{ direction() === 'toHex' ? 'Text' : 'Hex' }}</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [placeholder]="direction() === 'toHex' ? 'Type or paste text here…' : 'Paste hex here…'"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">{{ direction() === 'toHex' ? 'Hex' : 'Text' }}</span>
            <app-copy-button [text]="current.value" />
          </div>
          <textarea
            rows="6"
            readonly
            class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
            [value]="current.value"
          ></textarea>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex items-center gap-2">
      <input
        type="text"
        class="flex-1 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Regular expression"
        [value]="pattern()"
        (input)="onPatternInput($event)"
      />
      <input
        type="text"
        class="w-16 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="flags"
        [value]="flags()"
        (input)="onFlagsInput($event)"
      />
    </div>

    @if (result(); as current) {
      @if (!current.ok) {
        <app-error-panel [message]="current.error" />
      }
    }

    <div class="regex-diagram min-h-32 flex-1 overflow-auto rounded-sm border border-border bg-panel p-3">
      <div #diagramContainer></div>
    </div>
  </div>
</app-tool-shell>

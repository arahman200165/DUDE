<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Dialect
        <select
          class="rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="dialect()"
          (change)="onDialectChange($event)"
        >
          @for (item of dialects; track item.id) {
            <option [value]="item.id">{{ item.label }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Mode
        <select
          class="rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="mode()"
          (change)="onModeChange($event)"
        >
          <option value="format">Format</option>
          <option value="minify">Minify</option>
        </select>
      </label>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-ui text-text-muted">SQL</span>
        <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />
      </div>
      <textarea
        rows="8"
        [appTextFileDrop]="open"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="input()"
        (input)="onInput($event)"
      ></textarea>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
          <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ current.output }}</pre>
          <span class="flex items-center gap-1.5">
            <app-save-text-file [text]="current.output" [source]="open" mimeType="application/sql" />
            <app-copy-button [text]="current.output" />
          </span>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

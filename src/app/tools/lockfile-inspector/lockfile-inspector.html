<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-2 text-ui text-text-muted">
      <button type="button" class="rounded-sm border px-2 py-0.5" [class.border-accent]="mode() === 'upload'" [class.text-accent]="mode() === 'upload'" [class.border-border]="mode() !== 'upload'" (click)="setMode('upload')">Upload</button>
      <button type="button" class="rounded-sm border px-2 py-0.5" [class.border-accent]="mode() === 'paste'" [class.text-accent]="mode() === 'paste'" [class.border-border]="mode() !== 'paste'" (click)="setMode('paste')">Paste</button>

      @if (mode() === 'paste') {
        <label class="flex items-center gap-1.5">
          Format
          <select class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent" [value]="pasteFormat()" (change)="onPasteFormatChange($event)">
            @for (entry of formatOptions; track entry[0]) {
              <option [value]="entry[0]">{{ entry[1] }}</option>
            }
          </select>
        </label>
      }
    </div>

    @if (mode() === 'upload') {
      <app-file-drop label="Drop a package-lock.json, pnpm-lock.yaml, or yarn.lock here, or click to browse" (fileSelected)="onFileSelected($event)" (rejected)="onFileRejected($event)" />
    } @else {
      <textarea
        class="min-h-32 resize-none rounded-sm border border-border bg-panel p-2 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste lockfile content…"
        spellcheck="false"
        [value]="pasteContent()"
        (input)="onPasteContentChange($event)"
      ></textarea>
    }

    @if (error() !== '') {
      <app-error-panel [message]="error()" />
    }

    @if (parseResult(); as result) {
      @if (!result.ok) {
        <app-error-panel [message]="result.error" />
      } @else {
        <div class="flex flex-wrap items-center gap-3">
          <span class="text-ui text-text-muted">Detected format: {{ result.format }}</span>
          <input
            type="search"
            class="w-full max-w-xs rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="Filter by name or version…"
            [value]="filterText()"
            (input)="onFilterInput($event)"
          />
          <span class="text-ui text-text-muted">{{ filteredPackages().length }} of {{ result.packages.length }} packages</span>
        </div>

        <app-workbench-table [columns]="['Name', 'Version', 'Deps', 'Resolved'] | simpleColumns" [rows]="rows()" />
      }
    }
  </div>
</app-tool-shell>

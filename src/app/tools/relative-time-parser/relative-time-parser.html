<app-tool-shell>
  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-1 rounded-sm border border-border p-3">
      <span class="text-ui text-text-muted">Reference moment (both directions below are relative to this)</span>
      <div class="flex items-center gap-2">
        <input
          type="datetime-local"
          class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="referenceInput()"
          (input)="onReferenceInputChange($event)"
        />
        <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10" (click)="useNowAsReference()">Now</button>
      </div>
    </div>

    <div class="flex flex-col gap-2 rounded-sm border border-border p-3">
      <span class="text-ui font-medium text-text">Text → Timestamp</span>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="e.g. 3 days ago, in 2 hours, next tuesday"
        [value]="textInput()"
        (input)="onTextInputChange($event)"
      />

      @if (textResult(); as result) {
        @if (result.ok) {
          <div class="flex items-center justify-between rounded-sm border border-border bg-panel p-2 text-ui text-text">
            <span class="font-mono">{{ result.iso }}</span>
            <app-copy-button [text]="result.iso" />
          </div>
        } @else {
          <app-error-panel [message]="result.error" />
        }
      }
    </div>

    <div class="flex flex-col gap-2 rounded-sm border border-border p-3">
      <span class="text-ui font-medium text-text">Timestamp → Text</span>
      <input
        type="datetime-local"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent sm:w-64"
        [value]="timestampInput()"
        (input)="onTimestampInputChange($event)"
      />

      @if (timestampResult(); as result) {
        @if (result.ok) {
          <div class="flex items-center justify-between rounded-sm border border-border bg-panel p-2 text-ui text-text">
            <span>{{ result.text }}</span>
            <app-copy-button [text]="result.text" />
          </div>
        } @else {
          <app-error-panel [message]="result.error" />
        }
      }
    </div>
  </div>
</app-tool-shell>

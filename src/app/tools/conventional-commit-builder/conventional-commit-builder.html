<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Type
        <select
          class="rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="type()"
          (change)="onTypeChange($event)"
        >
          @for (commitType of commitTypes; track commitType) {
            <option [value]="commitType">{{ commitType }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Scope (optional)
        <input
          type="text"
          class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="scope()"
          (input)="onScopeInput($event)"
        />
      </label>
      <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
        Subject
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="subject()"
          (input)="onSubjectInput($event)"
        />
      </label>
      <label class="flex items-center gap-1.5 text-ui text-text-muted">
        <input type="checkbox" [checked]="breaking()" (change)="onBreakingToggle($event)" />
        Breaking change
      </label>
    </div>

    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Body (optional)
      <textarea
        rows="3"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="body()"
        (input)="onBodyInput($event)"
      ></textarea>
    </label>

    @if (breaking()) {
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        BREAKING CHANGE description
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="breakingDescription()"
          (input)="onBreakingDescriptionInput($event)"
        />
      </label>
    }

    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Additional footers (one per line, e.g. "Refs: #123")
      <textarea
        rows="2"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="footers()"
        (input)="onFootersInput($event)"
      ></textarea>
    </label>

    <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
      <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ message() }}</pre>
      <app-copy-button [text]="message()" />
    </div>
  </div>
</app-tool-shell>

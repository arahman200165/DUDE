<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Paste the output of "git remote -v"
      <textarea
        rows="6"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="input()"
        (input)="onInput($event)"
      ></textarea>
    </label>

    @if (entries().length > 0) {
      <div class="overflow-auto rounded-sm border border-border">
        <app-workbench-table [columns]="['Name', 'Direction', 'URL', 'Host', 'Owner', 'Repo'] | simpleColumns" [rows]="tableRows()" />
      </div>
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex items-center gap-3 text-ui text-text-muted">
      <button type="button" class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="clear()">Clear</button>
      @if (loading()) {
        <span>Reading...</span>
      }
    </div>

    @if (rejection(); as message) {
      <app-error-panel [message]="message" />
    }

    <app-file-drop label="Drop any file here, or click to browse" (fileSelected)="onFileSelected($event)" (rejected)="onRejected($event)" />

    @if (report(); as data) {
      <div class="flex flex-col gap-2 rounded-sm border border-border bg-panel p-3 text-ui">
        <div class="flex justify-between gap-4"><span class="text-text-muted">File</span><span class="font-mono text-text">{{ data.fileName }}</span></div>
        <div class="flex justify-between gap-4"><span class="text-text-muted">Size</span><span class="font-mono text-text">{{ data.byteLength }} bytes</span></div>

        @if (data.bom; as bom) {
          <div class="flex justify-between gap-4"><span class="text-text-muted">Byte-order mark</span><span class="font-mono text-text">{{ bom.encoding }} ({{ bom.length }} bytes)</span></div>
          <button type="button" class="mt-1 self-start rounded-sm border border-border px-2 py-1 hover:bg-panel-elevated" (click)="downloadWithoutBom()">
            Download without BOM
          </button>
        } @else {
          <p class="text-success">No byte-order mark detected -- nothing to remove.</p>
        }
      </div>
    }
  </div>
</app-tool-shell>

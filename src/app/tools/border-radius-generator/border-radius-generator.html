<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-1 text-ui text-text-muted">
          <input type="checkbox" [checked]="linked()" (change)="toggleLinked($event)" />
          Link all corners
        </label>
        <div class="flex items-center gap-1">
          <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-ui" [class.bg-accent]="unit() === 'px'" [class.text-on-accent]="unit() === 'px'" (click)="setUnit('px')">px</button>
          <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-ui" [class.bg-accent]="unit() === '%'" [class.text-on-accent]="unit() === '%'" (click)="setUnit('%')">%</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Top-left
          <input type="number" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="corners().topLeft" (input)="onCornerInput('topLeft', $event)" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Top-right
          <input type="number" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="corners().topRight" (input)="onCornerInput('topRight', $event)" [disabled]="linked()" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Bottom-left
          <input type="number" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="corners().bottomLeft" (input)="onCornerInput('bottomLeft', $event)" [disabled]="linked()" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Bottom-right
          <input type="number" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="corners().bottomRight" (input)="onCornerInput('bottomRight', $event)" [disabled]="linked()" />
        </label>
      </div>

      <div class="flex items-center justify-between rounded-sm border border-border bg-panel px-2 py-1">
        <code class="flex-1 truncate font-mono text-xs text-text">{{ declaration() }}</code>
        <app-copy-button [text]="declaration()" />
      </div>
    </div>

    <div class="h-64 overflow-hidden rounded-sm border border-border md:h-full">
      <app-css-preview-sandbox [css]="previewCss()" [html]="previewHtml" />
    </div>
  </div>
</app-tool-shell>

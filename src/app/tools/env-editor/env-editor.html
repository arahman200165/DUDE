<app-tool-shell>
  <div class="flex flex-col gap-4 md:flex-row">
    <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
      Raw .env text
      <textarea
        rows="14"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="rawText()"
        (input)="onRawInput($event)"
      ></textarea>
    </label>

    <div class="flex flex-1 flex-col gap-2">
      <app-key-value-editor
        [pairs]="pairs()"
        keyPlaceholder="KEY"
        valuePlaceholder="value"
        (pairsChange)="onPairsChange($event)"
      />
      <div class="flex items-center gap-2">
        <app-copy-button [text]="rawText()" />
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="download()"
        >
          Download .env
        </button>
      </div>
    </div>
  </div>
</app-tool-shell>

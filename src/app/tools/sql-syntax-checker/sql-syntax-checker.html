<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Dialect
      <select
        class="w-56 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="dialect()"
        (change)="onDialectChange($event)"
      >
        @for (item of dialects; track item.id) {
          <option [value]="item.id">{{ item.label }}</option>
        }
      </select>
    </label>

    <textarea
      rows="8"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="input()"
      (input)="onInput($event)"
    ></textarea>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">Valid SQL for the selected dialect.</div>
      } @else {
        <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">
          <div>{{ current.message }}</div>
          @if (current.location) {
            <div class="text-text-muted">Line {{ current.location.line }}, column {{ current.location.column }}</div>
          }
        </div>
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
        (click)="applyFormat()"
      >
        Format
      </button>
      @if (formatted(); as current) {
        @if (current.ok) {
          <app-save-text-file [text]="current.output" [source]="open" label="Save formatted…" />
          <app-copy-button [text]="current.output" label="Copy formatted" />
        }
      }
    </div>

    <textarea
      rows="12"
      [appTextFileDrop]="open"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="input()"
      (input)="onInput($event)"
    ></textarea>

    @if (result(); as current) {
      @if (current.ok) {
        @if (current.issues.length === 0) {
          <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">No issues found.</div>
        } @else {
          <ul class="flex flex-col gap-1">
            @for (issue of current.issues; track issue.message) {
              <li class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">{{ issue.message }}</li>
            }
          </ul>
        }
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-3">
      <div class="grid grid-cols-2 gap-2">
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Name
          <input type="text" class="rounded-sm border border-border bg-panel px-1 py-0.5 font-mono text-xs text-text" [value]="settings().name" (input)="onTextInput('name', $event)" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Duration (s)
          <input type="number" step="0.1" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="settings().durationSeconds" (input)="onNumberInput('durationSeconds', $event)" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Timing function
          <select class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="settings().timingFunction" (change)="onTextInput('timingFunction', $event)">
            @for (fn of timingFunctions; track fn) {
              <option [value]="fn">{{ fn }}</option>
            }
          </select>
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Delay (s)
          <input type="number" step="0.1" min="0" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="settings().delaySeconds" (input)="onNumberInput('delaySeconds', $event)" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Iteration count
          <input type="text" class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="settings().iterationCount" (input)="onTextInput('iterationCount', $event)" placeholder="infinite, 1, 3…" />
        </label>
        <label class="flex flex-col gap-0.5 text-ui text-text-muted">
          Direction
          <select class="rounded-sm border border-border bg-panel px-1 py-0.5 text-xs text-text" [value]="settings().direction" (change)="onTextInput('direction', $event)">
            @for (dir of directions; track dir) {
              <option [value]="dir">{{ dir }}</option>
            }
          </select>
        </label>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-ui text-text-muted">Keyframe stops</span>
        @for (stop of stops(); track $index; let i = $index) {
          <div class="flex flex-col gap-1 rounded-sm border border-border bg-panel p-2">
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-1 text-ui text-text-muted">
                <input type="number" min="0" max="100" class="w-16 rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="stop.percent" (input)="onStopPercent(i, $event)" />
                %
              </label>
              @if (stops().length > 1) {
                <button type="button" class="text-ui text-text-muted hover:text-error" (click)="removeStop(i)">Remove</button>
              }
            </div>
            <textarea
              rows="2"
              class="w-full rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text"
              placeholder="transform: scale(1); opacity: 1;"
              [value]="stop.declarations"
              (input)="onStopDeclarations(i, $event)"
            ></textarea>
          </div>
        }
        <button type="button" class="self-start rounded-sm border border-border px-2 py-1 text-ui text-text-muted hover:bg-panel-elevated" (click)="addStop()">+ Add stop</button>
      </div>

      <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
        <pre class="flex-1 overflow-auto whitespace-pre-wrap font-mono text-xs text-text">{{ css() }}</pre>
        <app-copy-button [text]="css()" />
      </div>
    </div>

    <div class="h-64 overflow-hidden rounded-sm border border-border md:h-full">
      <app-css-preview-sandbox [motion]="true" [css]="previewCss()" [html]="previewHtml" />
    </div>
  </div>
</app-tool-shell>

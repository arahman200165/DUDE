<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <input
        type="text"
        class="w-64 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="#3b82f6, rgb(59,130,246), hsl(217,91%,60%), royalblue…"
        [value]="input()"
        (input)="onInputChange($event)"
      />

      @if (result(); as current) {
        @if (current.ok) {
          <div
            class="h-8 w-8 shrink-0 rounded-sm border border-border"
            [style.background]="current.formats.hex"
          ></div>
        }
      }
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-1">
          @for (row of rows(); track row.label) {
            <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
              <span class="w-28 shrink-0 text-ui text-text-muted">{{ row.label }}</span>
              <span class="flex-1 font-mono text-xs text-text">{{ row.value }}</span>
              <button
                type="button"
                class="shrink-0 rounded-sm border border-border px-1.5 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                (click)="copy(row.value)"
              >
                Copy
              </button>
            </div>
          }
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <span>Operation</span>
      <select
        class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="op()"
        (change)="setOp($any($event.target).value)"
      >
        @for (option of ops; track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>

      @if (job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">Matrix A (rows on separate lines)</span>
        <textarea
          rows="5"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="matrixAInput()"
          (input)="onMatrixAChange($event)"
        ></textarea>
      </div>

      @if (isBinary()) {
        <div class="flex flex-col gap-1">
          <span class="text-ui text-text-muted">Matrix B (rows on separate lines)</span>
          <textarea
            rows="5"
            class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="matrixBInput()"
            (input)="onMatrixBChange($event)"
          ></textarea>
        </div>
      }

      @if (isScalarOp()) {
        <div class="flex flex-col gap-1">
          <span class="text-ui text-text-muted">Scalar k</span>
          <input
            type="text"
            class="w-32 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="scalarInput()"
            (input)="onScalarChange($event)"
          />
        </div>
      }
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        @if (current.kind === 'scalar') {
          <div class="rounded-sm border border-border bg-panel p-3 font-mono text-lg text-accent">{{ current.value }}</div>
        } @else {
          <div class="flex flex-col gap-1">
            <div class="flex items-center justify-between">
              <span class="text-ui text-text-muted">Result</span>
              <app-copy-button [text]="formatMatrix(current.value)" />
            </div>
            <textarea
              rows="6"
              readonly
              class="w-full whitespace-pre rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
              [value]="formatMatrix(current.value)"
            ></textarea>
          </div>
        }
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

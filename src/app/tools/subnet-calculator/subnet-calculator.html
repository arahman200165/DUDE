<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Base network
        <input
          type="text"
          class="w-48 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="192.168.1.0/24"
          [value]="baseText()"
          (input)="onBaseInput($event)"
        />
      </label>

      <div class="flex overflow-hidden rounded-sm border border-border text-ui text-text-muted">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'count'"
          [class.text-bg]="mode() === 'count'"
          [class.text-text-muted]="mode() !== 'count'"
          (click)="setMode('count')"
        >
          Split into N subnets
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'newPrefix'"
          [class.text-bg]="mode() === 'newPrefix'"
          [class.text-text-muted]="mode() !== 'newPrefix'"
          (click)="setMode('newPrefix')"
        >
          Split into /prefix subnets
        </button>
      </div>

      <label class="flex flex-col gap-1 text-ui text-text-muted">
        {{ mode() === 'count' ? 'Subnet count' : 'New prefix length' }}
        <input
          type="number"
          min="1"
          class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="param()"
          (input)="onParamInput($event)"
        />
      </label>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <app-workbench-table [columns]="['Subnet', 'Broadcast', 'Usable range', 'Usable hosts'] | simpleColumns" [rows]="tableRows()" />
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

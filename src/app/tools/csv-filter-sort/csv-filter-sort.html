<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        Filter
        <input
          type="text"
          class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="column"
          [value]="filterColumn()"
          (input)="onFilterColumnChange($event)"
        />
      </label>

      <select
        class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="operator()"
        (change)="onOperatorChange($event)"
      >
        <option value="contains">contains</option>
        <option value="equals">equals</option>
        <option value="not-empty">is not empty</option>
        <option value="gt">&gt;</option>
        <option value="lt">&lt;</option>
      </select>

      @if (operator() !== 'not-empty') {
        <input
          type="text"
          class="w-28 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="value"
          [value]="filterValue()"
          (input)="onFilterValueChange($event)"
        />
      }

      <label class="flex items-center gap-1.5">
        Sort
        <input
          type="text"
          class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="column"
          [value]="sortColumn()"
          (input)="onSortColumnChange($event)"
        />
      </label>

      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="sortDirection() === 'asc'"
          [class.text-bg]="sortDirection() === 'asc'"
          [class.text-text-muted]="sortDirection() !== 'asc'"
          (click)="setSortDirection('asc')"
        >
          Asc
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="sortDirection() === 'desc'"
          [class.text-bg]="sortDirection() === 'desc'"
          [class.text-text-muted]="sortDirection() !== 'desc'"
          (click)="setSortDirection('desc')"
        >
          Desc
        </button>
      </div>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="flex min-h-0 flex-1 flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-ui text-text-muted">CSV</span>
        <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />
      </div>
      <textarea
        [appTextFileDrop]="open"
        class="h-full min-h-24 w-full resize-none rounded-sm border border-border bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste CSV (with a header row) here…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border bg-panel">
      @if (usesWorker() && job()?.error(); as workerError) {
        <div class="p-2">
          <app-error-panel [message]="workerError" />
        </div>
      } @else if (result(); as current) {
        @if (current.ok) {
          <app-workbench-table [columns]="current.table.columns | simpleColumns" [rows]="current.table.rows" />
        } @else {
          <div class="p-2">
            <app-error-panel [message]="current.error.message" />
          </div>
        }
      }
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-2">
    <div class="min-h-40 flex-1 rounded-sm border border-border">
      <app-split-pane [initialRatio]="paneRatio()" (ratioChange)="onRatioChange($event)">
        <textarea
          slot="start"
          class="h-full w-full resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
          placeholder="Left…"
          [value]="left()"
          (input)="onLeftInput($event)"
        ></textarea>
        <textarea
          slot="end"
          class="h-full w-full resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
          placeholder="Right…"
          [value]="right()"
          (input)="onRightInput($event)"
        ></textarea>
      </app-split-pane>
    </div>

    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <button
        type="button"
        class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10"
        (click)="run()"
      >
        Diff
      </button>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-text-muted hover:bg-panel-elevated disabled:opacity-40"
        [disabled]="job()?.status() !== 'running'"
        (click)="cancel()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }

      @if (summaryText(); as text) {
        <span>{{ text }}</span>
      }
    </div>

    @if (job(); as currentJob) {
      @if (currentJob.error(); as message) {
        <app-error-panel [message]="message" />
      }

      @if (currentJob.result(); as result) {
        <div class="max-h-64 overflow-auto rounded-sm border border-border bg-panel font-mono text-ui">
          @for (line of result.lines; track $index) {
            <div class="whitespace-pre-wrap px-2 py-0.5" [class]="lineClasses(line.type)">{{ linePrefix(line.type) }}{{ line.text }}</div>
          }
        </div>
      }
    }
  </div>
</app-tool-shell>

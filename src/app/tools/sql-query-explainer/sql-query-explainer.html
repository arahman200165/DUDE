<app-tool-shell>
  <div class="flex flex-col gap-4">
    <p class="text-ui text-text-muted">Static, pattern-based — not a live EXPLAIN against a running database.</p>

    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Dialect
      <select
        class="w-56 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="dialect()"
        (change)="onDialectChange($event)"
      >
        @for (item of dialects; track item.id) {
          <option [value]="item.id">{{ item.label }}</option>
        }
      </select>
    </label>

    <textarea
      rows="6"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="input()"
      (input)="onInput($event)"
    ></textarea>

    @if (result(); as current) {
      @if (current.ok) {
        <ul class="flex flex-col gap-1">
          @for (line of current.lines; track $index) {
            <li class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">{{ line }}</li>
          }
        </ul>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'xml-to-csv'"
          [class.text-bg]="direction() === 'xml-to-csv'"
          [class.text-text-muted]="direction() !== 'xml-to-csv'"
          (click)="setDirection('xml-to-csv')"
        >
          XML → CSV
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'csv-to-xml'"
          [class.text-bg]="direction() === 'csv-to-xml'"
          [class.text-text-muted]="direction() !== 'csv-to-xml'"
          (click)="setDirection('csv-to-xml')"
        >
          CSV → XML
        </button>
      </div>

      <label class="flex items-center gap-1.5">
        Record element
        <input
          type="text"
          class="w-28 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [placeholder]="direction() === 'xml-to-csv' ? 'auto-detect' : 'record'"
          [value]="recordElement()"
          (input)="onRecordElementChange($event)"
        />
      </label>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="swap()"
      >
        Swap
      </button>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      <app-open-text-file
        #open
        [accept]="direction() === 'csv-to-xml' ? '.csv' : undefined"
        [text]="input()"
        (textLoaded)="input.set($event)"
      />

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="min-h-0 flex-1 rounded-sm border border-border">
      <app-split-pane [initialRatio]="paneRatio()" (ratioChange)="onRatioChange($event)">
        <textarea
          slot="start"
          [appTextFileDrop]="open"
          class="h-full w-full resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
          [placeholder]="direction() === 'xml-to-csv' ? 'Paste XML here, e.g. <root><record><a>1</a></record></root>…' : 'Paste CSV (with a header row) here…'"
          [value]="input()"
          (input)="onInputChange($event)"
        ></textarea>

        <div slot="end" class="flex h-full flex-col overflow-auto bg-panel">
          @if (usesWorker() && job()?.error(); as workerError) {
            <div class="p-2">
              <app-error-panel [message]="workerError" />
            </div>
          } @else if (result(); as current) {
            @if (current.ok) {
              <div class="flex items-center justify-end gap-1.5 px-2 pt-1.5">
                <app-save-text-file [text]="current.output" [source]="open" [extension]="outputExtension()" [mimeType]="outputMimeType()" />
                <button
                  type="button"
                  class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                  (click)="copy(current.output)"
                >
                  Copy
                </button>
              </div>
              <textarea
                readonly
                class="h-full w-full flex-1 resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
                [value]="current.output"
              ></textarea>
            } @else {
              <div class="p-2">
                <app-error-panel [message]="current.error.message" />
              </div>
            }
          }
        </div>
      </app-split-pane>
    </div>
  </div>
</app-tool-shell>

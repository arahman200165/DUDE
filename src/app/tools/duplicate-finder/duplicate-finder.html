<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-3 py-1"
          [class.bg-accent]="mode() === 'lines'"
          [class.text-bg]="mode() === 'lines'"
          (click)="setMode('lines')"
        >
          Lines
        </button>
        <button
          type="button"
          class="border-l border-border px-3 py-1"
          [class.bg-accent]="mode() === 'words'"
          [class.text-bg]="mode() === 'words'"
          (click)="setMode('words')"
        >
          Words
        </button>
      </div>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="caseSensitive()" (change)="toggleCaseSensitive()" />
        Case-sensitive
      </label>
      @if (mode() === 'lines') {
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
          (click)="removeDuplicates()"
        >
          Remove duplicates
        </button>
        <app-copy-button [text]="cleaned()" label="Copy cleaned" />
      }
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste text to find duplicate lines or words…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (duplicates().length > 0) {
      <span class="text-ui text-text-muted">{{ duplicates().length }} duplicate {{ mode() === 'lines' ? 'line' : 'word' }}{{ duplicates().length === 1 ? '' : 's' }} found</span>
      <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
        <app-workbench-table [columns]="columns | simpleColumns" [rows]="rows()" />
      </div>
    } @else {
      <p class="text-ui text-text-muted">No duplicates found.</p>
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'format'"
          [class.text-on-accent]="mode() === 'format'"
          [class.text-text-muted]="mode() !== 'format'"
          (click)="setMode('format')"
        >
          Format
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'minify'"
          [class.text-on-accent]="mode() === 'minify'"
          [class.text-text-muted]="mode() !== 'minify'"
          (click)="setMode('minify')"
        >
          Minify
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'validate'"
          [class.text-on-accent]="mode() === 'validate'"
          [class.text-text-muted]="mode() !== 'validate'"
          (click)="setMode('validate')"
        >
          Validate
        </button>
      </div>

      @if (mode() === 'format') {
        <label class="flex items-center gap-1.5">
          Indent
          <select
            class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="indent()"
            (change)="onIndentChange($event)"
          >
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>
      }

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <textarea
      rows="8"
      [appTextFileDrop]="open"
      class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      placeholder="Paste XML here…"
      [value]="input()"
      (input)="onInputChange($event)"
    ></textarea>

    @if (usesWorker() && job()?.error(); as workerError) {
      <app-error-panel [message]="workerError" />
    } @else if (input() !== '' && result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">Output</span>
            <span class="flex items-center gap-1.5">
              <app-save-text-file [text]="current.output" [source]="open" mimeType="application/xml;charset=utf-8" />
              <button
                type="button"
                class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                (click)="copy(current.output)"
              >
                Copy
              </button>
            </span>
          </div>
          <textarea
            rows="8"
            readonly
            class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
            [value]="current.output"
          ></textarea>
        </div>
      } @else {
        <app-error-panel
          [message]="current.error.line !== undefined
            ? current.error.message + ' (line ' + current.error.line + ', column ' + current.error.column + ')'
            : current.error.message"
        />
      }
    }
  </div>
</app-tool-shell>

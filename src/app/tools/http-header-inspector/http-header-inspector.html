<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-2">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <app-copy-button [text]="raw()" label="Copy headers" />
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>
    </div>

    <div class="min-h-64 flex-1 rounded-sm border border-border">
      <app-split-pane [initialRatio]="0.45">
        <div slot="start" class="flex h-full flex-col gap-1 bg-panel p-2">
          <span class="text-ui text-text-muted">Raw headers</span>
          <textarea
            class="h-full w-full resize-none rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="Paste headers here (Name: value per line, or a full request/response dump)…"
            [value]="raw()"
            (input)="onRawChange($event)"
          ></textarea>
        </div>

        <div slot="end" class="flex h-full flex-col gap-1 bg-panel p-2">
          <span class="text-ui text-text-muted">Headers</span>
          <app-key-value-editor
            [pairs]="pairs()"
            (pairsChange)="onPairsChange($event)"
            [keyHint]="describeHeader"
            keyPlaceholder="Header-Name"
            valuePlaceholder="value"
            addLabel="Add header"
            emptyMessage="No headers yet — paste some or add one."
          />
        </div>
      </app-split-pane>
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
        (click)="applyFormat()"
      >
        Format
      </button>
      <!-- Explicit name: a "Dockerfile" has no extension to carry over, so the derived name would be "Dockerfile.dockerfile". -->
      <app-save-text-file [text]="formatted()" [fileName]="open.lastOpenedName() ?? 'Dockerfile'" label="Save formatted…" />
      <app-copy-button [text]="formatted()" label="Copy formatted" />
    </div>

    <textarea
      rows="10"
      [appTextFileDrop]="open"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="input()"
      (input)="onInput($event)"
    ></textarea>

    @if (issues().length === 0) {
      <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">No issues found.</div>
    } @else {
      <ul class="flex flex-col gap-1">
        @for (issue of issues(); track issue.message + issue.line) {
          <li class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">
            <span class="text-text-muted">Line {{ issue.line }}:</span>
            {{ issue.message }}
          </li>
        }
      </ul>
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex overflow-hidden rounded-sm border border-border text-ui text-text-muted">
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="mode() === 'encode'"
        [class.text-on-accent]="mode() === 'encode'"
        [class.text-text-muted]="mode() !== 'encode'"
        (click)="setMode('encode')"
      >
        Encode (plaintext → data)
      </button>
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="mode() === 'decode'"
        [class.text-on-accent]="mode() === 'decode'"
        [class.text-text-muted]="mode() !== 'decode'"
        (click)="setMode('decode')"
      >
        Decode (data → plaintext)
      </button>
    </div>

    <app-key-value-editor
      [pairs]="pairs()"
      [keyPlaceholder]="'key'"
      [valuePlaceholder]="mode() === 'encode' ? 'plaintext value' : 'base64 value'"
      (pairsChange)="onPairsChange($event)"
    />

    <div>
      <div class="mb-1 text-ui text-text-muted">{{ mode() === 'encode' ? 'Base64-encoded' : 'Decoded plaintext' }}</div>
      <ul class="flex flex-col gap-1">
        @for (field of fields(); track field.key) {
          <li class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text">
            {{ field.key }}: {{ field.error ? field.error : field.value }}
          </li>
        }
      </ul>
    </div>

    @if (yaml()) {
      <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
        <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ yaml() }}</pre>
        <app-copy-button [text]="yaml()" />
      </div>
    }
  </div>
</app-tool-shell>

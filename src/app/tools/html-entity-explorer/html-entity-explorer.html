<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <input
        type="search"
        class="w-full max-w-xs rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Search by name, character, decimal, or hex…"
        [value]="filterText()"
        (input)="onFilterInput($event)"
      />
      <span class="text-ui text-text-muted">{{ filtered().length }} of {{ totalCount }} entities</span>
      @if (filterText() !== '') {
        <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated" (click)="clear()">
          Clear
        </button>
      }
    </div>

    <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
      <app-workbench-table [columns]="columns | simpleColumns" [rows]="rows()" />
    </div>
  </div>
</app-tool-shell>

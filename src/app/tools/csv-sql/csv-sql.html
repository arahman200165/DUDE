<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'csv-to-sql'"
          [class.text-bg]="direction() === 'csv-to-sql'"
          [class.text-text-muted]="direction() !== 'csv-to-sql'"
          (click)="setDirection('csv-to-sql')"
        >
          CSV → SQL
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'sql-to-csv'"
          [class.text-bg]="direction() === 'sql-to-csv'"
          [class.text-text-muted]="direction() !== 'sql-to-csv'"
          (click)="setDirection('sql-to-csv')"
        >
          SQL → CSV
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'json-to-sql'"
          [class.text-bg]="direction() === 'json-to-sql'"
          [class.text-text-muted]="direction() !== 'json-to-sql'"
          (click)="setDirection('json-to-sql')"
        >
          JSON → SQL
        </button>
      </div>

      @if (direction() === 'csv-to-sql' || direction() === 'json-to-sql') {
        <label class="flex items-center gap-1.5">
          Table
          <input
            type="text"
            class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="tableName()"
            (input)="onTableNameChange($event)"
          />
        </label>
      }

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="min-h-0 flex-1 rounded-sm border border-border">
      <app-split-pane [initialRatio]="paneRatio()" (ratioChange)="onRatioChange($event)">
        <textarea
          slot="start"
          class="h-full w-full resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
          [placeholder]="
            direction() === 'csv-to-sql'
              ? 'Paste CSV here…'
              : direction() === 'json-to-sql'
                ? 'Paste a JSON array of objects here…'
                : 'Paste INSERT statements here…'
          "
          [value]="input()"
          (input)="onInputChange($event)"
        ></textarea>

        <div slot="end" class="flex h-full flex-col overflow-auto bg-panel">
          @if (usesWorker() && job()?.error(); as workerError) {
            <div class="p-2">
              <app-error-panel [message]="workerError" />
            </div>
          } @else if (result(); as current) {
            @if (current.ok) {
              <div class="flex items-center justify-end px-2 pt-1.5">
                <button
                  type="button"
                  class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                  (click)="copy(current.output)"
                >
                  Copy
                </button>
              </div>
              <textarea
                readonly
                class="h-full w-full flex-1 resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
                [value]="current.output"
              ></textarea>
            } @else {
              <div class="p-2">
                <app-error-panel [message]="current.error.message" />
              </div>
            }
          }
        </div>
      </app-split-pane>
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex overflow-hidden self-start rounded-sm border border-border text-ui">
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'encode'"
        [class.text-bg]="direction() === 'encode'"
        [class.text-text-muted]="direction() !== 'encode'"
        (click)="setDirection('encode')"
      >
        SVG &rarr; Data URI
      </button>
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'decode'"
        [class.text-bg]="direction() === 'decode'"
        [class.text-text-muted]="direction() !== 'decode'"
        (click)="setDirection('decode')"
      >
        Data URI &rarr; SVG
      </button>
    </div>

    @if (direction() === 'encode') {
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">SVG source</span>
        <textarea
          rows="8"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="svgInput()"
          (input)="onSvgInputChange($event)"
        ></textarea>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="text-ui text-text-muted">URL-encoded (smaller, readable in CSS)</span>
          <app-copy-button [text]="encoded().urlEncoded" />
        </div>
        <textarea rows="4" readonly class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text" [value]="encoded().urlEncoded"></textarea>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="text-ui text-text-muted">Base64-encoded</span>
          <app-copy-button [text]="encoded().base64Encoded" />
        </div>
        <textarea rows="4" readonly class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text" [value]="encoded().base64Encoded"></textarea>
      </div>
    } @else {
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">Data URI</span>
        <textarea
          rows="6"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="data:image/svg+xml,..."
          [value]="uriInput()"
          (input)="onUriInputChange($event)"
        ></textarea>
      </div>

      @if (decoded(); as result) {
        @if (result.ok) {
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">Decoded SVG</span>
            <app-copy-button [text]="result.svg" />
          </div>
          <textarea rows="8" readonly class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text" [value]="result.svg"></textarea>
          <div class="flex items-center justify-center rounded-sm border border-border bg-[repeating-conic-gradient(#00000022_0%_25%,transparent_0%_50%)] bg-[length:16px_16px] p-3">
            <img [src]="uriInput()" alt="Decoded SVG preview" class="max-h-48 max-w-full" />
          </div>
        } @else {
          <app-error-panel [message]="result.error" />
        }
      }
    }
  </div>
</app-tool-shell>

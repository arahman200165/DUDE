<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'run-to-compose'"
          [class.text-bg]="direction() === 'run-to-compose'"
          [class.text-text-muted]="direction() !== 'run-to-compose'"
          (click)="setDirection('run-to-compose')"
        >
          docker run → Compose
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'compose-to-run'"
          [class.text-bg]="direction() === 'compose-to-run'"
          [class.text-text-muted]="direction() !== 'compose-to-run'"
          (click)="setDirection('compose-to-run')"
        >
          Compose → docker run
        </button>
      </div>

      <label class="flex items-center gap-1.5">
        Service name
        <input
          type="text"
          class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="serviceName()"
          (input)="onServiceNameInput($event)"
        />
      </label>
    </div>

    <textarea
      rows="8"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [placeholder]="direction() === 'run-to-compose' ? 'Paste a docker run command…' : 'Paste a docker-compose YAML document…'"
      [value]="input()"
      (input)="onInput($event)"
    ></textarea>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
          <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ current.output }}</pre>
          <app-copy-button [text]="current.output" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Quantity
      <input
        type="text"
        class="w-48 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="e.g. 500m, 1Gi, 2"
        [value]="input()"
        (input)="onInput($event)"
      />
    </label>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="text-ui text-text-muted">Canonical value: {{ current.canonical }}</div>
        <app-data-table [columns]="['Unit', 'Value']" [rows]="tableRows()" />
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

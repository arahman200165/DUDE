<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-2">
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-1 text-ui"
        [class.bg-accent]="direction() === 'html-to-jsx'"
        [class.text-bg]="direction() === 'html-to-jsx'"
        [class.text-text-muted]="direction() !== 'html-to-jsx'"
        (click)="setDirection('html-to-jsx')"
      >
        HTML → JSX
      </button>
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-1 text-ui"
        [class.bg-accent]="direction() === 'jsx-to-html'"
        [class.text-bg]="direction() === 'jsx-to-html'"
        [class.text-text-muted]="direction() !== 'jsx-to-html'"
        (click)="setDirection('jsx-to-html')"
      >
        JSX → HTML
      </button>
      <app-open-text-file #open [text]="input()" (fileOpened)="onFileOpened($event)" />
    </div>
    @if (direction() === 'jsx-to-html') {
      <p class="text-ui text-text-muted">
        Best-effort: handles renamed attributes, style objects, and comments. Expressions, event handlers, and embedded JS have no HTML equivalent.
      </p>
    }

    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
      <textarea
        rows="14"
        [appTextFileDrop]="open"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste HTML or JSX…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>

      @if (result(); as current) {
        @if (current.ok) {
          <div class="relative">
            <pre class="h-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text">{{ current.output }}</pre>
            <div class="absolute right-2 top-2 flex items-center gap-1.5">
              <app-save-text-file [text]="current.output" [source]="open" [extension]="direction() === 'html-to-jsx' ? '.jsx' : '.html'" />
              <app-copy-button [text]="current.output" />
            </div>
          </div>
        } @else {
          <app-error-panel [message]="current.error" />
        }
      }
    </div>
  </div>
</app-tool-shell>

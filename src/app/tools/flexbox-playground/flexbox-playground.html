<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-3">
      <div class="flex flex-col gap-2 rounded-sm border border-border bg-panel p-2">
        <span class="text-ui text-text-muted">Container</span>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            direction
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().direction" (change)="onSelect('direction', $event)">
              <option value="row">row</option>
              <option value="row-reverse">row-reverse</option>
              <option value="column">column</option>
              <option value="column-reverse">column-reverse</option>
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            wrap
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().wrap" (change)="onSelect('wrap', $event)">
              <option value="nowrap">nowrap</option>
              <option value="wrap">wrap</option>
              <option value="wrap-reverse">wrap-reverse</option>
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            justify-content
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().justifyContent" (change)="onSelect('justifyContent', $event)">
              @for (opt of justifyOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            align-items
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().alignItems" (change)="onSelect('alignItems', $event)">
              @for (opt of alignOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            align-content
            <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().alignContent" (change)="onSelect('alignContent', $event)">
              @for (opt of alignContentOptions; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          </label>
          <label class="flex flex-col gap-0.5 text-ui text-text-muted">
            gap (px)
            <input type="number" min="0" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="container().gap" (input)="onGapInput($event)" />
          </label>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        @for (item of items(); track $index; let i = $index) {
          <div class="flex flex-wrap items-end gap-2 rounded-sm border border-border bg-panel p-2">
            <span class="w-6 text-ui text-text-muted">#{{ i + 1 }}</span>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              grow
              <input type="number" min="0" class="w-16 rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="item.grow" (input)="onItemNumber(i, 'grow', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              shrink
              <input type="number" min="0" class="w-16 rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="item.shrink" (input)="onItemNumber(i, 'shrink', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              basis
              <input type="text" class="w-20 rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="item.basis" (input)="onItemText(i, 'basis', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              align-self
              <select class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="item.alignSelf" (change)="onItemText(i, 'alignSelf', $event)">
                @for (opt of alignSelfOptions; track opt) {
                  <option [value]="opt">{{ opt }}</option>
                }
              </select>
            </label>
            @if (items().length > 1) {
              <button type="button" class="text-ui text-text-muted hover:text-error" (click)="removeItem(i)">Remove</button>
            }
          </div>
        }
        <button type="button" class="self-start rounded-sm border border-border px-2 py-1 text-ui text-text-muted hover:bg-panel-elevated" (click)="addItem()">+ Add item</button>
      </div>

      <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
        <pre class="flex-1 overflow-auto whitespace-pre-wrap font-mono text-xs text-text">{{ css() }}</pre>
        <app-copy-button [text]="css()" />
      </div>
    </div>

    <div class="h-96 overflow-hidden rounded-sm border border-border md:h-full">
      <app-css-preview-sandbox [css]="previewCss()" [html]="html()" />
    </div>
  </div>
</app-tool-shell>

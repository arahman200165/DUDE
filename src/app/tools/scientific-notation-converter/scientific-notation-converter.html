<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-end gap-3">
      <div class="flex flex-1 flex-col gap-1">
        <span class="text-ui text-text-muted">Number</span>
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="12345, 0.000123, or 6.022e23"
          [value]="input()"
          (input)="onInputChange($event)"
        />
      </div>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Significant digits
        <input
          type="number"
          min="1"
          max="21"
          class="w-24 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="precision()"
          (change)="onPrecisionChange($event)"
        />
      </label>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
            <span class="text-ui text-text-muted">Standard</span>
            <span class="font-mono text-sm text-text">{{ current.value.standard }}</span>
            <app-copy-button [text]="current.value.standard" />
          </div>
          <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
            <span class="text-ui text-text-muted">Scientific</span>
            <span class="font-mono text-sm text-text">{{ current.value.scientificPretty }}</span>
            <app-copy-button [text]="current.value.scientific" />
          </div>
          <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
            <span class="text-ui text-text-muted">Engineering</span>
            <span class="font-mono text-sm text-text">{{ current.value.engineering }}</span>
            <app-copy-button [text]="current.value.engineering" />
          </div>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

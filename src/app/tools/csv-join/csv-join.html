<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="joinType() === 'inner'"
          [class.text-bg]="joinType() === 'inner'"
          [class.text-text-muted]="joinType() !== 'inner'"
          (click)="setJoinType('inner')"
        >
          Inner
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="joinType() === 'left'"
          [class.text-bg]="joinType() === 'left'"
          [class.text-text-muted]="joinType() !== 'left'"
          (click)="setJoinType('left')"
        >
          Left
        </button>
      </div>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="grid min-h-0 flex-[2] grid-cols-1 gap-3 md:grid-cols-2">
      <div class="flex min-h-0 flex-col gap-1">
        <div class="flex flex-wrap items-center gap-1.5 text-ui text-text-muted">
          <span>Left CSV — key column</span>
          <input
            type="text"
            class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="id"
            [value]="leftKey()"
            (input)="onLeftKeyChange($event)"
          />
          <app-open-text-file #openLeft [text]="leftInput()" (textLoaded)="leftInput.set($event)" />
        </div>
        <textarea
          [appTextFileDrop]="openLeft"
          class="h-full min-h-32 w-full resize-none rounded-sm border border-border bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="Paste the left CSV (with a header row) here…"
          [value]="leftInput()"
          (input)="onLeftInputChange($event)"
        ></textarea>
      </div>

      <div class="flex min-h-0 flex-col gap-1">
        <div class="flex flex-wrap items-center gap-1.5 text-ui text-text-muted">
          <span>Right CSV — key column</span>
          <input
            type="text"
            class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="id"
            [value]="rightKey()"
            (input)="onRightKeyChange($event)"
          />
          <app-open-text-file #openRight [text]="rightInput()" (textLoaded)="rightInput.set($event)" />
        </div>
        <textarea
          [appTextFileDrop]="openRight"
          class="h-full min-h-32 w-full resize-none rounded-sm border border-border bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="Paste the right CSV (with a header row) here…"
          [value]="rightInput()"
          (input)="onRightInputChange($event)"
        ></textarea>
      </div>
    </div>

    <div class="min-h-0 flex-[3] overflow-auto rounded-sm border border-border bg-panel">
      @if (usesWorker() && job()?.error(); as workerError) {
        <div class="p-2">
          <app-error-panel [message]="workerError" />
        </div>
      } @else if (result(); as current) {
        @if (current.ok) {
          <app-data-table [columns]="current.table.columns | simpleColumns" [rows]="current.table.rows" />
        } @else {
          <div class="p-2">
            <app-error-panel [message]="current.error.message" />
          </div>
        }
      }
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'flatten'"
          [class.text-on-accent]="direction() === 'flatten'"
          [class.text-text-muted]="direction() !== 'flatten'"
          (click)="setDirection('flatten')"
        >
          Flatten
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'unflatten'"
          [class.text-on-accent]="direction() === 'unflatten'"
          [class.text-text-muted]="direction() !== 'unflatten'"
          (click)="setDirection('unflatten')"
        >
          Unflatten
        </button>
      </div>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="swap()"
      >
        Swap
      </button>

      <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="min-h-0 flex-1 rounded-sm border border-border">
      <app-split-pane [initialRatio]="paneRatio()" (ratioChange)="onRatioChange($event)">
        <textarea
          slot="start"
          [appTextFileDrop]="open"
          class="h-full w-full resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
          [placeholder]="direction() === 'flatten' ? 'Paste nested JSON here…' : 'Paste flat path-keyed JSON here…'"
          [value]="input()"
          (input)="onInputChange($event)"
        ></textarea>

        <div slot="end" class="flex h-full flex-col overflow-auto bg-panel">
          @if (usesWorker() && job()?.error(); as workerError) {
            <div class="p-2">
              <app-error-panel [message]="workerError" />
            </div>
          } @else if (result(); as current) {
            @if (current.ok) {
              <div class="flex items-center justify-end px-2 pt-1.5">
                <span class="flex items-center gap-1.5">
                  <app-save-text-file [text]="current.output" [source]="open" mimeType="application/json;charset=utf-8" />
                  <button
                    type="button"
                    class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                    (click)="copy(current.output)"
                  >
                    Copy
                  </button>
                </span>
              </div>
              <textarea
                readonly
                class="h-full w-full flex-1 resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
                [value]="current.output"
              ></textarea>
            } @else {
              <div class="p-2">
                <app-error-panel [message]="current.error.message" />
              </div>
            }
          }
        </div>
      </app-split-pane>
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-ui text-text-muted">JSON-LD</span>
        <app-open-text-file #open [text]="input()" (textLoaded)="input.set($event)" />
      </div>
      <textarea
        rows="16"
        [appTextFileDrop]="open"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste a JSON-LD <script type=&quot;application/ld+json&quot;> block…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="flex flex-col gap-2">
      @if (result(); as current) {
        @if (current.ok) {
          @if (current.findings.length === 0) {
            <div class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">No issues found.</div>
          } @else {
            <span class="text-ui text-text-muted">{{ errorCount() }} error(s), {{ current.findings.length - errorCount() }} warning(s)</span>
            <div class="flex flex-col gap-1 overflow-auto">
              @for (finding of current.findings; track $index) {
                <div
                  class="rounded-sm border px-2 py-1 text-ui"
                  [class.border-error]="finding.severity === 'error'"
                  [class.text-error]="finding.severity === 'error'"
                  [class.border-border]="finding.severity !== 'error'"
                  [class.text-text-muted]="finding.severity !== 'error'"
                >
                  {{ finding.message }}
                </div>
              }
            </div>
          }
        } @else {
          <app-error-panel [message]="current.parseError" />
        }
      }
    </div>
  </div>
</app-tool-shell>

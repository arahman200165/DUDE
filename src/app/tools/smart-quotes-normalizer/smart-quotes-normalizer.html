<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-3 py-1"
          [class.bg-accent]="options().direction === 'to-straight'"
          [class.text-on-accent]="options().direction === 'to-straight'"
          (click)="setDirection('to-straight')"
        >
          Curly → Straight
        </button>
        <button
          type="button"
          class="border-l border-border px-3 py-1"
          [class.bg-accent]="options().direction === 'to-curly'"
          [class.text-on-accent]="options().direction === 'to-curly'"
          (click)="setDirection('to-curly')"
        >
          Straight → Curly
        </button>
      </div>

      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="options().quotes" (change)="toggle('quotes')" />
        Quotes
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="options().dashes" (change)="toggle('dashes')" />
        Dashes
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="options().ellipsis" (change)="toggle('ellipsis')" />
        Ellipsis
      </label>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Type or paste text here…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Output</span>
        <app-copy-button [text]="output()" />
      </div>
      <textarea
        rows="6"
        readonly
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
        [value]="output()"
      ></textarea>
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Paste text or config to scan — never persisted
      <textarea
        rows="10"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="input()"
        (input)="onInput($event)"
      ></textarea>
    </label>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
        (click)="toggleRevealed()"
      >
        {{ revealed() ? 'Hide matches' : 'Reveal matches' }}
      </button>
    </div>

    @if (findings().length === 0) {
      <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">No likely secrets found.</div>
    } @else {
      <ul class="flex flex-col gap-1">
        @for (finding of findings(); track finding.index) {
          <li class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">
            <span class="text-text-muted">{{ finding.kind }}</span> —
            <span class="font-mono text-xs">{{ display(finding.match) }}</span>
          </li>
        }
      </ul>
    }
  </div>
</app-tool-shell>

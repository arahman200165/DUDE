<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-3 py-1"
          [class.bg-accent]="mode() === 'tokenize'"
          [class.text-bg]="mode() === 'tokenize'"
          (click)="setMode('tokenize')"
        >
          Tokenize
        </button>
        <button
          type="button"
          class="border-l border-border px-3 py-1"
          [class.bg-accent]="mode() === 'ngram'"
          [class.text-bg]="mode() === 'ngram'"
          (click)="setMode('ngram')"
        >
          N-Gram
        </button>
      </div>

      @if (mode() === 'tokenize') {
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="granularity()"
          (change)="onGranularityChange($event)"
        >
          <option value="word">Word</option>
          <option value="sentence">Sentence</option>
        </select>
        <span>{{ tokens().length }} token{{ tokens().length === 1 ? '' : 's' }}</span>
      } @else {
        <select
          class="rounded-sm border border-border bg-panel px-1.5 py-0.5 text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="ngramLevel()"
          (change)="onNGramLevelChange($event)"
        >
          <option value="word">Word</option>
          <option value="char">Character</option>
        </select>
        <label class="flex items-center gap-1.5">
          N
          <input
            type="number"
            min="1"
            max="10"
            class="w-16 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
            [value]="n()"
            (input)="onNChange($event)"
          />
        </label>
        <span>{{ ngrams().length }} unique n-gram{{ ngrams().length === 1 ? '' : 's' }}</span>
      }
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste text to tokenize or generate n-grams from…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
      @if (mode() === 'tokenize') {
        <app-data-table [columns]="tokenColumns" [rows]="tokenRows()" />
      } @else {
        <app-data-table [columns]="ngramColumns" [rows]="ngramRows()" />
      }
    </div>
  </div>
</app-tool-shell>

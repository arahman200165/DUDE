name: Release

# Phase 8 Stage 8 (Milestone 28): builds the Windows desktop installer
# (NSIS) and publishes it to a GitHub Release matching the
# pushed tag. Separate from deploy.yml, which stays GitHub Pages-only.
#
# Two triggers, for two different tag sources:
# - `push: tags` fires for a tag pushed by an actual human (e.g. a manual
#   `git tag`/`git push --tags`), which carries a real user identity, not
#   github-actions[bot]'s.
# - `workflow_dispatch` is what version-bump.yml's own tag push actually
#   relies on: a tag created and pushed using the default GITHUB_TOKEN
#   does NOT auto-trigger other workflows (GitHub's anti-recursion
#   guard), so version-bump.yml explicitly dispatches this workflow with
#   `--ref` set to the tag it just created, right after pushing it.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify generated registry/docs are up to date
        shell: bash
        run: |
          npm run generate:registry
          git diff --exit-code -- apps/web/src/app/core/parity/testing/fixture-loaders.generated.ts packages/tool-registry/src/index.ts apps/web/src/app/core/registry/tool-loaders.generated.ts apps/web/src/app/core/pipeline/pipeline-workers.generated.ts packages/domain/src/core/appearance/appearance-axes.generated.ts docs/architecture/phase31a-extraction-inventory.json docs/architecture/data-scope-inventory.json apps/web/src/app/core/registry/tool-definitions.ts apps/web/src/app/core/registry/panel-definitions.ts README.md || \
            (echo '::error::tool-definitions.ts or README.md is stale — a <id>.manifest.ts changed without regenerating (npm run generate:registry) and committing the result.' && exit 1)

      - name: Independent portable-core consumption
        run: npm run check:portable

      - name: Verify extraction and scope inventories
        run: npm run check:inventory

      - name: Verify desktop and relay declarations
        run: npm run check:hosts

      - name: Run tests
        run: npm test

      - name: Run Electron networking tests
        run: npm run test:electron

      - name: Run high-consequence release gate
        run: npm run test:high-consequence

      - name: Build (Angular, Electron configuration)
        run: npm run build -- --configuration production,electron

      - name: Compile Electron main/preload
        run: npm run electron:compile

      - name: Build Windows network helper
        run: npm run electron:helper

      - name: Verify ICMP helper on IPv4 and IPv6 loopback
        shell: pwsh
        run: |
          $ipv4 = & .\build\network-icmp.exe probe 127.0.0.1 ipv4 64 64 1000 | ConvertFrom-Json
          $ipv6 = & .\build\network-icmp.exe probe ::1 ipv6 64 64 1000 | ConvertFrom-Json
          if ($ipv4.status -ne 'success' -or $ipv6.status -ne 'success') { throw 'ICMP helper loopback probes failed.' }

      - name: Production desktop acceptance in an isolated profile
        run: npm run check:desktop

      - name: Build the Device Agent executable
        run: node scripts/build-sea.mjs --bundle dist/electron/device-agent.js --out dist/agent --name dude-agent

      # The optional DUDE Hub (PD-025): the Hub web build, SEA, WinSW and the standalone DUDE-Hub-Setup.exe.
      # The desktop installer embeds the Hub installer (extraResources; in-app Update Hub runs it with /UPDATE), so it
      # must exist before electron-builder runs. Hub binaries ship unsigned (SHA256 sums are published).
      - name: Build the Hub web build
        run: npm run build:hub-web

      - name: Stage the Hub and build DUDE-Hub-Setup.exe
        run: npm run hub:stage && npm run hub:installer

      - name: Package and publish (NSIS)
        run: npx electron-builder --config electron-builder.yml --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged network helper
        shell: pwsh
        run: |
          $source = (Get-FileHash build\network-icmp.exe).Hash
          $packaged = (Get-FileHash release\win-unpacked\resources\network-icmp.exe).Hash
          if ($source -ne $packaged) { throw 'NSIS source tree does not contain the network helper.' }
          $agent = (Get-FileHash dist\agent\dude-agent.exe).Hash
          $packagedAgent = (Get-FileHash release\win-unpacked\resources\dude-agent.exe).Hash
          if ($agent -ne $packagedAgent) { throw 'NSIS source tree does not contain the Device Agent.' }

      - name: Publish DUDE-Hub-Setup.exe and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          $hub = 'dist\hub-installer\DUDE-Hub-Setup.exe'
          $desktop = "release\DUDE-Setup-$version.exe"
          $lines = foreach ($f in @($desktop, $hub)) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          Set-Content -Path release\SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content release\SHA256SUMS.txt
          gh release upload $tag $hub release\SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the desktop installer embeds the Hub installer
        shell: pwsh
        run: |
          $hubInstaller = (Get-FileHash dist\hub-installer\DUDE-Hub-Setup.exe).Hash
          $packagedHub = (Get-FileHash release\win-unpacked\resources\DUDE-Hub-Setup.exe).Hash
          if ($hubInstaller -ne $packagedHub) { throw 'NSIS source tree does not contain the Hub installer.' }

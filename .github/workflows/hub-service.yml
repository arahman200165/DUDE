name: Hub service

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-service:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run hub:stage
      - name: Service lifecycle (install, bootstrap, update, LAN, uninstall)
        run: node scripts/check-hub-service.mjs --require

name: CI

# One run per push: Linux gates, then (master pushes only) the GitHub Pages
# deploy and the Windows desktop release, both gated on every check below.
#
# The release version is never committed. package.json holds a <major>.<minor>.0
# base and the release job sets the patch to the commit count of master
# (`git rev-list --count HEAD`) inside the runner, so every build of a commit
# gets the same, ever-increasing version and nothing pushes back to master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify generated registry/docs are up to date
        run: |
          npm run generate:registry
          git diff --exit-code -- apps/web/src/app/core/parity/testing/fixture-loaders.generated.ts packages/tool-registry/src/index.ts apps/web/src/app/core/registry/tool-loaders.generated.ts apps/web/src/app/core/pipeline/pipeline-workers.generated.ts packages/domain/src/core/appearance/appearance-axes.generated.ts docs/architecture/phase31a-extraction-inventory.json docs/architecture/data-scope-inventory.json apps/web/src/app/core/registry/tool-definitions.ts apps/web/src/app/core/registry/panel-definitions.ts README.md SECURITY.md apps/web/public/manifest.webmanifest || \
            (echo '::error::tool-definitions.ts, README.md, SECURITY.md, or apps/web/public/manifest.webmanifest is stale — a <id>.manifest.ts changed without regenerating (npm run generate:registry) and committing the result.' && exit 1)

      - name: Lint (dependency/platform boundaries)
        run: npm run lint

      - name: Verify Dockerfiles copy every workspace manifest
        run: npm run check:dockerfiles

      - name: Independent portable-core consumption
        run: npm run check:portable

      - name: Verify extraction and scope inventories
        run: npm run check:inventory

      - name: Verify desktop and relay declarations
        run: npm run check:hosts

      - name: Run tests
        run: npm test

      - name: Capability-specific release gate (high-consequence tools)
        run: npm run test:high-consequence

      - name: Electron boundary tests
        run: npm run test:electron

      - name: Hub service tests (foreground Hub integration suite)
        run: npm run test:hub

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload build artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dude/browser

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build relay image
        run: docker build -f apps/collab-relay/Dockerfile -t dude-collab-relay .

      - name: Build hub image
        run: docker build -f apps/hub/Dockerfile -t dude-hub .

      - name: Start hub container with a named volume
        run: docker run -d --name hub -p 127.0.0.1:47600:47600 -v dude-hub-data:/data dude-hub

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hub)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs hub
          exit 1

      - name: Bootstrap the owner and verify it survives a restart
        run: |
          set -euo pipefail
          docker cp hub:/data/config/tls/cert.pem cert.pem
          CURL="curl -sS --fail-with-body --cacert cert.pem --resolve localhost:47600:127.0.0.1"
          URL=https://localhost:47600
          hello=$($CURL $URL/api/v1/hello)
          echo "$hello"
          echo "$hello" | jq -e '.bootstrapped == false'
          token=$(docker exec hub node /opt/dude-hub/dude-hub.cjs setup-token | jq -r .token)
          body=$(jq -n --arg t "$token" '{setupToken:$t, ownerDisplayName:"CI Owner", environmentName:"CI", password:"correct horse battery staple 42"}')
          $CURL -X POST -H "Origin: $URL" -H 'Content-Type: application/json' -d "$body" $URL/api/v1/bootstrap | jq -e '.recoveryCodes | length == 10'
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'
          docker restart hub
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hub)" = healthy ] && break
            sleep 2
          done
          docker cp hub:/data/config/tls/cert.pem cert-after.pem
          cmp cert.pem cert-after.pem
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'

      - name: Hub logs on failure
        if: failure()
        run: docker logs hub || true

  hub-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the Hub web app
        run: npm run build:hub-web

      - name: Compile the Hub
        run: npm run hub:compile

      - name: Run Hub e2e tests
        run: npm run test:e2e:hub

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hub
          path: playwright-report-hub
          retention-days: 7

  # Windows service lifecycle of the Hub that the desktop installer embeds. Pushes only, as before.
  hub-service:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run hub:stage
      - name: Service lifecycle (install, bootstrap, update, LAN, uninstall)
        run: node scripts/check-hub-service.mjs --require

  deploy:
    needs: [build, docker-smoke, hub-e2e, hub-service]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Windows desktop installer + Hub installer, uploaded to a draft GitHub Release.
  # Platform-independent gates already ran in `build`; only Windows-specific ones repeat here.
  release:
    needs: [build, docker-smoke, hub-e2e, hub-service]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    # Reruns of one commit share a release writer; different commits release different versions.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Derive release version
        id: release
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($base -notmatch '^(\d+)\.(\d+)\.0$') { throw "package.json version must be a <major>.<minor>.0 base; found $base." }
          $prefix = "$($Matches[1]).$($Matches[2])"
          $shallow = git rev-parse --is-shallow-repository
          if ($LASTEXITCODE -ne 0 -or $shallow -ne 'false') { throw 'The release version needs full history; check out with fetch-depth: 0.' }
          $count = git rev-list --count HEAD
          if ($LASTEXITCODE -ne 0 -or $count -notmatch '^\d+$') { throw 'Could not count commits for the release version.' }
          $version = "$prefix.$count"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw "Could not set package.json version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify release workflow
        run: node --test scripts/release-workflow.spec.mjs

      - name: Run Electron networking tests
        run: npm run test:electron

      - name: Build (Angular, Electron configuration)
        run: npm run build -- --configuration production,electron

      - name: Compile Electron main/preload
        run: npm run electron:compile

      - name: Build Windows network helper
        run: npm run electron:helper

      - name: Verify ICMP helper on IPv4 and IPv6 loopback
        shell: pwsh
        run: |
          $ipv4 = & .\build\network-icmp.exe probe 127.0.0.1 ipv4 64 64 1000 | ConvertFrom-Json
          $ipv6 = & .\build\network-icmp.exe probe ::1 ipv6 64 64 1000 | ConvertFrom-Json
          if ($ipv4.status -ne 'success' -or $ipv6.status -ne 'success') { throw 'ICMP helper loopback probes failed.' }

      - name: Production desktop acceptance in an isolated profile
        run: npm run check:desktop

      - name: Build the Device Agent executable
        run: node scripts/build-sea.mjs --bundle dist/electron/device-agent.js --out dist/agent --name dude-agent

      # The optional DUDE Hub (PD-025): the Hub web build, SEA, WinSW and the standalone DUDE-Hub-Setup.exe.
      # The desktop installer embeds the Hub installer (extraResources; in-app Update Hub runs it with /UPDATE), so it
      # must exist before electron-builder runs. Hub binaries ship unsigned (SHA256 sums are published).
      - name: Build the Hub web build
        run: npm run build:hub-web

      - name: Stage the Hub and build DUDE-Hub-Setup.exe
        run: npm run hub:stage && npm run hub:installer

      # Keep publish configuration for app-update.yml/latest.yml generation, but
      # let this workflow own release creation. Parallel electron-builder uploads
      # can race to create multiple draft releases for the same tag.
      - name: Package (NSIS)
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Verify packaged network helper
        shell: pwsh
        run: |
          $source = (Get-FileHash build\network-icmp.exe).Hash
          $packaged = (Get-FileHash release\win-unpacked\resources\network-icmp.exe).Hash
          if ($source -ne $packaged) { throw 'NSIS source tree does not contain the network helper.' }
          $agent = (Get-FileHash dist\agent\dude-agent.exe).Hash
          $packagedAgent = (Get-FileHash release\win-unpacked\resources\dude-agent.exe).Hash
          if ($agent -ne $packagedAgent) { throw 'NSIS source tree does not contain the Device Agent.' }

      - name: Verify the desktop installer embeds the Hub installer
        shell: pwsh
        run: |
          $hubInstaller = (Get-FileHash dist\hub-installer\DUDE-Hub-Setup.exe).Hash
          $packagedHub = (Get-FileHash release\win-unpacked\resources\DUDE-Hub-Setup.exe).Hash
          if ($hubInstaller -ne $packagedHub) { throw 'NSIS source tree does not contain the Hub installer.' }

      # The draft targets this commit; GitHub creates the tag when the draft is published.
      - name: Upload all assets to one draft release
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $hub = 'dist\hub-installer\DUDE-Hub-Setup.exe'
          $desktop = "release\DUDE-Setup-$version.exe"
          $assets = @($desktop, "$desktop.blockmap", 'release\latest.yml', $hub)
          foreach ($file in $assets) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $lines = foreach ($f in @($desktop, $hub)) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          Set-Content -Path release\SHA256SUMS.txt -Value $lines -Encoding ascii
          $assets += 'release\SHA256SUMS.txt'

          # List drafts as well as published releases, including older pages.
          # Do not treat an API/authentication failure as a missing release.
          $releaseJson = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[] | {id, tag_name, draft}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $releases = @($releaseJson | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.tag_name -ceq $tag })
          if ($releases.Count -gt 1) {
            throw "Multiple releases already exist for $tag (IDs: $($releases.id -join ', ')). Consolidate the drafts before rerunning."
          }
          if ($releases.Count -eq 1 -and -not $releases[0].draft) {
            throw "Release $tag is already published; refusing to replace its assets."
          }
          if ($releases.Count -eq 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all assets to $tag." }

          $uploadedJson = gh release view $tag --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify release $tag." }
          $uploaded = $uploadedJson | ConvertFrom-Json
          if (-not $uploaded.isDraft) { throw "Release $tag must remain a draft for review." }
          foreach ($file in $assets) {
            $local = Get-Item -LiteralPath $file
            $remote = @($uploaded.assets | Where-Object { $_.name -ceq $local.Name })
            if ($remote.Count -ne 1 -or $remote[0].size -ne $local.Length) {
              throw "Release $tag is missing or has an incomplete asset: $($local.Name)"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

name: CI

# One run per push: parallel Linux gates and, on master pushes, Windows packaging
# alongside them. The GitHub Pages deploy and the draft release (`publish`) wait
# for every gate below.
#
# The release version is never committed. package.json holds a <major>.<minor>.0
# base and the package job sets the patch to the commit count of master
# (`git rev-list --count HEAD`) inside the runner, so every build of a commit
# gets the same, ever-increasing version and nothing pushes back to master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The Linux gates run as parallel jobs; each repeats only the ~1 minute of setup.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify generated registry/docs are up to date
        run: |
          npm run generate:registry
          git diff --exit-code -- apps/web/src/app/core/parity/testing/fixture-loaders.generated.ts packages/tool-registry/src/index.ts apps/web/src/app/core/registry/tool-loaders.generated.ts apps/web/src/app/core/pipeline/pipeline-workers.generated.ts packages/domain/src/core/appearance/appearance-axes.generated.ts packages/domain/src/core/appearance/theme-tokens.generated.ts apps/mobile/src/registry/mobile-bindings.generated.ts docs/architecture/phase31a-extraction-inventory.json docs/architecture/data-scope-inventory.json apps/web/src/app/core/registry/tool-definitions.ts apps/web/src/app/core/registry/panel-definitions.ts README.md SECURITY.md apps/web/public/manifest.webmanifest ||             (echo '::error::tool-definitions.ts, README.md, SECURITY.md, or apps/web/public/manifest.webmanifest is stale — a <id>.manifest.ts changed without regenerating (npm run generate:registry) and committing the result.' && exit 1)

      - name: Lint (dependency/platform boundaries)
        run: npm run lint

      - name: Verify Dockerfiles copy every workspace manifest
        run: npm run check:dockerfiles

      - name: Independent portable-core consumption
        run: npm run check:portable

      - name: Verify extraction and scope inventories
        run: npm run check:inventory

      - name: Verify desktop and relay declarations
        run: npm run check:hosts

  # `npm run test:high-consequence` is not repeated here: it re-runs test:packages and filtered subsets of
  # ng test, test:electron and test:hub, all of which CI runs in full.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Electron boundary tests
        run: npm run test:electron

      - name: Hub service tests (foreground Hub integration suite)
        run: npm run test:hub

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload build artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dude/browser

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build relay image
        run: docker build -f apps/collab-relay/Dockerfile -t dude-collab-relay .

      - name: Build hub image
        run: docker build -f apps/hub/Dockerfile -t dude-hub .

      - name: Start hub container with a named volume
        run: docker run -d --name hub -p 127.0.0.1:47600:47600 -v dude-hub-data:/data dude-hub

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hub)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs hub
          exit 1

      - name: Verify the Hub serves its web UI and API
        run: |
          set -euo pipefail
          URL=https://localhost:47600
          CURL="curl -sS -k --resolve localhost:47600:127.0.0.1"
          headers=$($CURL -D - -o /dev/null -H 'Accept-Encoding: br' $URL/)
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 200'
          echo "$headers" | grep -i '^content-type:' | grep -qi 'text/html'
          echo "$headers" | grep -i '^content-encoding: br' > /dev/null
          $CURL $URL/ | grep -q '<app-root'
          $CURL -H 'Accept: application/json' $URL/api/v1/hello | jq -e 'type == "object"'
          $CURL -D - -o /dev/null $URL/api/v1/hello | grep -i '^content-type:' | grep -qi 'application/json'

      - name: Bootstrap the owner and verify it survives a restart
        run: |
          set -euo pipefail
          docker cp hub:/data/config/tls/cert.pem cert.pem
          CURL="curl -sS --fail-with-body --cacert cert.pem --resolve localhost:47600:127.0.0.1"
          URL=https://localhost:47600
          hello=$($CURL $URL/api/v1/hello)
          echo "$hello"
          echo "$hello" | jq -e '.bootstrapped == false'
          token=$(docker exec hub node /opt/dude-hub/dude-hub.cjs setup-token | jq -r .token)
          body=$(jq -n --arg t "$token" '{setupToken:$t, ownerDisplayName:"CI Owner", environmentName:"CI", password:"correct horse battery staple 42"}')
          $CURL -X POST -H "Origin: $URL" -H 'Content-Type: application/json' -d "$body" $URL/api/v1/bootstrap | jq -e '.recoveryCodes | length == 10'
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'
          docker restart hub
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hub)" = healthy ] && break
            sleep 2
          done
          docker cp hub:/data/config/tls/cert.pem cert-after.pem
          cmp cert.pem cert-after.pem
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'

      - name: Hub logs on failure
        if: failure()
        run: docker logs hub || true

  hub-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the Hub web app
        run: npm run build:hub-web

      - name: Compile the Hub
        run: npm run hub:compile

      - name: Run Hub e2e tests
        run: npm run test:e2e:hub

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hub
          path: playwright-report-hub
          retention-days: 7

  # Windows service lifecycle of the Hub that the desktop installer embeds. Pushes only, as before.
  hub-service:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run hub:stage
      - name: Service lifecycle (install, bootstrap, update, LAN, uninstall)
        run: node scripts/check-hub-service.mjs --require

  mobile-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run check:mobile && npm run test:mobile && npm run mobile:bundle

  mobile-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      DUDE_ANDROID_KEYSTORE_PASSWORD: acceptance-only
      DUDE_ANDROID_KEY_PASSWORD: acceptance-only
      DUDE_ANDROID_KEY_ALIAS: acceptance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Prepare verification-only signing key and version
        run: |
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/acceptance.p12" -storetype PKCS12 -storepass:env DUDE_ANDROID_KEYSTORE_PASSWORD -keypass:env DUDE_ANDROID_KEY_PASSWORD -alias acceptance -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=DUDE emulator acceptance only'
          echo "DUDE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/acceptance.p12" >> "$GITHUB_ENV"
          echo "DUDE_ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "DUDE_ANDROID_VERSION_NAME=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: npm run generate:registry && npm run build:packages && npm run mobile:prebuild
      - run: node scripts/fetch-maestro.mjs
      # Without /dev/kvm access the emulator falls back to software emulation (-accel off) and goes unresponsive.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Compile before the emulator boots so the build does not compete with it for CPU.
      - name: Build the instrumentation and release APKs
        working-directory: apps/mobile/android
        run: ./gradlew :dude-hub:assembleDebugAndroidTest :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain --max-workers=4
      - name: API29/API36 native and shell acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            cd apps/mobile/android && ./gradlew :dude-hub:connectedDebugAndroidTest :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain --max-workers=4 && cd ../../..
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            MAESTRO_PATH="$PWD/tmp/mobile-toolchain/maestro/maestro/bin/maestro" npm run test:e2e:mobile
      - name: Remove verification-only key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/acceptance.p12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-acceptance-api-${{ matrix.api-level }}
          path: |
            apps/mobile/modules/dude-hub/android/build/reports/androidTests/
            test-results/mobile/

  mobile-package:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-preview
    permissions:
      contents: read
    env:
      DUDE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DUDE_ANDROID_KEYSTORE_PASSWORD }}
      DUDE_ANDROID_KEY_ALIAS: ${{ secrets.DUDE_ANDROID_KEY_ALIAS }}
      DUDE_ANDROID_KEY_PASSWORD: ${{ secrets.DUDE_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Materialize protected preview keystore
        env:
          DUDE_ANDROID_KEYSTORE_BASE64: ${{ secrets.DUDE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$DUDE_ANDROID_KEYSTORE_BASE64" || { echo '::error::Protected Android preview keystore is missing'; exit 1; }
          umask 077
          printf '%s' "$DUDE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dude-preview.p12"
          echo "DUDE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dude-preview.p12" >> "$GITHUB_ENV"
      - run: npm run mobile:package
      - name: Remove protected preview keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/dude-preview.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-assets
          path: dist/mobile-package/*
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [checks, unit, desktop-tests, web, docker-smoke, hub-e2e, hub-service, mobile-checks, mobile-native]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Windows desktop installer + Hub installer, built alongside the gates and handed to `publish` as a
  # workflow artifact. Platform-independent gates run in the Linux jobs; only Windows-specific ones repeat here.
  package:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Derive release version
        id: release
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($base -notmatch '^(\d+)\.(\d+)\.0$') { throw "package.json version must be a <major>.<minor>.0 base; found $base." }
          $prefix = "$($Matches[1]).$($Matches[2])"
          $shallow = git rev-parse --is-shallow-repository
          if ($LASTEXITCODE -ne 0 -or $shallow -ne 'false') { throw 'The release version needs full history; check out with fetch-depth: 0.' }
          $count = git rev-list --count HEAD
          if ($LASTEXITCODE -ne 0 -or $count -notmatch '^\d+$') { throw 'Could not count commits for the release version.' }
          $version = "$prefix.$count"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw "Could not set package.json version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify release workflow
        run: node --test scripts/release-workflow.spec.mjs

      - name: Run Electron networking tests
        run: npm run test:electron

      - name: Build (Angular, Electron configuration)
        run: npm run build -- --configuration production,electron

      - name: Compile Electron main/preload
        run: npm run electron:compile

      - name: Build Windows network helper
        run: npm run electron:helper

      - name: Verify ICMP helper on IPv4 and IPv6 loopback
        shell: pwsh
        run: |
          $ipv4 = & .\build\network-icmp.exe probe 127.0.0.1 ipv4 64 64 1000 | ConvertFrom-Json
          $ipv6 = & .\build\network-icmp.exe probe ::1 ipv6 64 64 1000 | ConvertFrom-Json
          if ($ipv4.status -ne 'success' -or $ipv6.status -ne 'success') { throw 'ICMP helper loopback probes failed.' }

      - name: Production desktop acceptance in an isolated profile
        run: npm run check:desktop

      - name: Build the Device Agent executable
        run: node scripts/build-sea.mjs --bundle dist/electron/device-agent.js --out dist/agent --name dude-agent

      # The optional DUDE Hub (PD-025): the Hub web build, SEA, WinSW and the standalone DUDE-Hub-Setup.exe.
      # The desktop installer embeds the Hub installer (extraResources; in-app Update Hub runs it with /UPDATE), so it
      # must exist before electron-builder runs. Hub binaries ship unsigned (SHA256 sums are published).
      - name: Build the Hub web build
        run: npm run build:hub-web

      - name: Stage the Hub and build DUDE-Hub-Setup.exe
        run: npm run hub:stage && npm run hub:installer

      # Keep publish configuration for app-update.yml/latest.yml generation, but
      # let this workflow own release creation. Parallel electron-builder uploads
      # can race to create multiple draft releases for the same tag.
      - name: Package (NSIS)
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Verify packaged network helper
        shell: pwsh
        run: |
          $source = (Get-FileHash build\network-icmp.exe).Hash
          $packaged = (Get-FileHash release\win-unpacked\resources\network-icmp.exe).Hash
          if ($source -ne $packaged) { throw 'NSIS source tree does not contain the network helper.' }
          $agent = (Get-FileHash dist\agent\dude-agent.exe).Hash
          $packagedAgent = (Get-FileHash release\win-unpacked\resources\dude-agent.exe).Hash
          if ($agent -ne $packagedAgent) { throw 'NSIS source tree does not contain the Device Agent.' }

      - name: Verify the desktop installer embeds the Hub installer
        shell: pwsh
        run: |
          $hubInstaller = (Get-FileHash dist\hub-installer\DUDE-Hub-Setup.exe).Hash
          $packagedHub = (Get-FileHash release\win-unpacked\resources\DUDE-Hub-Setup.exe).Hash
          if ($hubInstaller -ne $packagedHub) { throw 'NSIS source tree does not contain the Hub installer.' }

      # The common root keeps the release\ and dist\hub-installer\ paths, so publish sees the same tree.
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/DUDE-Setup-${{ steps.release.outputs.version }}.exe
            release/DUDE-Setup-${{ steps.release.outputs.version }}.exe.blockmap
            release/latest.yml
            dist/hub-installer/DUDE-Hub-Setup.exe
          if-no-files-found: error
          retention-days: 7

  # The only job that writes releases, so nothing is published unless every gate and the packaging passed.
  publish:
    needs: [checks, unit, desktop-tests, web, docker-smoke, hub-e2e, hub-service, mobile-checks, mobile-native, package, mobile-package]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    # Reruns of one commit share a release writer; different commits release different versions.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Download signed Android preview assets
        uses: actions/download-artifact@v4
        with:
          name: android-preview-assets
          path: dist/mobile-package

      # The draft targets this commit; GitHub creates the tag when the draft is published.
      - name: Upload all assets to one draft release
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $hub = 'dist\hub-installer\DUDE-Hub-Setup.exe'
          $desktop = "release\DUDE-Setup-$version.exe"
          $apk = "dist\mobile-package\DUDE-Preview-$version.apk"
          $aab = "dist\mobile-package\DUDE-Preview-$version.aab"
          $assets = @($desktop, "$desktop.blockmap", 'release\latest.yml', $hub, $apk, $aab)
          foreach ($file in $assets) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $lines = foreach ($f in @($desktop, $hub, $apk, $aab)) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          Set-Content -Path release\SHA256SUMS.txt -Value $lines -Encoding ascii
          $assets += 'release\SHA256SUMS.txt'

          # List drafts as well as published releases, including older pages.
          # Do not treat an API/authentication failure as a missing release.
          $releaseJson = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[] | {id, tag_name, draft}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $releases = @($releaseJson | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.tag_name -ceq $tag })
          if ($releases.Count -gt 1) {
            throw "Multiple releases already exist for $tag (IDs: $($releases.id -join ', ')). Consolidate the drafts before rerunning."
          }
          if ($releases.Count -eq 1 -and -not $releases[0].draft) {
            throw "Release $tag is already published; refusing to replace its assets."
          }
          if ($releases.Count -eq 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all assets to $tag." }

          $uploadedJson = gh release view $tag --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify release $tag." }
          $uploaded = $uploadedJson | ConvertFrom-Json
          if (-not $uploaded.isDraft) { throw "Release $tag must remain a draft for review." }
          foreach ($file in $assets) {
            $local = Get-Item -LiteralPath $file
            $remote = @($uploaded.assets | Where-Object { $_.name -ceq $local.Name })
            if ($remote.Count -ne 1 -or $remote[0].size -ne $local.Length) {
              throw "Release $tag is missing or has an incomplete asset: $($local.Name)"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}

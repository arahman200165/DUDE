name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify generated registry/docs are up to date
        run: |
          npm run generate:registry
          git diff --exit-code -- apps/web/src/app/core/parity/testing/fixture-loaders.generated.ts packages/tool-registry/src/index.ts apps/web/src/app/core/registry/tool-loaders.generated.ts apps/web/src/app/core/pipeline/pipeline-workers.generated.ts packages/domain/src/core/appearance/appearance-axes.generated.ts docs/architecture/phase31a-extraction-inventory.json docs/architecture/data-scope-inventory.json apps/web/src/app/core/registry/tool-definitions.ts apps/web/src/app/core/registry/panel-definitions.ts README.md SECURITY.md apps/web/public/manifest.webmanifest || \
            (echo '::error::tool-definitions.ts, README.md, SECURITY.md, or apps/web/public/manifest.webmanifest is stale — a <id>.manifest.ts changed without regenerating (npm run generate:registry) and committing the result.' && exit 1)

      - name: Lint (dependency/platform boundaries)
        run: npm run lint

      - name: Verify Dockerfiles copy every workspace manifest
        run: npm run check:dockerfiles

      - name: Independent portable-core consumption
        run: npm run check:portable

      - name: Verify extraction and scope inventories
        run: npm run check:inventory

      - name: Verify desktop and relay declarations
        run: npm run check:hosts

      - name: Run tests
        run: npm test

      - name: Capability-specific release gate (high-consequence tools)
        run: npm run test:high-consequence

      - name: Electron boundary tests
        run: npm run test:electron

      - name: Hub service tests (foreground Hub integration suite)
        run: npm run test:hub

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload build artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dude/browser

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build relay image
        run: docker build -f apps/collab-relay/Dockerfile -t dude-collab-relay .

      - name: Build hub image
        run: docker build -f apps/hub/Dockerfile -t dude-hub .

      - name: Start hub container with a named volume
        run: docker run -d --name hub -p 127.0.0.1:47600:47600 -v dude-hub-data:/data dude-hub

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hub)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs hub
          exit 1

      - name: Bootstrap the owner and verify it survives a restart
        run: |
          set -euo pipefail
          docker cp hub:/data/config/tls/cert.pem cert.pem
          CURL="curl -sS --fail-with-body --cacert cert.pem --resolve localhost:47600:127.0.0.1"
          URL=https://localhost:47600
          hello=$($CURL $URL/api/v1/hello)
          echo "$hello"
          echo "$hello" | jq -e '.bootstrapped == false'
          token=$(docker exec hub node /opt/dude-hub/dude-hub.cjs setup-token | jq -r .token)
          body=$(jq -n --arg t "$token" '{setupToken:$t, ownerDisplayName:"CI Owner", environmentName:"CI", password:"correct horse battery staple 42"}')
          $CURL -X POST -H "Origin: $URL" -H 'Content-Type: application/json' -d "$body" $URL/api/v1/bootstrap | jq -e '.recoveryCodes | length == 10'
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'
          docker restart hub
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hub)" = healthy ] && break
            sleep 2
          done
          docker cp hub:/data/config/tls/cert.pem cert-after.pem
          cmp cert.pem cert-after.pem
          $CURL $URL/api/v1/hello | jq -e '.bootstrapped == true'

      - name: Hub logs on failure
        if: failure()
        run: docker logs hub || true

  hub-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the Hub web app
        run: npm run build:hub-web

      - name: Compile the Hub
        run: npm run hub:compile

      - name: Run Hub e2e tests
        run: npm run test:e2e:hub

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hub
          path: playwright-report-hub
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

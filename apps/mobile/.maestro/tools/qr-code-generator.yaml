appId: io.github.arahman200165.dude.preview
name: QR Code Generator on Android
tags: [tools, encoding]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/qr-code-generator"
- assertVisible:
    id: "tool-input"
# Text preset: replace the web default text with "hello".
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "hello"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "qr-preview"
    direction: DOWN
# Matrix size computed in Node: QRCode.create('hello', { errorCorrectionLevel: 'M' }).modules.size === 21
#   node -e "console.log(require('qrcode').create('hello',{errorCorrectionLevel:'M'}).modules.size)"   -> 21
# (the tool formats it as "21 x 21 modules" with U+00D7).
- assertVisible:
    id: "qr-size"
    text: "21 × 21 modules"
- assertVisible:
    id: "qr-payload"
    text: "hello"
# Wi-Fi preset: SSID "Home", WPA, password "secret123".
- scrollUntilVisible:
    element:
      id: "mode-wifi"
    direction: UP
- tapOn:
    id: "mode-wifi"
- tapOn:
    id: "qr-wifi-ssid"
- inputText: "Home"
- hideKeyboard
- tapOn:
    id: "mode-WPA"
- tapOn:
    id: "qr-wifi-password"
- inputText: "secret123"
- hideKeyboard
# The password is masked until Show is tapped (the payload text hides it too).
- tapOn:
    id: "qr-wifi-password-toggle"
- scrollUntilVisible:
    element:
      id: "qr-payload"
    direction: DOWN
# Expected value computed with buildWifiPayload({ ssid: 'Home', password: 'secret123', security: 'WPA', hidden: false }) from
# @dude/tool-engine/tools/qr-code-generator/qr-payload (same builder as qr-payload.spec.ts:6 uses for 'HomeNet'/'hunter2'):
#   -> WIFI:T:WPA;S:Home;P:secret123;;
- assertVisible:
    id: "qr-payload"
    text: "WIFI:T:WPA;S:Home;P:secret123;;"
- assertVisible:
    id: "qr-preview"

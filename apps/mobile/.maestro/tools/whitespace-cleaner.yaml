appId: io.github.arahman200165.dude.preview
name: Whitespace Cleaner on Android
tags: [tools, text]
---
# clearState: the cleanup options are persisted preferences, so start from the defaults.
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/whitespace-cleaner"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
- tapOn:
    id: "tool-input"
- inputText: "  hello    world  "
- hideKeyboard
# Default options (trim, collapse, strip trailing, LF): computed with cleanWhitespace(input, DEFAULT_WHITESPACE_OPTIONS)
# from @dude/tool-engine/tools/whitespace-cleaner/whitespace-clean; trim alone is whitespace-clean.spec.ts:21-23.
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "hello world"
# Collapse off: computed with { ...DEFAULT_WHITESPACE_OPTIONS, collapseSpaces: false } -> "hello    world".
- scrollUntilVisible:
    element:
      id: "tool-options"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-options"
- scrollUntilVisible:
    element:
      id: "option-collapseSpaces"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "option-collapseSpaces"
- tapOn:
    id: "tool-options-done"
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "hello    world"

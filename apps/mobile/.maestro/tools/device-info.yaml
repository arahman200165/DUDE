appId: io.github.arahman200165.dude.preview
name: Device Info on Android
tags: [tools, developer]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/device-info"
- assertVisible:
    id: "device-info-refresh"
# Values are device-dependent, so assert row shape (collector: apps/mobile/src/tools/device-info/device-info-collector.ts).
# Rows are asserted in page order (runtime, display, locale, os) because the screen is long and only scrolls down between them.
- scrollUntilVisible:
    element:
      id: "kv-hermes-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-hermes-value"
    text: "Yes"
- scrollUntilVisible:
    element:
      id: "kv-pixel-ratio-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-pixel-ratio-value"
    text: "[0-9.]+"
- scrollUntilVisible:
    element:
      id: "kv-font-scale-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-font-scale-value"
    text: "[0-9.]+"
- scrollUntilVisible:
    element:
      id: "kv-time-zone-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-time-zone-value"
    text: ".+"
- scrollUntilVisible:
    element:
      id: "kv-os-version-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-os-version-value"
    text: "Android .*"
- scrollUntilVisible:
    element:
      id: "device-info-refresh"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "device-info-refresh"
- scrollUntilVisible:
    element:
      id: "kv-hermes-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-hermes-value"
    text: "Yes"
- scrollUntilVisible:
    element:
      id: "device-info-copy-json"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "device-info-copy-json"

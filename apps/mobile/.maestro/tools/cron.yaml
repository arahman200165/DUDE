appId: io.github.arahman200165.dude.preview
name: Cron Expression Parser on Android
tags: [tools, date-time]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/cron"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
# Preset chips fill the input; "* * * * *" has a "*" minute field.
- scrollUntilVisible:
    element:
      id: "preset-every-minute"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "preset-every-minute"
- scrollUntilVisible:
    element:
      id: "kv-field-minute-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-field-minute-value"
    text: "\\*"
# */5 * * * *: the engine uses cronstrue verbose output, computed with parseCronExpression('*/5 * * * *', ...) from
# @dude/tool-engine/tools/cron/cron-parse => "Every 5 minutes, every hour, every day".
- scrollUntilVisible:
    element:
      id: "tool-input-clear"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "*/5 * * * *"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "Every 5 minutes.*"
- scrollUntilVisible:
    element:
      id: "kv-field-minute-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-field-minute-value"
    text: "\\*/5"
# UTC display: run rows are ISO strings whose minute is a multiple of 5.
- scrollUntilVisible:
    element:
      id: "mode-utc"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-utc"
- scrollUntilVisible:
    element:
      id: "kv-run-1-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-run-1-value"
    text: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9][05]:00\\.000Z"
# Previous runs.
- scrollUntilVisible:
    element:
      id: "mode-previous"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-previous"
- scrollUntilVisible:
    element:
      id: "kv-run-1-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-run-1-value"
    text: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9][05]:00\\.000Z"
# Out-of-range field: engine error "Constraint error, got value 61 expected range 0-59" (computed with parseCronExpression).
- scrollUntilVisible:
    element:
      id: "tool-input-clear"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "61 * * * *"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"

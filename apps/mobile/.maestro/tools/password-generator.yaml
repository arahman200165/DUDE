appId: io.github.arahman200165.dude.preview
name: Password / Passphrase Generator on Android
tags: [tools, security]
---
# clearState gives the default options (length 16, all four classes on); the flow turns three classes off so only digits remain.
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/password-generator"
- scrollUntilVisible:
    element:
      id: "mode-password"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "mode-password"
- scrollUntilVisible:
    element:
      id: "tool-options"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-options"
- scrollUntilVisible:
    element:
      id: "option-useUppercase"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "option-useUppercase"
- scrollUntilVisible:
    element:
      id: "option-useLowercase"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "option-useLowercase"
- scrollUntilVisible:
    element:
      id: "option-useSymbols"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "option-useSymbols"
- tapOn:
    id: "tool-options-done"
- tapOn:
    id: "tool-run"
# Default length 16, digits only (random output: asserted by pattern; the pattern logic is unit-tested in password-generator-mobile.spec.ts).
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "[0-9]{16}"
# With every character class off the engine reports an error (packages/tool-engine/src/tools/password-generator/password-generator-logic.ts).
- scrollUntilVisible:
    element:
      id: "tool-options"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-options"
- scrollUntilVisible:
    element:
      id: "option-useDigits"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "option-useDigits"
- tapOn:
    id: "tool-options-done"
- tapOn:
    id: "tool-run"
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"
    text: ".*Select at least one character type.*"
# Passphrase mode: "-" separator, six words (a few EFF words contain a hyphen themselves) and an appended digit by default.
- scrollUntilVisible:
    element:
      id: "mode-passphrase"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-passphrase"
- tapOn:
    id: "tool-run"
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "[a-z]+(-[a-z]+)+-[0-9]"

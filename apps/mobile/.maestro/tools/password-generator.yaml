appId: io.github.arahman200165.dude.preview
name: Password / Passphrase Generator on Android
tags: [tools, security]
---
# clearState gives the default options (length 16, all four classes on); the flow turns three classes off so only digits remain.
- launchApp:
    clearState: true
- openLink: "dude://tools/password-generator"
- assertVisible:
    id: "mode-password"
- tapOn:
    id: "tool-options"
- tapOn:
    id: "option-useUppercase"
- tapOn:
    id: "option-useLowercase"
- tapOn:
    id: "option-useSymbols"
- tapOn:
    id: "tool-options-done"
- tapOn:
    id: "tool-run"
# Default length 16, digits only (random output: asserted by pattern; the pattern logic is unit-tested in password-generator-mobile.spec.ts).
- assertVisible:
    id: "tool-output"
    text: "[0-9]{16}"
# With every character class off the engine reports an error (packages/tool-engine/src/tools/password-generator/password-generator-logic.ts).
- tapOn:
    id: "tool-options"
- tapOn:
    id: "option-useDigits"
- tapOn:
    id: "tool-options-done"
- tapOn:
    id: "tool-run"
- assertVisible:
    id: "tool-error"
    text: ".*Select at least one character type.*"
# Passphrase mode: "-" separator, six words (a few EFF words contain a hyphen themselves) and an appended digit by default.
- tapOn:
    id: "mode-passphrase"
- tapOn:
    id: "tool-run"
- assertVisible:
    id: "tool-output"
    text: "[a-z]+(-[a-z]+)+-[0-9]"

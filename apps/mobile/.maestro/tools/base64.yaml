appId: io.github.arahman200165.dude.preview
name: Base64 Encoder / Decoder on Android
tags: [tools, encoding]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/base64"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
- scrollUntilVisible:
    element:
      id: "mode-encode"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-encode"
- tapOn:
    id: "tool-input"
- inputText: "foobar"
- hideKeyboard
# Expected value copied from packages/crypto/src/base64-codec.spec.ts:13 (RFC 4648 vector foobar -> Zm9vYmFy)
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "Zm9vYmFy"
- scrollUntilVisible:
    element:
      id: "mode-decode"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-decode"
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "Zm9vYmFy"
- hideKeyboard
# Same vector decoded: packages/crypto/src/base64-codec.spec.ts:19
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "foobar"
- scrollUntilVisible:
    element:
      id: "tool-input-clear"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "not-valid-base64!!!"
- hideKeyboard
# Invalid input: packages/crypto/src/base64-codec.spec.ts:43
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"

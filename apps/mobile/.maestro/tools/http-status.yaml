appId: io.github.arahman200165.dude.preview
name: HTTP Status Codes on Android
tags: [tools, web]
---
- launchApp
- openLink: "dude://tools/http-status"
- assertVisible:
    id: "tool-input"
- tapOn:
    id: "tool-input"
- inputText: "418"
- hideKeyboard
# Row label from packages/tool-engine/src/shared/utils/http-status-codes.ts:272-273 (name "I'm a Teapot")
- assertVisible:
    id: "kv-status-418"
- assertVisible: "418 I'm a Teapot.*"
- assertVisible:
    id: "kv-status-418-value"
    text: "Originally defined by.*"
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "404"
- hideKeyboard
# http-status-codes.ts:188-191
- assertVisible: "404 Not Found.*"
- assertVisible:
    id: "kv-status-404-value"
    text: "The server has not found anything matching the requested URI."
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "zzzzqq"
- hideKeyboard
# No entry contains this text; filterHttpStatusCodes returns [] (http-status-search.spec.ts:36 style)
- assertVisible:
    id: "tool-error"

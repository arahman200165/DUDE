appId: io.github.arahman200165.dude.preview
name: XML Formatter on Android
tags: [tools, text]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/xml-formatter"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
- scrollUntilVisible:
    element:
      id: "mode-minify"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-minify"
- tapOn:
    id: "tool-input"
- inputText: "<root> <a>1</a> </root>"
- hideKeyboard
# Computed with processXml('<root> <a>1</a> </root>', 'minify', 2) from @dude/tool-engine/tools/xml-formatter/xml-format
# (same shape as xml-format.spec.ts:36 'minifies formatted XML'); the engine runs on the worklet worker runtime.
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "<root><a>1</a></root>"
- scrollUntilVisible:
    element:
      id: "mode-format"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-format"
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "<root><a>1</a></root>"
- hideKeyboard
# Computed with processXml('<root><a>1</a></root>', 'format', 2): "<root>\n  <a>1</a>\n</root>" (xml-format.spec.ts:19 shape)
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: "(?s)<root>.+<a>1</a>.+</root>"
- scrollUntilVisible:
    element:
      id: "mode-validate"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-validate"
- scrollUntilVisible:
    element:
      id: "xml-valid"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "xml-valid"
- scrollUntilVisible:
    element:
      id: "tool-input-clear"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "<root><a></root>"
- hideKeyboard
# Invalid input (xml-format.spec.ts:60 'rejects malformed XML in validate mode too')
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"

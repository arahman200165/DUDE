appId: io.github.arahman200165.dude.preview
name: YAML / JSON Converter on Android
tags: [tools, data]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/yaml-json"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
- scrollUntilVisible:
    element:
      id: "mode-yaml-to-json"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-yaml-to-json"
- tapOn:
    id: "tool-input-sample"
# Sample "a: 1 / b: [2, 3]" as YAML to JSON, 2-space indent: packages/tool-engine/src/tools/yaml-json/yaml-convert.spec.ts:29
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: '(?s)\{\s+"a": 1,\s+"b": \[\s+2,\s+3\s+\]\s+\}'
- scrollUntilVisible:
    element:
      id: "mode-json-to-yaml"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-json-to-yaml"
- tapOn:
    id: "tool-input-sample"
# Sample {"a":1,"b":[2,3]} as JSON to YAML: packages/tool-engine/src/tools/yaml-json/yaml-convert.spec.ts:41
- scrollUntilVisible:
    element:
      id: "tool-output"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-output"
    text: '(?s)a: 1\s+b:\s+- 2\s+- 3\s*'
- scrollUntilVisible:
    element:
      id: "tool-input-clear"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "{a:1}"
- hideKeyboard
# Unquoted property name is invalid JSON (json-to-yaml parses with JSON.parse)
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"
- scrollUntilVisible:
    element:
      id: "mode-yaml-to-json"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "mode-yaml-to-json"
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "a: [1, 2"
- hideKeyboard
# Unterminated flow sequence: js-yaml "unexpected end of the stream within a flow collection"
- scrollUntilVisible:
    element:
      id: "tool-error"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-error"

appId: io.github.arahman200165.dude.preview
name: Password Strength & Entropy Analyzer on Android
tags: [tools, security]
---
- launchApp:
    clearState: true
# Wait for the shell before the deep link: a link delivered while the cold-started app is still mounting the router is dropped.
- assertVisible: "This workbench"
- openLink: "dude://tools/password-strength-analyzer"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
# Weak: "password" is in the common-password list (packages/tool-engine/src/tools/password-strength-analyzer/password-strength-logic.spec.ts:24
# uses 'password123'; 'password' computed with analyzePassword from @dude/tool-engine: very-weak, charset 26, 37.6 bits).
- tapOn:
    id: "tool-input"
- inputText: "password"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "kv-verdict-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-verdict-value"
    text: "Very weak"
- scrollUntilVisible:
    element:
      id: "kv-charset-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-charset-value"
    text: "26"
- scrollUntilVisible:
    element:
      id: "kv-entropy-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-entropy-value"
    text: "37.6 bits"
# The field is masked until Show is tapped.
- scrollUntilVisible:
    element:
      id: "tool-input-toggle"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- tapOn:
    id: "tool-input-toggle"
- scrollUntilVisible:
    element:
      id: "tool-input"
    direction: UP
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "tool-input"
    text: "password"
# Strong: a 20-char random alphanumeric string. The spec vector (password-strength-logic.spec.ts:56, 'kx7!qP2@zR9#mN5$wT1%') contains shell-special
# symbols that are risky to type through Maestro, so its symbol-free form was computed with analyzePassword: strong, charset 62, 119.1 bits, no penalties.
- tapOn:
    id: "tool-input-clear"
- tapOn:
    id: "tool-input"
- inputText: "kx7qP2zR9mN5wT1vB8cL"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "kv-verdict-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-verdict-value"
    text: "Strong"
- scrollUntilVisible:
    element:
      id: "kv-entropy-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-entropy-value"
    text: "119.1 bits"
- scrollUntilVisible:
    element:
      id: "kv-penalties-value"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- assertVisible:
    id: "kv-penalties-value"
    text: "None"

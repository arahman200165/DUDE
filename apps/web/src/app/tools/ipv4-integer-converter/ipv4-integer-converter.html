<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex overflow-hidden rounded-sm border border-border text-ui text-text-muted">
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'ip-to-int'"
        [class.text-on-accent]="direction() === 'ip-to-int'"
        [class.text-text-muted]="direction() !== 'ip-to-int'"
        (click)="setDirection('ip-to-int')"
      >
        IP → Integer
      </button>
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'int-to-ip'"
        [class.text-on-accent]="direction() === 'int-to-ip'"
        [class.text-text-muted]="direction() !== 'int-to-ip'"
        (click)="setDirection('int-to-ip')"
      >
        Integer → IP
      </button>
    </div>

    <input
      type="text"
      class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="input()"
      (input)="onInput($event)"
    />

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
          <span class="font-mono text-xs text-text">{{ current.output }}</span>
          <app-copy-button [text]="current.output" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'encode'"
          [class.text-on-accent]="mode() === 'encode'"
          [class.text-text-muted]="mode() !== 'encode'"
          (click)="setMode('encode')"
        >
          Encode
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="mode() === 'decode'"
          [class.text-on-accent]="mode() === 'decode'"
          [class.text-text-muted]="mode() !== 'decode'"
          (click)="setMode('decode')"
        >
          Decode
        </button>
      </div>

      @if (mode() === 'encode') {
        <label class="flex items-center gap-1.5">
          <input type="checkbox" [checked]="encodeAllNonAscii()" (change)="toggleEncodeAllNonAscii()" />
          Encode all non-ASCII as numeric entities
        </label>
      }

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="swap()"
      >
        Swap
      </button>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">{{ mode() === 'encode' ? 'Text' : 'HTML' }}</span>
      <textarea
        rows="6"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [placeholder]="mode() === 'encode' ? 'Type or paste text here…' : 'Paste HTML with entities here…'"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">{{ mode() === 'encode' ? 'HTML' : 'Text' }}</span>
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="copy()"
        >
          Copy
        </button>
      </div>
      <textarea
        rows="6"
        readonly
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
        [value]="result()"
      ></textarea>
    </div>
  </div>
</app-tool-shell>

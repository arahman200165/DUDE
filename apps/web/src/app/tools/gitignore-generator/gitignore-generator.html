<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap gap-3">
      @for (template of templates; track template.id) {
        <label class="flex items-center gap-1.5 text-ui text-text-muted">
          <input type="checkbox" [checked]="isSelected(template.id)" (change)="toggle(template.id, $event)" />
          {{ template.label }}
        </label>
      }
    </div>

    <div class="flex items-center gap-2">
      <app-copy-button [text]="output()" />
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
        (click)="download()"
      >
        Download .gitignore
      </button>
    </div>

    <textarea
      readonly
      rows="16"
      class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="output()"
    ></textarea>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-1.5 text-ui text-text-muted">
          <input type="checkbox" [checked]="monotonic()" (change)="toggleMonotonic()" />
          Monotonic
        </label>

        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
          (click)="generate()"
        >
          Generate
        </button>
        @if (generated().length > 0) {
          <button
            type="button"
            class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
            (click)="clearGenerated()"
          >
            Clear
          </button>
        }
      </div>

      @if (generated().length > 0) {
        <ul class="flex flex-col gap-1">
          @for (value of generated(); track value) {
            <li class="flex items-center justify-between rounded-sm border border-border bg-panel px-2 py-1">
              <span class="font-mono text-xs text-text">{{ value }}</span>
              <app-copy-button [text]="value" />
            </li>
          }
        </ul>
      }
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Inspect</span>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste a ULID to inspect…"
        [value]="inspectInput()"
        (input)="onInspectInput($event)"
      />

      @if (inspection(); as result) {
        @if (result.valid) {
          <div class="flex flex-wrap gap-3 rounded-sm border border-border bg-panel p-2 text-ui text-text">
            <div><span class="text-text-muted">Timestamp</span><br />{{ result.timestamp?.toISOString() }}</div>
            <div><span class="text-text-muted">Randomness</span><br /><span class="font-mono">{{ result.randomness }}</span></div>
          </div>
        } @else {
          <app-error-panel message="Not a syntactically valid ULID." />
        }
      }
    </div>
  </div>
</app-tool-shell>

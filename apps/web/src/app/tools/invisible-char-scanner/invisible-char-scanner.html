<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Input</span>
      <textarea
        rows="4"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="Paste text to scan for invisible, control, and zero-width characters…"
        [value]="input()"
        (input)="onInputChange($event)"
      ></textarea>
    </div>

    @if (occurrences().length > 0) {
      <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="text-ui text-text-muted">{{ occurrences().length }} occurrence{{ occurrences().length === 1 ? '' : 's' }} found</span>
        <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
          @for (kind of allKinds; track kind) {
            <label class="flex items-center gap-1.5">
              <input type="checkbox" [checked]="isKindSelected(kind)" (change)="toggleKind(kind)" />
              {{ kind }}
            </label>
          }
          <button
            type="button"
            class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
            (click)="applyStrip()"
          >
            Strip selected
          </button>
          <app-copy-button [text]="stripped()" label="Copy cleaned" />
        </div>
      </div>
      <div class="min-h-0 flex-1 overflow-auto rounded-sm border border-border">
        <app-data-table [columns]="columns | simpleColumns" [rows]="rows()" />
      </div>
    } @else {
      <p class="text-ui text-text-muted">No invisible, control, or zero-width characters found.</p>
    }
  </div>
</app-tool-shell>

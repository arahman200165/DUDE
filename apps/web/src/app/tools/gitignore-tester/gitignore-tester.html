<app-tool-shell>
  <div class="flex flex-col gap-4 md:flex-row">
    <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
      .gitignore rules
      <textarea
        rows="12"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="gitignoreText()"
        (input)="onGitignoreInput($event)"
      ></textarea>
    </label>

    <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
      Paths to test (one per line — a trailing "/" marks a directory)
      <textarea
        rows="12"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="pathsText()"
        (input)="onPathsInput($event)"
      ></textarea>
    </label>
  </div>

  <div class="mt-4 overflow-auto rounded-sm border border-border">
    <app-data-table [columns]="['Path', 'Result', 'Matched rule'] | simpleColumns" [rows]="tableRows()" />
  </div>
</app-tool-shell>

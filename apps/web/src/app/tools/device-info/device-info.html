<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <button
        type="button"
        class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="loading()"
        (click)="refresh()"
      >
        {{ loading() ? 'Refreshing…' : 'Refresh' }}
      </button>
      <app-copy-button [text]="text()" label="Copy all" />
      <app-copy-button [text]="json()" label="Copy JSON" />
      @if (report(); as current) {
        <span>Collected {{ current.collectedAt }}</span>
      }
    </div>

    @if (!isDesktop()) {
      <p class="text-ui text-text-muted">OS details are available in the desktop app.</p>
    }

    @for (entry of groups(); track entry.group) {
      <section class="flex flex-col gap-1">
        <h3 class="text-ui font-semibold text-text-muted">{{ entry.title }}</h3>
        <dl class="flex flex-col rounded-sm border border-border bg-panel text-ui">
          @for (fact of entry.facts; track fact.id) {
            <div class="flex items-start justify-between gap-3 border-b border-border px-3 py-1.5 last:border-b-0">
              <dt class="w-48 shrink-0 text-text-muted">{{ fact.label }}</dt>
              <dd class="min-w-0 flex-1 break-all font-mono text-text">{{ fact.value }}</dd>
              <app-copy-button [text]="fact.value" />
            </div>
          }
        </dl>
      </section>
    }
  </div>
</app-tool-shell>

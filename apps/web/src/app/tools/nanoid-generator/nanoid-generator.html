<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Count
        <input
          type="number"
          min="1"
          max="1000"
          class="w-20 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="count()"
          (input)="onCountInput($event)"
        />
      </label>
      <label class="flex flex-col gap-1 text-ui text-text-muted">
        Length
        <input
          type="number"
          min="1"
          max="512"
          class="w-20 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="size()"
          (input)="onSizeInput($event)"
        />
      </label>
      <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
        Custom alphabet (optional)
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="Defaults to the standard URL-safe alphabet…"
          [value]="alphabet()"
          (input)="onAlphabetInput($event)"
        />
      </label>
      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 text-ui text-text hover:bg-panel-elevated"
        (click)="generate()"
      >
        Generate
      </button>
      @if (generated().length > 0) {
        <button
          type="button"
          class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
          (click)="clearGenerated()"
        >
          Clear
        </button>
      }
    </div>

    @if (error()) {
      <app-error-panel [message]="error()" />
    }

    @if (generated().length > 0) {
      <ul class="flex flex-col gap-1">
        @for (value of generated(); track value) {
          <li class="flex items-center justify-between rounded-sm border border-border bg-panel px-2 py-1">
            <span class="font-mono text-xs text-text">{{ value }}</span>
            <app-copy-button [text]="value" />
          </li>
        }
      </ul>
    }
  </div>
</app-tool-shell>

<app-network-workbench kind="https-analyzer" [customForm]="true" [buildRequest]="build" [resultTemplate]="resultView" runLabel="Analyze HTTPS">
  <div workbenchForm class="flex flex-wrap items-end gap-3">
    <label class="flex flex-1 flex-col gap-1 text-text-muted">Host
      <input class="rounded-sm border border-border bg-panel px-2 py-1 font-mono text-text" [value]="host()" (input)="text($event)" placeholder="example.com" />
    </label>
    <label class="flex w-28 flex-col gap-1 text-text-muted">Port
      <input type="number" min="1" max="65535" class="rounded-sm border border-border bg-panel px-2 py-1 text-text" [value]="port()" (input)="setPort($event)" />
    </label>
    <p class="w-full text-text-muted">This runs a full TLS enumeration plus HTTP, HSTS and DNS checks, so it is reviewed before it runs. Findings are pass/warn/fail with no letter grade.</p>
  </div>
</app-network-workbench>
<app-desktop-only-control capability="native-network" label="Run network check" />

<ng-template #resultView let-result>
  @if (view(result); as analysis) {
    <div class="flex flex-col gap-3 text-ui">
      <div class="text-text-muted">{{ analysis.host }}:{{ analysis.port }} · versions {{ analysis.supportedVersions.join(', ') }}</div>
      <app-findings-list [findings]="findings(analysis)" title="HTTPS configuration" />
    </div>
  }
</ng-template>

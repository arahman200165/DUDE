<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">Start</span>
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="start()"
          (input)="onStartChange($event)"
        />
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">End</span>
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="end()"
          (input)="onEndChange($event)"
        />
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-ui text-text-muted">Step</span>
        <input
          type="text"
          class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="step()"
          (input)="onStepChange($event)"
        />
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        Zero-pad width
        <input
          type="number"
          min="0"
          class="w-20 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="padWidth()"
          (change)="onPadWidthChange($event)"
        />
      </label>

      <span>Format</span>
      <div class="flex overflow-hidden rounded-sm border border-border">
        @for (option of separators; track option.id) {
          <button
            type="button"
            class="px-2 py-0.5"
            [class.bg-accent]="separator() === option.id"
            [class.text-on-accent]="separator() === option.id"
            (click)="setSeparator(option.id)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">{{ current.value.length }} value{{ current.value.length === 1 ? '' : 's' }}</span>
            <app-copy-button [text]="formatted()" />
          </div>
          <textarea
            rows="10"
            readonly
            class="w-full whitespace-pre-wrap rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text"
            [value]="formatted()"
          ></textarea>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

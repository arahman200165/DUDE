<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="method() === 'S256'"
          [class.text-on-accent]="method() === 'S256'"
          [class.text-text-muted]="method() !== 'S256'"
          (click)="setMethod('S256')"
        >
          S256
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="method() === 'plain'"
          [class.text-on-accent]="method() === 'plain'"
          [class.text-text-muted]="method() !== 'plain'"
          (click)="setMethod('plain')"
        >
          plain
        </button>
      </div>

      <label class="flex items-center gap-2">
        Length
        <input
          type="range"
          [min]="minLength"
          [max]="maxLength"
          [value]="length()"
          (input)="onLengthChange($event); generate()"
        />
        <span class="font-mono text-text">{{ length() }}</span>
      </label>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="generate()"
      >
        Regenerate
      </button>
    </div>

    @if (pair(); as current) {
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="text-ui text-text-muted">code_verifier</span>
          <app-copy-button [text]="current.verifier" />
        </div>
        <div class="w-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs break-all text-text">
          {{ current.verifier }}
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="text-ui text-text-muted">code_challenge ({{ current.method }})</span>
          <app-copy-button [text]="current.challenge" />
        </div>
        <div class="w-full overflow-auto rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs break-all text-text">
          {{ current.challenge }}
        </div>
      </div>
    }
  </div>
</app-tool-shell>

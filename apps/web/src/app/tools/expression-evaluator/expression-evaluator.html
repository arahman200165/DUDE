<app-tool-shell>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Expression</span>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        placeholder="sqrt(x^2 + y^2)"
        [value]="expression()"
        (input)="onExpressionChange($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Variables</span>
      <app-key-value-editor
        [pairs]="variables()"
        (pairsChange)="onVariablesChange($event)"
        keyPlaceholder="name"
        valuePlaceholder="value"
        addLabel="Add variable"
        emptyMessage="No variables — add one below, or reference none at all."
      />
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-center justify-between gap-2 rounded-sm border border-accent/40 bg-panel px-3 py-2">
          <span class="font-mono text-lg text-accent">{{ current.value }}</span>
          <app-copy-button [text]="current.value" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

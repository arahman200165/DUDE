<app-tool-shell>
  <div class="flex flex-col gap-3">
    @if (rejection(); as message) {
      <app-error-panel [message]="message" />
    }

    <app-file-drop accept="image/*" label="Drop an image here, or click to browse" (fileSelected)="onFileSelected($event)" (rejected)="onRejected($event)" />

    @if (selectedFile()) {
      <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
        <span>Original: {{ originalWidth() }} x {{ originalHeight() }} px</span>

        <div class="flex overflow-hidden rounded-sm border border-border">
          <button
            type="button"
            class="px-2 py-0.5"
            [class.bg-accent]="mode() === 'dimensions'"
            [class.text-on-accent]="mode() === 'dimensions'"
            [class.text-text-muted]="mode() !== 'dimensions'"
            (click)="mode.set('dimensions')"
          >
            Dimensions
          </button>
          <button
            type="button"
            class="px-2 py-0.5"
            [class.bg-accent]="mode() === 'percent'"
            [class.text-on-accent]="mode() === 'percent'"
            [class.text-text-muted]="mode() !== 'percent'"
            (click)="mode.set('percent')"
          >
            Percent
          </button>
        </div>

        <label class="flex items-center gap-1"><input type="checkbox" [checked]="lockAspect()" (change)="lockAspect.set(!lockAspect())" /> Lock aspect ratio</label>
      </div>

      @if (mode() === 'dimensions') {
        <div class="flex items-center gap-2 text-ui">
          <label class="flex items-center gap-1 text-text-muted">
            Width
            <input
              type="number"
              class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-text"
              [value]="targetWidth() ?? output().width"
              (input)="onWidthChange($event)"
            />
          </label>
          <label class="flex items-center gap-1 text-text-muted">
            Height
            <input
              type="number"
              class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-text"
              [value]="targetHeight() ?? output().height"
              (input)="onHeightChange($event)"
            />
          </label>
        </div>
      } @else {
        <label class="flex items-center gap-2 text-ui text-text-muted">
          Percent
          <input
            type="number"
            class="w-24 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-text"
            [value]="percent()"
            (input)="onPercentChange($event)"
          />
        </label>
      }

      <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
        <span>Output: {{ output().width }} x {{ output().height }} px</span>
        <select class="rounded-sm border border-border bg-panel px-2 py-0.5 text-text" [value]="outputFormat()" (change)="outputFormat.set($any($event.target).value)">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
        <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10" (click)="resize()">Resize</button>
        <app-preview-background [(value)]="previewBg" />
      </div>

      @if (resultUrl(); as url) {
        <div class="flex items-center gap-3">
          <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10" (click)="download()">Download</button>
        </div>
        <img [src]="url" alt="Resized preview" [appPreviewBackground]="previewBg()" class="max-h-96 max-w-full rounded-sm border border-border object-contain" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex overflow-hidden rounded-sm border border-border text-ui text-text-muted">
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'env-to-json'"
        [class.text-on-accent]="direction() === 'env-to-json'"
        [class.text-text-muted]="direction() !== 'env-to-json'"
        (click)="setDirection('env-to-json')"
      >
        .env → JSON
      </button>
      <button
        type="button"
        class="px-2 py-0.5"
        [class.bg-accent]="direction() === 'json-to-env'"
        [class.text-on-accent]="direction() === 'json-to-env'"
        [class.text-text-muted]="direction() !== 'json-to-env'"
        (click)="setDirection('json-to-env')"
      >
        JSON → .env
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-ui text-text-muted">{{ direction() === 'env-to-json' ? '.env input' : 'JSON input' }}</span>
        <app-open-text-file
          #open
          [text]="input()"
          [accept]="direction() === 'json-to-env' ? '.json' : undefined"
          (textLoaded)="input.set($event)"
        />
      </div>
      <textarea
        rows="8"
        [appTextFileDrop]="open"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="input()"
        (input)="onInput($event)"
      ></textarea>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
          <pre class="whitespace-pre-wrap font-mono text-xs text-text">{{ current.output }}</pre>
          <span class="flex shrink-0 items-center gap-1.5">
            <app-save-text-file
              [text]="current.output"
              [source]="open"
              [extension]="direction() === 'env-to-json' ? '.json' : '.env'"
              [mimeType]="direction() === 'env-to-json' ? 'application/json;charset=utf-8' : 'text/plain;charset=utf-8'"
            />
            <app-copy-button [text]="current.output" />
          </span>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

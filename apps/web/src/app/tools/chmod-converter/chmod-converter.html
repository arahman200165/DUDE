<app-tool-shell>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-4">
      <label class="flex items-center gap-1.5 text-ui text-text-muted">
        Octal
        <input
          type="text"
          class="w-20 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="octalInput()"
          (input)="onOctalInput($event)"
        />
      </label>

      <label class="flex items-center gap-1.5 text-ui text-text-muted">
        Symbolic
        <input
          type="text"
          class="w-32 rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="symbolicInput()"
          (input)="onSymbolicInput($event)"
        />
      </label>
    </div>

    @if (octalError() !== '') {
      <p class="text-ui text-danger">{{ octalError() }}</p>
    }
    @if (symbolicError() !== '') {
      <p class="text-ui text-danger">{{ symbolicError() }}</p>
    }

    <div class="overflow-auto rounded-sm border border-border">
      <table class="w-full min-w-full border-collapse text-left text-xs">
        <thead class="bg-panel-elevated text-text-muted">
          <tr>
            <th class="border-b border-border px-2 py-1 font-medium"></th>
            @for (bit of bits; track bit.bit) {
              <th class="border-b border-border px-2 py-1 text-center font-medium">{{ bit.label }}</th>
            }
          </tr>
        </thead>
        <tbody class="text-text">
          @for (scope of scopes; track scope) {
            <tr class="odd:bg-panel even:bg-panel-elevated/40">
              <td class="border-b border-border px-2 py-1 font-medium capitalize">{{ scope }}</td>
              @for (bit of bits; track bit.bit) {
                <td class="border-b border-border px-2 py-1 text-center">
                  <input type="checkbox" [checked]="isChecked(scope, bit.bit)" (change)="toggleBit(scope, bit.bit)" />
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex flex-wrap items-center gap-4 text-ui text-text-muted">
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="permissions().special.setuid" (change)="toggleSpecial('setuid')" />
        setuid
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="permissions().special.setgid" (change)="toggleSpecial('setgid')" />
        setgid
      </label>
      <label class="flex items-center gap-1.5">
        <input type="checkbox" [checked]="permissions().special.sticky" (change)="toggleSpecial('sticky')" />
        sticky
      </label>
    </div>
  </div>
</app-tool-shell>

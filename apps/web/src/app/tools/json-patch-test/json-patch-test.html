<app-tool-shell>
  <div class="flex h-full min-h-0 flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <span>Applies an RFC 6902 JSON Patch to a JSON document.</span>

      <button
        type="button"
        class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated"
        (click)="clear()"
      >
        Clear
      </button>

      @if (usesWorker() && job(); as currentJob) {
        <app-busy-indicator [status]="currentJob.status()" [progress]="currentJob.progress()" />
      }
    </div>

    <div class="grid min-h-0 flex-1 grid-cols-1 gap-3 md:grid-cols-2">
      <div class="flex min-h-0 flex-col gap-1">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-ui text-text-muted">Document</span>
          <app-open-text-file #openDocument [text]="documentInput()" (textLoaded)="documentInput.set($event)" />
        </div>
        <textarea
          [appTextFileDrop]="openDocument"
          class="h-full min-h-32 w-full resize-none rounded-sm border border-border bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="Paste the JSON document here…"
          [value]="documentInput()"
          (input)="onDocumentInputChange($event)"
        ></textarea>
      </div>

      <div class="flex min-h-0 flex-col gap-1">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-ui text-text-muted">Patch</span>
          <app-open-text-file #openPatch [text]="patchInput()" (textLoaded)="patchInput.set($event)" />
        </div>
        <textarea
          [appTextFileDrop]="openPatch"
          class="h-full min-h-32 w-full resize-none rounded-sm border border-border bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder='Paste a JSON Patch array here, e.g. [{"op":"replace","path":"/a","value":2}]'
          [value]="patchInput()"
          (input)="onPatchInputChange($event)"
        ></textarea>
      </div>
    </div>

    <div class="min-h-0 flex-1 rounded-sm border border-border bg-panel">
      @if (usesWorker() && job()?.error(); as workerError) {
        <div class="p-2">
          <app-error-panel [message]="workerError" />
        </div>
      } @else if (result(); as current) {
        @if (current.ok) {
          <div class="flex h-full flex-col">
            <div class="flex items-center justify-between px-2 pt-1.5">
              <span class="text-ui text-text-muted">Result</span>
              <span class="flex items-center gap-1.5">
                <app-save-text-file [text]="current.output" [source]="openDocument" mimeType="application/json;charset=utf-8" />
                <button
                  type="button"
                  class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated"
                  (click)="copy(current.output)"
                >
                  Copy
                </button>
              </span>
            </div>
            <textarea
              readonly
              class="h-full w-full flex-1 resize-none bg-panel px-2 py-1.5 font-mono text-xs text-text focus:outline-none"
              [value]="current.output"
            ></textarea>
          </div>
        } @else {
          <div class="p-2">
            <app-error-panel [message]="current.error.message" />
          </div>
        }
      }
    </div>
  </div>
</app-tool-shell>

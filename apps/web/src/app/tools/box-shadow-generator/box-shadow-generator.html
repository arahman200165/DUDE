<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-3">
      @for (layer of layers(); track $index; let i = $index) {
        <div class="flex flex-col gap-2 rounded-sm border border-border bg-panel p-2">
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">Layer {{ i + 1 }}</span>
            @if (layers().length > 1) {
              <button type="button" class="text-ui text-text-muted hover:text-error" (click)="removeLayer(i)">Remove</button>
            }
          </div>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              Offset X
              <input type="number" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="layer.offsetX" (input)="numberInput(i, 'offsetX', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              Offset Y
              <input type="number" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="layer.offsetY" (input)="numberInput(i, 'offsetY', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              Blur
              <input type="number" min="0" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="layer.blur" (input)="numberInput(i, 'blur', $event)" />
            </label>
            <label class="flex flex-col gap-0.5 text-ui text-text-muted">
              Spread
              <input type="number" class="rounded-sm border border-border bg-bg px-1 py-0.5 text-xs text-text" [value]="layer.spread" (input)="numberInput(i, 'spread', $event)" />
            </label>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 text-ui text-text-muted">
              Color
              <input type="text" class="w-40 rounded-sm border border-border bg-bg px-1 py-0.5 font-mono text-xs text-text" [value]="layer.color" (input)="colorInput(i, $event)" />
            </label>
            <label class="flex items-center gap-1 text-ui text-text-muted">
              <input type="checkbox" [checked]="layer.inset" (change)="insetToggle(i, $event)" />
              Inset
            </label>
          </div>
        </div>
      }
      <button type="button" class="self-start rounded-sm border border-border px-2 py-1 text-ui text-text-muted hover:bg-panel-elevated" (click)="addLayer()">
        + Add layer
      </button>

      <div class="flex items-center justify-between rounded-sm border border-border bg-panel px-2 py-1">
        <code class="flex-1 truncate font-mono text-xs text-text">{{ declaration() }}</code>
        <app-copy-button [text]="declaration()" />
      </div>
    </div>

    <div class="h-64 overflow-hidden rounded-sm border border-border md:h-full">
      <app-css-preview-sandbox [css]="previewCss()" [html]="previewHtml" />
    </div>
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <textarea
      rows="16"
      class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
      placeholder="Paste HTML…"
      [value]="input()"
      (input)="onInputChange($event)"
    ></textarea>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="overflow-auto rounded-sm border border-border bg-panel p-2">
          <app-tree-view [nodes]="current.nodes" />
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

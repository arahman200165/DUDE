<app-tool-shell>
  <div class="flex flex-col gap-3">
    @if (rejection(); as message) {
      <app-error-panel [message]="message" />
    }

    <app-file-drop accept="image/*" label="Drop an image here, or click to browse" (fileSelected)="onFileSelected($event)" (rejected)="onRejected($event)" />

    @if (sourceUrl(); as url) {
      <p class="text-ui text-text-muted">Drag over the image below to select a crop area, then click Crop.</p>

      <div
        class="relative inline-block w-fit touch-none select-none"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointerleave)="onPointerUp()"
      >
        <img #previewImage [src]="url" [appPreviewBackground]="previewBg()" alt="Crop source" class="max-h-[32rem] max-w-full rounded-sm border border-border" draggable="false" />
        @if (displayRect(); as rect) {
          <div
            class="pointer-events-none absolute border-2 border-accent bg-accent/20"
            [style.left.px]="rect.x"
            [style.top.px]="rect.y"
            [style.width.px]="rect.width"
            [style.height.px]="rect.height"
          ></div>
        }
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10" (click)="crop()">Crop</button>
        @if (resultUrl()) {
          <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-accent hover:bg-accent/10" (click)="download()">Download</button>
        }
        <app-preview-background [(value)]="previewBg" />
      </div>

      @if (resultUrl(); as croppedUrl) {
        <img [src]="croppedUrl" alt="Cropped result" [appPreviewBackground]="previewBg()" class="max-h-96 max-w-full rounded-sm border border-border object-contain" />
      }
    }
  </div>
</app-tool-shell>

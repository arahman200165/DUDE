<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Accept header</span>
        <app-copy-button [text]="raw()" />
      </div>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="raw()"
        (input)="onRawChange($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Media types</span>
      <app-key-value-editor
        [pairs]="pairs()"
        (pairsChange)="onPairsChange($event)"
        keyPlaceholder="type/subtype"
        valuePlaceholder="q (0-1, blank = 1)"
        addLabel="Add media type"
        emptyMessage="No media types — add one below."
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">Preference order (highest q first)</span>
      <ol class="flex flex-col gap-1 text-xs">
        @for (entry of sorted(); track entry.key; let i = $index) {
          <li class="flex items-center gap-2 rounded-sm border border-border bg-panel px-2 py-1">
            <span class="text-text-muted">{{ i + 1 }}.</span>
            <span class="font-mono text-text">{{ entry.key }}</span>
            <span class="text-text-muted">q={{ entry.value || '1' }}</span>
          </li>
        } @empty {
          <li class="text-text-muted">No media types.</li>
        }
      </ol>
    </div>
  </div>
</app-tool-shell>

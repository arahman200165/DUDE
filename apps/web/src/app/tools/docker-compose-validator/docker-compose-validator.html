<app-tool-shell>
  <div class="flex flex-col gap-4 md:flex-row">
    <div class="flex flex-1 flex-col gap-2">
      <textarea
        rows="14"
        class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="input()"
        (input)="onInput($event)"
      ></textarea>

      @if (result(); as current) {
        @if (current.ok) {
          @if (current.issues.length === 0) {
            <div class="rounded-sm border border-border bg-panel px-2 py-1.5 text-ui text-text">No issues found.</div>
          } @else {
            <ul class="flex flex-col gap-1">
              @for (issue of current.issues; track issue.path) {
                <li class="rounded-sm border border-border bg-panel px-2 py-1 text-ui text-text">
                  <span class="font-mono text-xs text-text-muted">{{ issue.path }}</span> — {{ issue.message }}
                </li>
              }
            </ul>
          }
        } @else {
          <app-error-panel [message]="current.error" />
        }
      }
    </div>

    <div class="flex-1 overflow-auto rounded-sm border border-border p-2">
      <app-tree-view [nodes]="treeNodes()" />
    </div>
  </div>
</app-tool-shell>

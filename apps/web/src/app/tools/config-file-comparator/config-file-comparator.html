<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Format
      <select
        class="w-32 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="format()"
        (change)="onFormatChange($event)"
      >
        <option value="env">.env</option>
        <option value="ini">INI</option>
        <option value="properties">.properties</option>
      </select>
    </label>

    <div class="flex flex-col gap-4 md:flex-row">
      <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
        Before
        <textarea
          rows="8"
          class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="before()"
          (input)="onBeforeInput($event)"
        ></textarea>
      </label>
      <label class="flex flex-1 flex-col gap-1 text-ui text-text-muted">
        After
        <textarea
          rows="8"
          class="w-full resize-y rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
          [value]="after()"
          (input)="onAfterInput($event)"
        ></textarea>
      </label>
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <app-diff-view [entries]="current.diff.entries" [summary]="current.diff.summary" />
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>

<app-tool-shell>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="flex flex-col gap-2">
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:title
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().title" (input)="onInput('title', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:description
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().description" (input)="onInput('description', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:image (URL)
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().image" (input)="onInput('image', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:url
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().url" (input)="onInput('url', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:site_name
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().siteName" (input)="onInput('siteName', $event)" />
      </label>
      <label class="flex flex-col gap-0.5 text-ui text-text-muted">
        og:type
        <input type="text" class="rounded-sm border border-border bg-panel px-2 py-1 text-xs text-text" [value]="settings().type" (input)="onInput('type', $event)" />
      </label>

      <div class="flex items-start justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1">
        <pre class="flex-1 overflow-auto whitespace-pre-wrap font-mono text-xs text-text">{{ output() }}</pre>
        <app-copy-button [text]="output()" />
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <span class="text-ui text-text-muted">Card preview</span>
      <div class="max-w-sm overflow-hidden rounded-sm border border-border bg-panel">
        @if (settings().image !== '') {
          <img [src]="settings().image" alt="" class="h-48 w-full object-cover" />
        } @else {
          <div class="flex h-48 w-full items-center justify-center bg-panel-elevated text-ui text-text-muted">No image</div>
        }
        <div class="flex flex-col gap-1 p-3">
          @if (hostname()) {
            <span class="text-ui uppercase tracking-wide text-text-muted">{{ hostname() }}</span>
          }
          <span class="truncate text-sm font-medium text-text">{{ settings().title || 'Title' }}</span>
          <span class="line-clamp-2 text-ui text-text-muted">{{ settings().description || 'Description' }}</span>
        </div>
      </div>
    </div>
  </div>
</app-tool-shell>

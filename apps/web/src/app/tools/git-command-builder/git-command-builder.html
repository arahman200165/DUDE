<app-tool-shell>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-ui text-text-muted">
      Subcommand
      <select
        class="w-48 rounded-sm border border-border bg-panel px-2 py-0.5 text-ui text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="subcommand()"
        (change)="onSubcommandChange($event)"
      >
        @for (sub of subcommands; track sub) {
          <option [value]="sub">{{ sub }}</option>
        }
      </select>
    </label>

    <div class="flex flex-wrap items-end gap-3">
      @for (field of fields(); track field.id) {
        @if (field.type === 'text') {
          <label class="flex flex-col gap-1 text-ui text-text-muted">
            {{ field.label }}
            <input
              type="text"
              class="w-56 rounded-sm border border-border bg-panel px-2 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
              [placeholder]="field.placeholder ?? ''"
              [value]="textValue(field.id)"
              (input)="onTextInput(field.id, $event)"
            />
          </label>
        } @else {
          <label class="flex items-center gap-1.5 text-ui text-text-muted">
            <input type="checkbox" [checked]="booleanValue(field.id)" (change)="onBooleanToggle(field.id, $event)" />
            {{ field.label }}
          </label>
        }
      }
    </div>

    <div class="flex items-center justify-between gap-2 rounded-sm border border-border bg-panel px-2 py-1.5">
      <span class="font-mono text-xs text-text">{{ command() }}</span>
      <app-copy-button [text]="command()" />
    </div>
  </div>
</app-tool-shell>

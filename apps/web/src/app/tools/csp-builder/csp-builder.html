<app-tool-shell>
  <div class="flex h-full flex-col gap-3">
    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="text-ui text-text-muted">Content-Security-Policy header</span>
        <app-copy-button [text]="raw()" />
      </div>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [value]="raw()"
        (input)="onRawChange($event)"
      />
    </div>

    @if (warnings().length > 0) {
      <div class="flex flex-col gap-1 rounded-sm border border-warning/40 bg-warning/10 px-2 py-1.5 text-ui text-warning">
        @for (warning of warnings(); track warning) {
          <div>{{ warning }}</div>
        }
      </div>
    }

    <div class="flex flex-col gap-2 overflow-auto">
      @for (def of directiveDefs; track def.name) {
        <div class="flex items-center gap-2 text-ui text-text-muted">
          <label class="flex w-44 shrink-0 items-center gap-1.5">
            <input type="checkbox" [checked]="directiveFor(def.name) !== undefined" (change)="toggleDirective(def.name, $event)" />
            <span class="font-mono">{{ def.name }}</span>
          </label>
          @if (def.hasValues && directiveFor(def.name); as directive) {
            <input
              type="text"
              class="flex-1 rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
              placeholder="'self' https://cdn.example.com"
              [value]="directive.values.join(' ')"
              (input)="setDirectiveValues(def.name, $event)"
            />
          }
        </div>
      }
    </div>
  </div>
</app-tool-shell>

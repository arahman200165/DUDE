<div class="flex flex-col gap-4">
  <label data-setting class="flex items-center gap-2 text-ui text-text">
    <input type="checkbox" class="accent-accent" [checked]="workspaceLayout.reopenOnRestart()" (change)="onReopenOnRestartToggle($event)" />
    Reopen my tabs on restart
  </label>

  @if (platform.isDesktop()) {
    <label data-setting class="flex flex-col gap-1 text-ui text-text">
      Startup destination
      <select class="w-fit rounded-sm border border-border bg-panel px-2 py-1" [value]="desktopPrefs.current().startupDestination" (change)="onStartupDestinationChange($event)">
        <option value="deck">Tool deck</option>
        <option value="workspace">Restored workspace</option>
      </select>
    </label>

    <div data-setting class="flex flex-col gap-1">
      <span class="text-ui text-text">Setup wizard</span>
      <button type="button" class="w-fit rounded-sm border border-accent px-2 py-0.5 text-ui text-accent hover:bg-accent/10" (click)="onboarding.open()">
        Run setup wizard again
      </button>
    </div>
  }

  <div class="flex items-center gap-3 border-t border-border pt-4">
    <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-ui text-text-muted hover:bg-panel-elevated" (click)="resetToDefaults()">
      Reset to defaults
    </button>
    @if (message()) {
      <span class="text-ui text-info" role="status">{{ message() }}</span>
    }
  </div>
</div>

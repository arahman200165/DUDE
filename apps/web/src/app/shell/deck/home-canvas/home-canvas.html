@if (cells().length > 0) {
  <div
    class="grid gap-2"
    style="grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(1.75rem, auto)"
    data-testid="home-canvas"
    [attr.data-width]="width()"
  >
    @for (cell of cells(); track cell.instance.id) {
      <div
        class="min-w-0"
        [style.grid-column]="cell.placement.x + 1 + ' / span ' + cell.placement.w"
        [style.grid-row]="cell.placement.y + 1 + ' / span ' + cell.placement.h"
        [attr.data-panel-kind]="cell.def.id"
        [attr.data-panel-instance]="cell.instance.id"
      >
        <app-panel-host [cell]="cell" />
      </div>
    }
  </div>
} @else {
  <div class="rounded-sm border border-border bg-panel px-3 py-3 text-ui text-text-muted" role="status" data-testid="home-empty">
    Nothing to show on Home right now. Restore the default arrangement in
    <a routerLink="/settings/general" class="text-accent hover:underline">Settings</a>.
  </div>
}

<div class="flex flex-col gap-1">
  @if (entries().length === 0) {
    <p class="text-ui text-text-muted">
      Nothing recent yet — open a tool, run a pipeline, or check something into History.
    </p>
  }

  @for (entry of entries(); track trackEntry(entry)) {
    <button
      type="button"
      class="flex items-center gap-2 rounded-sm border border-border bg-panel-elevated px-2 py-1.5 text-left hover:border-accent"
      (click)="open(entry)"
    >
      <span class="shrink-0 rounded-sm border border-border px-1.5 py-0.5 text-ui-xs text-text-muted">{{ kindLabels[entry.kind] }}</span>
      <span class="min-w-0 flex-1 truncate text-ui-sm text-text">{{ entry.title }}</span>
      <span class="shrink-0 text-ui-xs text-text-muted">{{ entry.at | date: 'short' }}</span>
    </button>
  }
</div>

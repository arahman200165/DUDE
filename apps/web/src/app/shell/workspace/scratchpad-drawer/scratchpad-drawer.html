<div class="flex flex-col border-t border-border bg-panel">
  <button
    type="button"
    class="flex items-center justify-between px-3 py-1 text-ui-sm text-text-muted hover:bg-panel-elevated hover:text-text"
    (click)="toggle()"
  >
    <span>{{ scratchpad.drawerExpanded() ? '▾' : '▸' }} Scratchpad</span>
    <span class="text-ui-xs">{{ scratchpad.snippets().length }} snippet{{ scratchpad.snippets().length === 1 ? '' : 's' }}</span>
  </button>

  @if (scratchpad.drawerExpanded()) {
    <div class="flex max-h-64 flex-col gap-2 overflow-y-auto border-t border-border p-2">
      <button
        type="button"
        class="w-fit rounded-sm border border-accent px-2 py-0.5 text-ui-xs text-accent hover:bg-accent/10"
        (click)="addBlank()"
      >
        + New note
      </button>

      @if (scratchpad.snippets().length === 0) {
        <p class="px-1 text-ui text-text-muted">Nothing saved yet — use "Send to scratchpad" on any tool.</p>
      }

      @for (snippet of scratchpad.snippets(); track snippet.id) {
        <div class="rounded-sm border border-border bg-panel-elevated p-2">
          @if (editingId() === snippet.id) {
            <input
              type="text"
              class="mb-1 w-full rounded-sm border border-border bg-panel px-1.5 py-0.5 text-ui-sm text-text focus:outline-none focus:ring-1 focus:ring-accent"
              [value]="draftTitle()"
              (input)="onTitleInput($event)"
            />
            <textarea
              rows="3"
              class="mb-1 w-full rounded-sm border border-border bg-panel px-1.5 py-0.5 font-mono text-ui-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
              [value]="draftBody()"
              (input)="onBodyInput($event)"
            ></textarea>
            <div class="flex gap-2">
              <button type="button" class="rounded-sm border border-accent px-2 py-0.5 text-ui-xs text-accent hover:bg-accent/10" (click)="saveEdit()">
                Save
              </button>
              <button type="button" class="rounded-sm border border-border px-2 py-0.5 text-ui-xs hover:bg-panel" (click)="cancelEdit()">
                Cancel
              </button>
            </div>
          } @else {
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <p class="truncate text-ui-sm font-semibold text-text">{{ snippet.title }}</p>
                <p class="line-clamp-2 whitespace-pre-wrap text-ui-xs text-text-muted">{{ snippet.body }}</p>
              </div>
              <div class="flex shrink-0 gap-1">
                <button type="button" class="rounded-sm px-1.5 py-0.5 text-ui-xs text-text-muted hover:bg-panel hover:text-text" (click)="copy(snippet.body)">
                  Copy
                </button>
                <button type="button" class="rounded-sm px-1.5 py-0.5 text-ui-xs text-text-muted hover:bg-panel hover:text-text" (click)="startEdit(snippet)">
                  Edit
                </button>
                <button type="button" class="rounded-sm px-1.5 py-0.5 text-ui-xs text-text-muted hover:bg-panel hover:text-error" (click)="remove(snippet.id)">
                  Delete
                </button>
              </div>
            </div>
          }
        </div>
      }
    </div>
  }
</div>

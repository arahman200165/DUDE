<span class="inline-flex items-center gap-1.5 font-mono text-ui" [attr.data-status]="status()">
  @switch (status()) {
    @case ('running') {
      <span class="inline-flex items-center gap-1.5 text-busy">
        <app-status-glyph kind="busy" />
        <span>Running{{ progress() !== null ? ' — ' + progress() + '%' : '…' }}</span>
      </span>
    }
    @case ('done') {
      <span class="inline-flex items-center gap-1.5 text-success">
        <app-status-glyph kind="success" />
        <span>Done</span>
      </span>
    }
    @case ('error') {
      <span class="inline-flex items-center gap-1.5 text-error">
        <app-status-glyph kind="error" />
        <span>Failed</span>
      </span>
    }
    @case ('cancelled') {
      <span class="inline-flex items-center gap-1.5 text-text-muted">
        <app-status-glyph kind="cancelled" />
        <span>Cancelled</span>
      </span>
    }
    @default {
      <span class="inline-flex items-center gap-1.5 text-text-muted">
        <app-status-glyph kind="idle" />
        <span>Idle</span>
      </span>
    }
  }
</span>

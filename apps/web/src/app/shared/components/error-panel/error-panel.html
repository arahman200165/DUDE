<div class="rounded-sm border border-error/40 bg-error/10 px-2 py-1.5 text-ui text-error">
  <p class="flex items-start gap-1.5">
    <app-status-glyph class="mt-0.5" kind="error" />
    <span>{{ message() }}</span>
  </p>
  @if (retryable()) {
    <button
      type="button"
      class="mt-1 rounded-sm border border-error/40 px-1.5 py-0.5 text-ui-xs uppercase tracking-wide text-error hover:bg-error/20"
      (click)="retry.emit()"
    >
      Retry
    </button>
  }
</div>

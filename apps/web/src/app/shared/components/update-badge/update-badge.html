@if (updateAvailable() && !updateReady()) {
  <div class="flex items-center gap-2 rounded border border-info/40 bg-info/10 px-2 py-1 text-ui text-text">
    <span class="inline-flex items-center gap-1.5"><app-status-glyph kind="info" class="text-info" />Update available</span>
    <button type="button" class="rounded-sm border border-info/40 px-1.5 py-0.5 text-ui-xs uppercase" (click)="download()">Download</button>
  </div>
}
@if (updateReady()) {
  <div class="flex items-center gap-2 rounded border border-info/40 bg-info/10 px-2 py-1 text-ui text-text">
    <span class="inline-flex items-center gap-1.5"><app-status-glyph kind="info" class="text-info" />Update available</span>
    <button
      type="button"
      class="rounded-sm border border-info/40 px-1.5 py-0.5 text-ui-xs uppercase tracking-wide text-text hover:bg-info/20"
      (click)="activate()"
    >
      {{ actionLabel() }}
    </button>
  </div>
}

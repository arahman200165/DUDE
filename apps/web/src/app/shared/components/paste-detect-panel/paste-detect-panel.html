<textarea
  rows="8"
  class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
  placeholder="Paste anything…"
  [value]="input()"
  (input)="onInputChange($event)"
></textarea>

@if (input().trim() !== '') {
  @if (matches().length > 0) {
    <ul class="flex flex-col gap-2">
      @for (match of matches(); track match.toolId) {
        <li class="flex items-center justify-between rounded-sm border border-border bg-panel-elevated px-3 py-2">
          <span class="text-ui font-medium text-text">{{ match.title }}</span>
          <button
            type="button"
            class="rounded-sm border border-accent/40 bg-accent/10 px-2 py-1 text-ui-sm text-accent hover:bg-accent/20"
            (click)="open(match.toolId)"
          >
            Open in {{ match.title }}
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="text-ui text-text-muted">No recognized shape yet — keep typing, or try a different value.</p>
  }
}

<div #container class="flex h-full w-full min-h-0 overflow-hidden">
  <div class="min-w-0 overflow-auto" [style.width.%]="ratio() * 100">
    <ng-content select="[slot=start]" />
  </div>

  <div
    class="flex w-2.5 shrink-0 cursor-col-resize touch-none items-stretch justify-center hover:bg-accent/20"
    [class]="dragging() ? 'bg-accent/20' : ''"
    (pointerdown)="onDividerPointerDown($event)"
    (pointermove)="onDividerPointerMove($event)"
    (pointerup)="onDividerPointerUp($event)"
    (pointercancel)="onDividerPointerUp($event)"
  >
    <div class="w-px bg-border" [class.bg-accent]="dragging()"></div>
  </div>

  <div class="min-w-0 flex-1 overflow-auto">
    <ng-content select="[slot=end]" />
  </div>
</div>
